<title>회계감사 앞글자</title>
<style>
:root{
  --ink:#14202B; --ink2:#3A4A5C; --mut:#6E7C8A;
  --paper:#EDF0F3; --surf:#FFFFFF; --line:#D5DCE3;
  --acc:#1B5E8C; --acc-s:#E8F0F6;
  --ok:#126E5F; --ok-s:#E2F0ED;
  --shk:#9A6300; --shk-s:#F6EEDD;
  --bad:#A83544; --bad-s:#F7E7E9;
  --rad:10px;
}
html[data-dark="1"]{
  --ink:#E7ECF1; --ink2:#B4C0CC; --mut:#8494A2;
  --paper:#101820; --surf:#18232E; --line:#2B3A47;
  --acc:#6FB3DE; --acc-s:#1B2C39;
  --ok:#5FC3AF; --ok-s:#132A28;
  --shk:#D9A441; --shk-s:#2B2416;
  --bad:#E8848F; --bad-s:#2E1B1F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.62;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* ---- top bar ---- */
header{
  position:sticky;top:0;z-index:40;background:var(--surf);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);
}
.hd{display:flex;align-items:center;gap:10px;padding:11px 14px 9px;max-width:720px;margin:0 auto}
.logo{font-weight:800;font-size:16px;letter-spacing:-.02em;flex:1}
.logo b{color:var(--acc)}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink2);background:var(--surf)}
.iconbtn:active{background:var(--paper)}

/* ---- nav ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surf);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nv{display:flex;max-width:720px;margin:0 auto}
.nv button{flex:1;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--mut);
  display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid transparent;margin-top:-1px}
.nv button .ic{font-size:17px;line-height:1}
.nv button[aria-current="true"]{color:var(--acc);border-top-color:var(--acc)}

/* ---- generic ---- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);padding:14px}
.sec{margin:16px 0}
h2.t{font-size:13px;font-weight:700;color:var(--mut);margin:0 0 8px;letter-spacing:.01em}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.mut{color:var(--mut)}
.sm{font-size:13px}
.xs{font-size:12px}

/* ---- mnemonic hero ---- */
.code{
  font-size:27px;font-weight:800;line-height:1.4;letter-spacing:.06em;
  color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;
}
.code .tok{display:inline-block;margin:0 .18em .1em 0}
.code .hid{color:transparent;background:var(--line);border-radius:5px;
  box-shadow:inset 0 0 0 1px var(--line)}
.codebar{height:3px;background:var(--acc);width:44px;border-radius:2px;margin-top:12px;opacity:.85}

/* ---- 빈칸채우기 ---- */
.blank{background:var(--line);color:transparent;border-radius:4px;padding:0 1px;
  cursor:pointer;transition:.12s;box-shadow:inset 0 0 0 1px var(--line)}
.blank.rev{background:var(--ok-s);color:var(--ok);font-weight:700;box-shadow:inset 0 0 0 1px var(--ok)}

/* ---- 새 주제 추가 ---- */
.addbtn{width:100%;padding:11px;border-radius:9px;border:1.5px dashed var(--line);
  background:transparent;color:var(--mut);font-size:13.5px;font-weight:700}
label.fl{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 5px}
label.fl:first-child{margin-top:0}

/* ---- badges ---- */
.bg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.bg.p{background:var(--ok-s);color:var(--ok)}
.bg.s{background:var(--shk-s);color:var(--shk)}
.bg.w{background:var(--bad-s);color:var(--bad)}
.bg.n{background:var(--paper);color:var(--mut);border-color:var(--line)}
.bg.a{background:var(--acc-s);color:var(--acc)}

/* ---- status buttons ---- */
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat button{padding:10px 4px;border-radius:9px;border:1px solid var(--line);
  background:var(--surf);font-size:12.5px;font-weight:700;color:var(--mut)}
.stat button[data-on="1"].p{background:var(--ok);border-color:var(--ok);color:#fff}
.stat button[data-on="1"].s{background:var(--shk);border-color:var(--shk);color:#fff}
.stat button[data-on="1"].w{background:var(--bad);border-color:var(--bad);color:#fff}
.stat button[data-on="1"].n{background:var(--ink2);border-color:var(--ink2);color:#fff}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 16px;border-radius:9px;font-weight:700;font-size:14.5px;
  background:var(--acc);color:#fff;border:1px solid var(--acc)}
.btn.g{background:var(--surf);color:var(--ink2);border-color:var(--line)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.btn:active{transform:translateY(1px)}

/* ---- filters ---- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 11px;border-radius:18px;border:1px solid var(--line);
  background:var(--surf);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surf)}
select,input[type=text],input[type=search]{
  width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--surf);font-size:14px}
textarea{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);
  background:var(--surf);font-size:14.5px;line-height:1.65;resize:vertical;min-height:120px}

/* ---- list ---- */
.item{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);
  padding:11px 12px;margin-bottom:7px;display:block;width:100%;text-align:left}
.item .tp{font-size:14px;font-weight:600;line-height:1.45;word-break:keep-all}
.item .cd{font-size:15px;font-weight:800;letter-spacing:.04em;color:var(--acc);margin-top:5px;word-break:keep-all}
.item .mt{font-size:11.5px;color:var(--mut);margin-top:5px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:6px}
.dot.p{background:var(--ok)} .dot.s{background:var(--shk)}
.dot.w{background:var(--bad)} .dot.n{background:var(--line)}

/* ---- answer compare ---- */
.cmp{display:grid;gap:10px;margin-top:12px}
@media(min-width:620px){.cmp{grid-template-columns:1fr 1fr}}
.pane{border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
.pane .ph{padding:7px 11px;font-size:11.5px;font-weight:700;border-bottom:1px solid var(--line)}
.pane .pb{padding:11px;font-size:14px;line-height:1.68;white-space:pre-wrap;word-break:keep-all}
.pane.mine .ph{background:var(--acc-s);color:var(--acc)}
.pane.model .ph{background:var(--ok-s);color:var(--ok)}
.kw{margin:0;padding:0;list-style:none}
.kw li{font-size:13.5px;padding:5px 0 5px 15px;position:relative;border-bottom:1px dashed var(--line);word-break:keep-all}
.kw li:last-child{border-bottom:none}
.kw li::before{content:"";position:absolute;left:2px;top:13px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.kw li.y::before{background:var(--ok)}
.kw li.n::before{background:var(--line)}
.kw li.n{color:var(--mut)}
.kw li .tick{float:right;font-size:11px;font-weight:800;margin-left:8px}
.kw li.y .tick{color:var(--ok)} .kw li.n .tick{color:var(--mut)}

/* ---- 앞글자 채점 ---- */
.syls{display:flex;flex-wrap:wrap;gap:5px}
.syl{width:31px;height:31px;border-radius:7px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.syl.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.syl.part{background:var(--shk-s);border-color:var(--shk);color:var(--shk)}
.syl.miss{background:var(--paper);border-color:var(--line);color:var(--mut)}
.legend{font-size:11.5px;color:var(--mut);margin-top:9px;line-height:1.6}
mark{background:var(--ok-s);color:var(--ok);border-radius:3px;padding:0 2px;font-weight:600}
.big{font-size:23px;font-weight:800;line-height:1}

/* ---- quiz ---- */
.opt{width:100%;text-align:left;padding:13px 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--surf);margin-bottom:8px;font-size:15px;font-weight:600;line-height:1.5;
  display:flex;gap:10px;word-break:keep-all}
.opt .n{flex:0 0 22px;height:22px;border-radius:6px;background:var(--paper);color:var(--mut);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.opt[data-r="ok"]{border-color:var(--ok);background:var(--ok-s)}
.opt[data-r="ok"] .n{background:var(--ok);color:#fff}
.opt[data-r="no"]{border-color:var(--bad);background:var(--bad-s)}
.opt[data-r="no"] .n{background:var(--bad);color:#fff}
.opt[data-r="dim"]{opacity:.5}
.fb{border-radius:10px;padding:12px;margin:2px 0 12px;border:1px solid}
.fb.ok{background:var(--ok-s);border-color:var(--ok);color:var(--ok)}
.fb.no{background:var(--bad-s);border-color:var(--bad);color:var(--bad)}
.fb b{font-size:15px}

/* ---- meters ---- */
.meter{height:7px;border-radius:4px;background:var(--paper);overflow:hidden;display:flex;border:1px solid var(--line)}
.meter i{display:block;height:100%}
.meter i.p{background:var(--ok)} .meter i.s{background:var(--shk)} .meter i.w{background:var(--bad)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);padding:11px 6px;text-align:center}
.kpi b{display:block;font-size:20px;font-weight:800;line-height:1.2}
.kpi span{font-size:11px;color:var(--mut)}

/* ---- misc ---- */
.empty{text-align:center;padding:44px 20px;color:var(--mut);font-size:14px}
.pill{font-size:11.5px;color:var(--mut);background:var(--paper);border:1px solid var(--line);
  padding:2px 7px;border-radius:6px;display:inline-block}
.warn{font-size:12.5px;color:var(--shk);background:var(--shk-s);border:1px solid var(--shk);
  border-radius:8px;padding:9px 11px;line-height:1.55}
.hide{display:none !important}
.prog{font-size:12.5px;color:var(--mut);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:13.5px;
  font-weight:600;z-index:99;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

const ANSWERS = {"t000": {"kw": ["재무제표가 재무보고체계에 따라 공정하게 작성되었는지에 대하여", "감사인이 감사를 실시하고", "감사의견을 표명함으로써", "재무제표의 신뢰성을 제고하고", "재무제표이용자가 올바른 의사결정을 하는 데 도움을 준다"], "ans": "회계감사의 목적은 재무제표가 재무보고체계에 따라 공정하게 작성되었는지에 대하여 감사인이 감사를 실시하고 감사의견을 표명함으로써, 재무제표의 신뢰성을 제고하고 재무제표이용자가 올바른 의사결정을 하는 데 도움을 주는 것이다."}, "t001": {"kw": ["이해관계의 상충(부정): 정보의 비대칭이 존재하여 정보제공자가 자신에게 유리한 방향으로 정보를 제공할 가능성", "정보의 원격성(부정): 정보이용자와 정보제공자 간의 정보제공경로가 멀어질수록 정보가 왜곡될 가능성", "거래유형의 복잡성(오류): 거래유형이 복잡해짐에 따라 회계처리의 오류발생가능성", "자료의 대량화(오류): 기업 규모가 클수록 자료가 대량화되어 오류발생가능성"], "ans": "정보위험이란 재무제표 이용자가 부정이나 오류로 인한 중요한 왜곡표시가 포함된 재무제표를 믿고 잘못된 의사결정을 할 위험을 말한다. 이러한 정보위험이 발생하는 이유는 ①이해관계의 상충으로, 정보의 비대칭(정보제공자의 정보>정보이용자의 정보)이 존재하는 상황에서 정보제공자가 자신에게 유리한 방향으로 정보를 제공할 가능성이 높기 때문이고, ②정보의 원격성으로, 정보이용자와 정보제공자 간의 정보제공경로가 멀어질수록 정보가 왜곡될 가능성이 높아지기 때문이며, ③거래유형의 복잡성으로, 기업의 거래유형이 복잡해짐에 따라 회계처리의 오류발생가능성이 높아지기 때문이고, ④자료의 대량화로, 기업의 규모가 클수록 자료가 대량화되어 재무정보의 오류발생가능성이 높아지기 때문이다."}, "t002": {"kw": ["설득적 증거: 감사증거는 결정적 증거이기보다 설득적 증거임", "위험을 영(0)으로 감소시킬 수 없음: 감사위험을 영으로 감소시키도록 기대할 수 없고 그렇게 감소시킬 수도 없음", "절대적 확신을 얻을 수 없음: 부정이나 오류로 인한 중요한 왜곡표시가 없다는 절대적 확신은 얻을 수 없음"], "ans": "회계감사에는 고유한계가 존재한다. ①감사인의 결론도출과 의견표명의 기초가 되는 대부분의 감사증거는 결정적 증거이기보다는 설득적 증거이며, ②따라서 감사위험을 영(0)으로 감소시키도록 감사인에게 기대할 수 없고 또 그렇게 감소시킬 수도 없다. ③그러므로 재무제표에 부정이나 오류로 인한 중요한 왜곡표시가 없다는 절대적 확신은 얻을 수 없다."}, "t003": {"kw": ["경영진의 판단", "주관적인 결정이나 평가", "미래의 불확실성", "특정 회계추정치(예: 대손충당금)와 같은 항목의 불확실성은 감사절차에 의해서도 제거할 수 없음"], "ans": "회계감사의 고유한계를 일으키는 원인 중 재무보고의 성격 측면에서, 재무제표를 작성할 때에는 경영진의 판단, 주관적인 결정이나 평가 또는 불확실성이 수반된다. 그 결과 특정 회계추정치(예: 대손충당금)와 같은 항목의 불확실성은 감사절차에 의해서도 제거할 수 없다."}, "t004": {"kw": ["[실무적 한계] 완전하게 제공하지 않을 경우: 경영진이 정보를 완전하게 제공하지 않으면 정보의 완전성을 확보할 수 없음", "부정의 은폐: 부정은 이를 은폐하기 위한 정교하고 치밀하게 구성된 계획이 수반됨", "발견에 효과적이지 않을 수 있음: 문서를 조작한 경우 감사절차가 의도적 왜곡표시를 발견하는 데 효과적이지 않을 수 있음", "문서 진위에 대한 훈련: 감사인은 문서의 진위에 대한 전문가로서 훈련을 받지 않았음", "[법률적 한계] 감사는 공적 수사가 아니므로 감사인에게 수색권한과 같은 특정한 법적 권한이 없음"], "ans": "감사절차의 성격으로 인한 감사의 고유한계는 실무적 한계와 법률적 한계로 구분된다. 실무적 한계로서, ①경영진이 감사인으로부터 요청받은 정보를 완전하게 제공하지 않을 경우 감사인은 정보의 완전성을 확보할 수 없으며, ②부정의 경우 부정을 은폐하기 위한 정교하고 치밀하게 구성된 계획이 수반되는데, 감사인의 감사절차는 문서를 조작하여 해당 문서가 진실하지 않음에도 진실하다고 믿게 하는 것과 같은 의도적인 왜곡표시를 발견하는 데 효과적이지 않을 수 있고, 감사인은 문서의 진위에 대한 전문가로서 훈련을 받지 않았으며 그렇게 기대될 수도 없다. 법률적 한계로서, 감사는 공적 수사가 아니므로 감사인에게 수색권한과 같은 특정한 법적 권한이 없다."}, "t005": {"kw": ["[필요성] 어려움·시간·비용의 문제 그 자체는 대체적 절차가 없는 감사절차를 생략하거나 낮은 설득력의 감사증거에 만족하는 정당한 근거가 되지 못함", "[절차] 감사가 효과적으로 수행되도록 계획함", "중요왜곡표시위험이 가장 높게 예상되는 분야에 감사노력을 집중", "모집단의 왜곡표시를 조사하기 위해 테스트(예: 표본감사)나 기타 수단을 사용"], "ans": "재무제표 이용자들은 감사인이 합리적인 기간 내에 합리적인 비용으로 재무제표에 대한 의견을 형성할 것이라 기대하며, 모든 정보를 누락 없이 추적하는 것은 실행가능하지 않음을 인식하고 있다. 그러나 어려움, 시간 또는 비용의 문제 그 자체는 감사인이 대체적인 절차가 없는 감사절차를 생략하거나 보다 설득력이 낮은 감사증거에 만족하는 정당한 근거가 되지 못한다. 이를 위해 채택하는 감사절차는 ①감사가 효과적으로 수행될 수 있도록 계획하고, ②부정이나 오류로 인한 중요왜곡표시위험이 가장 높게 예상되는 분야에 감사노력을 집중하며 그렇지 아니한 분야에는 상대적으로 적은 노력을 기울이고, ③모집단의 왜곡표시를 조사하기 위해 테스트(예: 표본감사)나 기타 수단을 사용하는 것이다."}, "t006": {"kw": ["경영진이 재무제표가 재무보고체계에 따라 작성되었다고 진술하는데 내재되어 있는", "재무제표상 정보의 인식·측정·표시 및 공시와 관련된", "명시적이거나 그렇지 아니한 진술", "감사대상은 재무제표이며 구체적으로 경영진주장을 확인하는 것이 감사목적이 됨"], "ans": "경영진주장이란 경영진이 재무제표가 해당 재무보고체계에 따라 작성되었다고 진술하는데 내재되어 있는, 재무제표상 정보의 인식·측정·표시 및 공시와 관련된 명시적이거나 그렇지 아니한 진술을 말한다. 감사대상은 재무제표이며, 구체적으로 경영진주장을 확인하는 것이 감사목적이 된다."}, "t007": {"kw": ["발생사실: 기록된 거래와 사건은 발생되었고 기업에 귀속됨", "완전성: 기록되어야 하는 모든 거래와 사건이 기록되었으며 관련 공시가 모두 포함됨", "기간귀속: 거래와 사건은 해당 보고기간에 기록됨", "분류: 거래와 사건은 적절한 계정으로 기록됨", "정확성: 기록된 거래와 사건에 관련된 금액 및 기타 데이터가 적합하게 기록되고 관련 공시가 적합하게 측정·기술됨", "표시: 거래와 사건은 적합하게 합해지거나 세분화되고 명확하게 기술되며 관련 공시가 재무보고체계 측면에서 관련성 있고 이해가능함"], "ans": "감사대상기간의 거래 및 사건 유형에 대한 경영진주장은 다음과 같다. ①발생사실(기록된 거래와 사건은 발생되었고 기업에 귀속됨), ②완전성(기록되어야 하는 모든 거래와 사건이 기록되었으며 재무제표에 포함되어야 하는 모든 관련 공시가 포함됨), ③기간귀속(거래와 사건은 해당 보고기간에 기록됨), ④분류(거래와 사건은 적절한 계정으로 기록됨), ⑤정확성(기록된 거래와 사건에 관련된 금액 및 기타 데이터는 적합하게 기록되었고 관련 공시는 적합하게 측정되고 기술됨), ⑥표시(거래와 사건은 적합하게 합해지거나 세분화되고 명확하게 기술되었으며 관련 공시는 해당 재무보고체계의 요구사항 측면에서 관련성이 있으며 이해가능함)이다."}, "t008": {"kw": ["실재성: 자산·부채 및 주주지분은 실재함", "완전성: 기록되어야 하는 모든 자산·부채 및 주주지분이 기록됨", "권리와 의무: 기업은 자산에 대한 권리를 보유·통제하며 부채는 기업의 의무임", "분류: 자산·부채 및 주주지분은 적절한 계정으로 기록됨", "정확성·평가와 배분: 적합한 금액으로 계상되고 평가·배분의 결과가 적합하게 기록됨", "표시: 적합하게 합산되거나 세분화되고 명확하게 기술되며 관련 공시가 재무보고체계 측면에서 관련성 있고 이해가능함"], "ans": "보고기간말 계정잔액에 대한 경영진주장은 다음과 같다. ①실재성(자산·부채 및 주주지분은 실재함), ②완전성(기록되어야 하는 모든 자산·부채 및 주주지분은 모두 기록되었으며 재무제표에 포함되어야 하는 모든 관련 공시가 포함됨), ③권리와 의무(기업은 자산에 대한 권리를 보유하거나 통제하고 있으며 부채는 기업의 의무임), ④분류(자산·부채 및 주주지분은 적절한 계정으로 기록됨), ⑤정확성·평가와 배분(자산·부채 및 주주지분은 적합한 금액으로 재무제표에 계상되어 있고 평가나 배분의 결과는 적합하게 기록되어 있으며 관련 공시는 적합하게 측정되고 기술됨), ⑥표시(자산·부채 및 주주지분은 적합하게 합산되거나 세분화되고 명확하게 기술되었으며 관련 공시는 해당 재무보고체계의 요구사항 측면에서 관련성이 있으며 이해가능함)이다."}, "t009": {"kw": ["[범위 이상] 공정한 표시를 달성하기 위해 경영진이 해당 체계가 요구하는 범위 이상으로 공시하는 것이 필요할 수 있다고 명시적이거나 묵시적으로 인정됨", "[이탈] 공정한 표시를 달성하기 위해 경영진이 해당 체계의 요구사항에서 이탈하는 것이 필요할 수 있다고 명시적으로 인정됨"], "ans": "공정표시 재무보고체계가 준수 재무보고체계와 구분되는 특징은 다음과 같다. ①재무제표의 공정한 표시를 달성하기 위하여 경영진이 해당체계가 특정하여 요구하는 범위 이상으로 공시하는 것이 필요할 수 있다고 명시적이거나 묵시적으로 인정되고, ②재무제표의 공정한 표시를 달성하기 위하여 경영진이 해당체계의 요구사항에서 이탈하는 것이 필요할 수 있다고 명시적으로 인정된다."}, "t010": {"kw": ["절차: 각 상황에서 감사인이 수행한 감사절차(감사절차의 적절성)", "증거의 충분성과 적합성: 그 결과 입수된 감사증거의 충분성과 적합성", "보고서의 적합성: 감사인의 전반적인 목적에 비추어 감사증거에 대한 평가를 기초로 한 감사보고서의 적합성(감사증거와 감사보고서의 일관성)"], "ans": "감사인이 회계감사기준에 따라 감사를 수행했는지 여부를 판단할 때의 결정기준은 ①각 상황에서 감사인이 수행한 감사절차(감사절차의 적절성), ②그 결과 입수된 감사증거의 충분성과 적합성, ③감사인의 전반적인 목적에 비추어 해당 감사증거에 대한 평가를 기초로 한 감사보고서의 적합성(감사증거와 감사보고서의 일관성)이다."}, "t011": {"kw": ["개별 감사기준서 전체가 관련이 없는 경우", "요구사항이 조건부인데 해당 조건이 존재하지 않아 그 요구사항이 관련이 없는 경우"], "ans": "감사인은 다음 중 하나에 해당되는 감사 상황을 제외하고는 개별 감사기준서의 요구사항을 모두 준수하여야 한다. ①개별 감사기준서 전체가 관련이 없는 경우, 또는 ②요구사항이 조건부인데 해당 조건이 존재하지 않아 그 요구사항이 관련이 없는 경우이다."}, "t012": {"kw": ["특정 절차를 수행하는 것이고", "구체적인 감사상황에서 이러한 절차가 해당 요구사항의 목적을 달성하는 데 비효과적(비효율적 아님)일 경우에만 발생할 것으로 예상됨"], "ans": "예외적 상황에서 감사인은 어떤 감사기준서의 관련 요구사항을 이탈할 필요가 있다고 판단할 수 있으며, 이 경우 해당 요구사항의 목적을 달성하기 위한 대체적 감사절차를 수행하여야 한다. 관련 요구사항을 이탈할 필요성이란 ①요구사항이 특정의 절차를 수행하는 것이고, ②구체적인 감사상황에서 이러한 절차가 해당 요구사항의 목적을 달성하는 데 비효과적(비효율적이 아님)일 경우에만 발생할 것으로 예상된다."}, "t013": {"kw": ["이탈의 이유: 회계감사기준에서 요구한 절차가 해당 상황에서 효과적이지 않은 이유", "달성: 수행한 대체적 감사절차가 그 감사목적을 어떻게 달성하였는지"], "ans": "예외적인 상황에서 요구사항을 이탈한 경우 감사인이 문서화해야 하는 사항은 ①이탈의 이유(회계감사기준에서 요구한 절차가 해당 상황에서 효과적이지 않은 이유)와, ②수행한 대체적 감사절차가 그 감사목적을 어떻게 달성하였는지의 두 가지이다."}, "t014": {"kw": ["왜곡표시가능성을 나타내는 것일 수 있는 상황에 유의", "의문을 갖는 마음", "비판적인 평가를 포함하는 태도"], "ans": "전문가적 의구심이란 부정이나 오류로 인한 왜곡표시가능성을 나타내는 것일 수 있는 상황에 유의하면서, ①의문을 갖는 마음과 ②감사증거에 대한 비판적인 평가를 포함하는 태도를 말한다."}, "t015": {"kw": ["신뢰성: 감사증거로 사용될 문서 및 질의에 대한 답변의 신뢰성에 의문을 갖게 하는 정보", "상반: 이미 입수한 다른 감사증거와 상반되는 감사증거", "부정: 부정의 존재가능성을 나타내는 것일 수 있는 상황", "추가: 감사기준에서 요구하는 절차 외에 추가적인 감사절차의 필요성을 시사하는 상황"], "ans": "전문가적 의구심이 필요한 상황(왜곡표시가능성 상황)은 다음과 같다. ①이미 입수한 다른 감사증거와 상반되는 감사증거, ②감사증거로 사용될 문서 및 질의에 대한 답변의 신뢰성에 의문을 갖게 하는 정보, ③부정의 존재가능성을 나타내는 것일 수 있는 상황, ④감사기준에서 요구하는 절차 외에 추가적인 감사절차의 필요성을 시사하는 상황이다."}, "t016": {"kw": ["비경상적 상황을 간과할 위험", "감사절차의 성격·시기 및 범위를 결정하고 그 결과를 평가할 때 부적합한 가정을 이용할 위험", "감사상 관찰결과에서 결론을 도출할 때 과도하게 일반화할 위험"], "ans": "전문가적 의구심의 유지를 통해 감소시킬 수 있는 위험은 ①비경상적 상황을 간과할 위험, ②감사절차의 성격·시기 및 범위를 결정하고 그 결과를 평가할 때 부적합한 가정을 이용할 위험, ③감사상 관찰결과에서 결론을 도출할 때 과도하게 일반화할 위험이다."}, "t017": {"kw": ["안 날부터 1년 이내", "감사보고서 제출일부터 8년 이내"], "ans": "외부감사법상 손해배상책임의 소멸시효는 ①청구권자가 해당 사실을 안 날부터 1년 이내, 또는 ②감사보고서의 제출일부터 8년 이내에 손해배상을 청구하지 않으면 소멸한다."}, "t018": {"kw": ["안 날부터 3년 이내", "불법행위를 한 날부터 10년 이내"], "ans": "민법상 손해배상책임(제750조, 고의 또는 과실로 인한 위법행위로 타인에게 손해를 가한 경우)의 소멸시효는 ①청구권자가 해당 사실을 안 날부터 3년 이내, 또는 ②불법행위를 한 날부터 10년 이내에 청구하지 않으면 소멸한다."}, "t019": {"kw": ["[긍정] 손해배상액이 크므로 분식회계 등의 예방효과가 커짐", "[긍정] 개별 소송의 중복을 피해 소송의 효율성이 높아짐", "[긍정] 소액피해자도 별도의 소송 없이 구제가 가능함", "[부정] 불필요한 소송이 제기되고 기업의 소송비용이 증가됨에 따라 기업의 경영이 위축될 수 있음"], "ans": "증권집단소송제도의 긍정적 효과는 ①손해배상액이 크므로 분식회계 등에 대한 예방효과가 커지고, ②개별 소송의 중복을 피해 소송의 효율성이 높아지며, ③소액피해자도 별도의 소송 없이 구제가 가능하다는 점이다. 부정적 효과는 불필요한 소송이 제기되고 기업의 소송비용이 증가됨에 따라 기업의 경영이 위축될 수 있다는 점이다."}, "t020": {"kw": ["[공동기금] 관련 법률은 외부감사법, 외부에 기금을 마련, 한국공인회계사회에 기본적립금과 연간적립금을 적립", "[준비금] 관련 법률은 공인회계사법, 내부에 이익잉여금의 처분, 회계상 연도별 매출액의 2%에 해당하는 금액을 손해배상준비금으로 적립"], "ans": "손해배상공동기금은 외부감사법에 따라 외부에 기금을 마련하는 것으로, 한국공인회계사회에 기본적립금과 연간적립금을 적립한다. 손해배상준비금은 공인회계사법에 따라 회계법인 내부에 이익잉여금의 처분으로 마련하는 것으로, 회계상 연도별 매출액의 2%에 해당하는 금액을 손해배상준비금으로 적립한다. 준비금을 적립하면 배당한도(이익잉여금)의 감소로 배당이 제한되어 회계법인 내부에 현금이 유보되는 효과가 있다."}, "t021": {"kw": ["감사보고서를 제출하지 않는 경우", "비밀을 누설하거나 부당한 목적을 위하여 이용한 경우", "주주총회에 출석하여 거짓으로 진술하거나 사실을 감춘 경우", "이사의 부정행위 등을 보고하지 않는 경우"], "ans": "외부감사법상 형사적 책임이 발생하는 경우는 ①감사보고서를 제출하지 않는 경우, ②비밀을 누설하거나 부당한 목적을 위하여 이용한 경우, ③주주총회에 출석하여 거짓으로 진술하거나 사실을 감춘 경우, ④이사의 부정행위 등을 보고하지 않는 경우 등이다."}, "t022": {"kw": ["사무소의 2개 이상 설치금지", "명의대여의 금지"], "ans": "공인회계사법상 형사적 책임이 발생하는 경우는 ①사무소의 2개 이상 설치금지 위반, ②명의대여의 금지 위반 등이다."}, "t023": {"kw": ["등록한 공인회계사가 준수하여야 할 윤리기준을 정함", "그 직무를 높은 수준으로 수행하게 함", "공익에 부합되게 함", "공인회계사에 대한 사회적 신뢰를 제고함"], "ans": "공인회계사윤리기준의 목적은 공인회계사법 제7조의 규정에 의하여 등록한 공인회계사가 전문직업인으로서 준수하여야 할 윤리기준을 정함으로써, 공인회계사로 하여금 그 직무를 높은 수준으로 수행하게 하고 공익에 부합되게 하여, 공인회계사에 대한 사회적 신뢰를 제고하는 데 있다."}, "t024": {"kw": ["성실성: 직무를 수행함에 있어 솔직하고 정직해야 함", "공정성: 편견이나 이해의 상충 또는 외부의 부당한 영향을 받아서는 안 됨", "비밀유지: 직무수행과정에서 지득한 정보에 대한 비밀을 지켜야 하며 법적·직업적으로 공개할 권리나 의무가 없는 한 승인 없이 제3자에게 누설해서는 안 됨", "전문가적 적격성과 정당한 주의: 전문적 지식과 기법을 지속적으로 유지하고 정당한 주의를 기울여야 함", "전문가적 품위: 관련법규를 준수하고 공인회계사의 품위를 실추시키는 행동을 삼가야 함"], "ans": "공인회계사의 5가지 윤리강령은 ①성실성(직무를 수행함에 있어서 솔직하고 정직해야 하며, 중대하게 잘못된 정보가 있는 보고서에 자신의 명칭이 사용되는 것을 허용하지 말아야 함), ②공정성(직무를 수행함에 있어 편견이나 이해의 상충 또는 외부의 부당한 영향을 받아서는 안 됨), ③비밀유지(직무수행과정에서 지득한 정보에 대한 비밀을 지켜야 하며, 법적 또는 직업적으로 공개할 권리나 의무가 없는 경우 적절하고 명확한 승인 없이 어떠한 정보도 제3자에게 누설해서는 안 됨), ④전문가적 적격성과 정당한 주의(최신의 업무·법규 및 기술에 입각하여 전문적 지식과 기법을 지속적으로 유지하고, 정당한 주의를 기울여 철저하고 신중하며 적시에 업무를 수행할 책임을 포함), ⑤전문가적 품위(관련법규를 준수해야 하며 공인회계사의 품위를 실추시키는 행동을 삼가야 함)이다."}, "t025": {"kw": ["[법규에 의해 허용] 법규에 의해 공개가 허용되며 의뢰인 또는 고용인이 공개를 허락한 경우", "[법규에 의해 요구] 소송절차에 따라 문서를 제시하거나 기타증거로 제시하는 경우, 이미 알려진 법규위반 사실을 공공기관에 공개하는 경우", "[법규에 의해 금지되지 않고 전문가적 권리·의무가 있는 경우] 한국공인회계사회 또는 감독기관의 품질관리 감리의무를 준수하기 위한 경우, 질의 또는 조사에 응하기 위한 경우, 소송에서 직업상 이해관계를 보호하기 위한 경우, 기술적 기준 및 윤리적 요구사항을 준수하기 위한 경우"], "ans": "공인회계사가 기밀정보를 공개할 수 있는 상황은 다음과 같다. ①법규에 의해 정보의 공개가 허용되며 의뢰인 또는 고용인이 공개를 허락한 경우, ②법규에 의해 정보의 공개가 요구되는 경우(소송절차에 따라 문서를 제시하거나 기타증거로 제시하는 경우, 이미 알려진 법규위반 사실을 해당 공공기관에 공개하는 경우), ③법규에 의해 정보의 공개가 금지되지 않고 정보의 공개에 대한 전문가적인 권리와 의무가 있는 경우(한국공인회계사회 또는 감독기관의 품질관리 감리의무를 준수하기 위한 경우, 한국공인회계사회 또는 감독기관의 질의 또는 조사에 응하기 위한 경우, 소송에서 공인회계사의 직업상의 이해관계를 보호하기 위한 경우, 기술적 기준 및 윤리적 요구사항을 준수하기 위한 경우)이다."}, "t026": {"kw": ["1단계: 위협의 종류 파악", "2단계: 위협의 심각성 평가", "3단계: 위협을 제거하거나 수용가능한 수준 이하로 감소시키기 위한 제도적 안전장치를 적용(위협이 명백하게 경미한 경우는 제외)"], "ans": "3단계의 윤리강령 준수절차는 ①1단계로 위협의 종류를 파악하고, ②2단계로 위협의 심각성을 평가하며, ③3단계로 해당 위협을 제거하거나 수용가능한 수준 이하로 감소시키기 위한 제도적 안전장치를 적용(위협이 명백하게 경미한 경우는 제외)하는 것이다. 위협이 존재한다는 이유만으로 바로 독립성이 훼손된 것은 아니며, 위협의 심각성에 따라 독립성이 훼손될 수도 있고 아닐 수도 있다. 적절한 안전장치를 적용할 수 없는 경우에는 해당 직무의 수행을 거절하거나 중단하여야 한다."}, "t027": {"kw": ["등록 및 갱신제도: 공인회계사 등록에 요구되는 사항", "연수제도: 계속적 전문가적 개발에 대한 요구사항", "내부감시기구에 대한 규정", "전문적 기준(공인회계사윤리기준)", "모니터링 및 제재 절차: 한국공인회계사회 또는 감독기관의 모니터링 및 제재", "감리제도: 법적 권한을 가진 제3자가 수행하는 외부 감리"], "ans": "한국공인회계사회 또는 법규상 안전장치(업무환경 외의 안전장치)는 ①교육·훈련 및 실무경험 등 공인회계사 등록에 요구되는 사항(등록 및 갱신제도), ②계속적 전문가적 개발에 대한 요구사항(연수제도), ③내부감시기구에 대한 규정, ④전문적 기준(공인회계사윤리기준), ⑤한국공인회계사회 또는 감독기관의 모니터링 및 제재 절차, ⑥공인회계사가 작성한 보고서·신고서·통신문 또는 기타정보에 대하여 법적 권한을 가진 제3자가 수행하는 외부 감리(감리제도)이다."}, "t028": {"kw": ["[회계법인 전체] 윤리강령준수의 중요성을 강조하는 회계법인의 경영방침, 윤리강령의 준수를 요구하는 문서화된 내부 정책과 절차", "[개별업무] 수행된 업무를 재검토하거나 필요한 조언을 제공하는 공인회계사를 추가로 투입, 독립적인 이사들로 구성된 위원회·한국공인회계사회 또는 타 공인회계사와 같은 독립적인 제3자에 대한 자문 요청"], "ans": "업무환경내 안전장치는 회계법인 전체의 안전장치와 개별업무의 안전장치로 구분된다. 회계법인 전체의 안전장치는 윤리강령준수의 중요성을 강조하는 회계법인의 경영방침과 윤리강령의 준수를 요구하는 문서화된 내부 정책과 절차 등이다. 개별업무의 안전장치는 수행된 업무를 재검토하거나 필요한 조언을 제공하는 역할을 수행할 공인회계사를 추가로 투입하는 것, 독립적인 이사들로 구성된 위원회·한국공인회계사회 또는 타 공인회계사와 같은 독립적인 제3자에 대한 자문 요청 등이다."}, "t029": {"kw": ["회계법인의 선임시 경영자 이외의 다른 사람이 이를 추인하거나 승인하는 절차", "경영의사결정을 할 수 있는 경험과 연륜을 갖춘 적격한 인력의 보유", "비인증업무를 수행하는 회계법인을 위촉함에 있어 공정한 선정을 보장하는 내부절차의 수행", "회계법인이 제공하는 업무에 관하여 적절한 감독과 의사소통기능을 수행하는 내부감시기구의 유지"], "ans": "의뢰인 조직 및 절차내에 마련된 안전장치의 예로는 ①회계법인의 선임시 경영자 이외의 다른 사람이 이를 추인하거나 승인하는 절차, ②경영의사결정을 할 수 있는 경험과 연륜을 갖춘 적격한 인력의 보유, ③비인증업무를 수행하는 회계법인을 위촉함에 있어 공정한 선정을 보장하는 내부절차의 수행, ④회계법인이 제공하는 업무에 관하여 적절한 감독과 의사소통기능을 수행하는 내부감시기구의 유지가 있다."}, "t030": {"kw": ["타 구성원에게 도움 요청: 회계법인내의 적절한 타 구성원에게 해결책을 얻기 위하여 도움을 요청", "내부감시기구에 자문: 회계법인내의 이사회나 감사위원회와 같은 내부감시기구에 갈등과 관련된 사안에 대하여 자문을 구함", "한국공인회계사회 또는 법률전문가에게 조언 요청", "거부: 위의 절차로도 갈등이 해결되지 않는 경우 갈등을 일으키는 사안과의 연관을 거부(업무철수·업무수임거절 또는 사임 고려)"], "ans": "윤리적 갈등 상황의 안전장치(대응절차)는 ①회계법인내의 적절한 타 구성원에게 해결책을 얻기 위하여 도움을 요청하고, ②회계법인내의 이사회나 감사위원회와 같은 내부감시기구에 갈등과 관련된 사안에 대하여 자문을 구하며, ③한국공인회계사회 또는 법률전문가에게 조언을 요청하고, ④위의 절차를 통해서도 갈등이 해결되지 않는 경우 갈등을 일으키는 사안과의 연관을 거부(업무철수·업무수임거절 또는 사임 고려)하는 것이다."}, "t031": {"kw": ["[기본] 모든 의뢰인에게 이해상충이 될 수 있는 상황을 통보하고 모든 의뢰인의 동의를 얻음", "[추가] 업무수행팀의 분리 운영", "정보에 대한 접근금지(업무수행팀의 엄격한 물리적 격리, 자료보관의 기밀과 보안유지)", "업무수행팀 구성원에게 기밀유지와 보안문제에 대한 명확한 지침 제공", "회계법인의 파트너와 직원에게 기밀유지약정서에 대한 서명 요구", "안전장치 적용상황을 상급자가 정기적으로 검토(모니터링)"], "ans": "이해상충 상황에서는 공정 강령과 비밀유지 강령에 위협이 발생할 수 있다. 기본적 안전장치로 모든 의뢰인에게 이해상충이 될 수 있는 상황을 통보하고 이러한 상황에 대하여 모든 의뢰인의 동의를 얻는다. 추가적 안전장치로는 ①업무수행팀의 분리 운영, ②정보에 대한 접근금지(업무수행팀의 엄격한 물리적 격리, 자료보관의 기밀과 보안유지), ③업무수행팀 구성원에게 기밀유지와 보안문제에 대한 명확한 지침 제공, ④회계법인의 파트너와 직원에게 기밀유지약정서에 대한 서명 요구, ⑤안전장치의 적용상황에 대하여 해당 의뢰인에 대한 업무에 참여하지 아니하는 상급자가 정기적으로 검토를 실시(모니터링)하는 것이 있다."}, "t032": {"kw": ["의뢰인에게 기존 공인회계사와 논의를 허용해 줄 것을 요청", "제2의견 표명의 한계를 설명", "기존 공인회계사에게 제2의견의 사본을 제공"], "ans": "제2의견의 경우 의뢰인이 목적달성을 위하여 본인에게 유리한 사실관계나 자료만을 제공할 가능성이 있으므로 전문가적 적격성과 정당한 주의 강령에 위협이 발생할 수 있다. 이에 대한 안전장치로 ①의뢰인에게 기존 공인회계사와 논의를 허용해 줄 것을 요청하고, ②제2의견 표명의 한계를 설명하며, ③기존 공인회계사에게 제2의견의 사본을 제공한다."}, "t033": {"kw": ["[위협] 전문가적 품위 강령의 준수에 대한 이기적 위협 발생", "제공하는 서비스·보유한 자격의 내용 또는 업무경력에 대한 과장된 주장", "입증되지 아니한 비교결과를 인용하여 다른 공인회계사의 업무를 비난하는 행위"], "ans": "공인회계사윤리기준은 광고를 허용하되 과장광고와 부당비교광고는 허용하지 않으며, 이에 해당할 경우 전문가적 품위 강령의 준수에 대한 이기적 위협이 발생한다. 금지되는 광고는 ①제공하는 서비스·보유한 자격의 내용 또는 업무경력에 대한 과장된 주장, ②입증되지 아니한 비교결과를 인용하여 다른 공인회계사의 업무를 비난하는 행위이다."}, "t034": {"kw": ["공정 강령과 전문가적 품위 강령 준수에 대한 이기적 위협 발생", "담당공인회계사가 자신 또는 해당 회계법인의 자산과 의뢰인의 자산을 분리하여 보관", "의뢰인의 자산은 의도된 목적에만 사용", "의뢰인의 자산과 그 자산에서 발생하는 이익이나 배당수입 등에 대한 수지보고서를 정기적으로 작성하여 비치", "의뢰인의 자산의 보관 및 회계와 관련된 모든 법규를 준수"], "ans": "의뢰인 자산의 보관은 공정 강령과 전문가적 품위 강령 준수에 대한 이기적 위협이 발생할 수 있으므로, 안전장치로 ①담당공인회계사가 자신 또는 해당 회계법인의 자산과 의뢰인의 자산을 분리하여 보관하고, ②의뢰인의 자산은 의도된 목적에만 사용하며, ③의뢰인의 자산과 그 자산에서 발생하는 이익이나 배당수입 등에 대한 수지보고서를 정기적으로 작성하여 비치하고, ④의뢰인의 자산의 보관 및 회계와 관련된 모든 법규를 준수한다."}, "t035": {"kw": ["공정 강령과 전문가적 적격성과 정당한 주의의무 강령 준수에 대한 이기적 위협이 발생", "그 위협은 심각한 수준에 해당하므로 안전장치가 존재하지 않음"], "ans": "알선수수료의 경우 ①공정 강령과 ②전문가적 적격성과 정당한 주의의무 강령 준수에 대한 이기적 위협이 발생할 수 있으며, 그 위협은 심각한 수준에 해당하므로 안전장치가 존재하지 않는다."}, "t036": {"kw": ["합리적인 제3자에 의하여 명백하게 경미한 것으로 판단되는 경우", "의도된 것이 아니고 사업상의 통상적인 과정에서 제공된 경우", "[인증업무 수행시] 받아서는 안 됨", "[비인증업무] 명백하게 경미하면 받을 수 있음"], "ans": "선물이나 접대를 받을 경우 이기적 위협·유착위협·압력위협이 발생할 수 있다. 명백하게 경미한 경우란 제의받은 선물이나 접대가 관련 상황을 잘 알고 있는 합리적인 제3자에 의하여 명백하게 경미한 것으로 판단되는 경우로서, 제의받은 선물이나 접대가 의사결정에 영향을 미치거나 정보를 획득하기 위하여 특별히 의도된 것이 아니고 사업상의 통상적인 과정에서 제공된 경우를 말한다. 인증업무 수행시에는 받아서는 안 되며, 비인증업무 수행시에는 심각한 위협이 있으면 받아서는 안 되고 명백하게 경미한 경우에만 받을 수 있다."}, "t037": {"kw": ["주식회사 등의 외부감사에 관한 법률(외부감사법)", "자본시장과 금융투자업에 관한 법률(자본시장법)", "독점규제 및 공정거래에 관한 법률(공정거래법)"], "ans": "감사인의 범위에 적용되는 법률로서, ①회계법인·감사반에는 주식회사 등의 외부감사에 관한 법률과 자본시장과 금융투자업에 관한 법률 등이 적용되고, ②회계법인·감사반 및 개인공인회계사에는 독점규제 및 공정거래에 관한 법률 등이 적용된다."}, "t038": {"kw": ["주권상장법인·대형비상장주식회사·금융회사에 대한 감사", "감사인 지정", "이유: 감사반은 회계법인처럼 엄격한 품질관리를 하는 데 한계가 있고, 회계법인에 비해 손해배상능력도 상대적으로 낮기 때문"], "ans": "감사반의 감사업무제한 대상은 ①주권상장법인·대형비상장주식회사·금융회사에 대한 감사, ②감사인 지정이다. 그 이유는 감사반이 회계법인처럼 엄격한 품질관리를 하는 데 한계가 있고, 회계법인에 비해 손해배상능력도 상대적으로 낮기 때문이다."}, "t039": {"kw": ["공인회계사법 제24조에 따라 금융위원회에 등록된 회계법인일 것", "감사품질 확보를 위하여 충분한 인력·예산 그 밖의 물적 설비를 갖출 것", "감사품질 관리를 위한 사후 심리체계·보상체계·업무방법 그 밖에 금융위원회가 정하는 요건을 갖출 것"], "ans": "주권상장법인의 감사인이 되려는 자는 다음 요건을 모두 갖추어 금융위원회에 등록하여야 한다. ①공인회계사법 제24조에 따라 금융위원회에 등록된 회계법인일 것, ②감사품질 확보를 위하여 금융위원회가 정하는 바에 따른 충분한 인력·예산 그 밖의 물적 설비를 갖출 것, ③감사품질 관리를 위한 사후 심리체계·보상체계·업무방법 그 밖에 금융위원회가 정하는 요건을 갖출 것이다."}, "t040": {"kw": ["주권상장법인의 경우 비상장법인에 비해 정보위험에 노출되는 이해관계자가 훨씬 많기 때문", "보다 엄격한 자격을 갖춘 감사인에 의해서 높은 품질의 감사서비스를 제공할 필요가 있기 때문"], "ans": "금융위원회에 등록된 회계법인만이 주권상장법인을 감사할 수 있도록 한 이유는, 주권상장법인의 경우 비상장법인에 비해 정보위험에 노출되는 이해관계자가 훨씬 많기 때문에 보다 엄격한 자격을 갖춘 감사인에 의해서 높은 품질의 감사서비스를 제공할 필요가 있기 때문이다."}, "t041": {"kw": ["[정신적 독립성] 전문가적 판단을 손상시키는 요인에 영향을 받지 않고 의견을 표명할 수 있는 정신적 상태로서 성실하게 행동하고 공정함(객관성)을 유지하며 전문가적인 의구심을 발휘하도록 하는 것", "[외관상 독립성] 합리적인 제3자가 회계법인 또는 인증업무팀 구성원에 대한 성실성·공정(객관성) 또는 전문가적 의구심이 손상된 것으로 판단하게 만드는 중요한 사실이나 상황을 회피하게 하는 것"], "ans": "정신적 독립성(실질적 독립성)이란 전문가적 판단을 손상시키는 요인에 영향을 받지 않고 의견을 표명할 수 있는 정신적 상태로서, 개인으로 하여금 성실하게 행동하고 공정함(객관성)을 유지하며 전문가적인 의구심을 발휘하도록 하는 것을 말한다. 외관상 독립성(형식적 독립성)이란 합리적인 제3자가 회계법인 또는 인증업무팀의 구성원에 대한 성실성·공정(객관성) 또는 전문가적 의구심이 손상된 것으로 판단하게 만드는 중요한 사실이나 상황을 회피하게 하는 것을 말한다."}, "t042": {"kw": ["합리적인 제3자가", "성실성·공정(객관성) 또는 전문가적 의구심이 손상된 것으로 판단하게 만드는", "중요한 사실이나 상황을 회피하게 하는 것"], "ans": "외관상 독립성(형식적 독립성)이란 합리적인 제3자가 회계법인 또는 인증업무팀의 구성원에 대한 성실성·공정(객관성) 또는 전문가적 의구심이 손상된 것으로 판단하게 만드는 중요한 사실이나 상황을 회피하게 하는 것을 말한다."}, "t043": {"kw": ["정신적 독립성은 실질적 독립성으로서 외관상 독립성보다 더 중요함", "정신적 독립성은 확인할 수가 없으므로 외관상 독립성은 독립성에 대한 최소한의 전제조건임", "외관상 독립성의 충족이 정신적 독립성의 충족을 의미하는 것은 아님", "그러므로 정신적 독립성과 외관상 독립성은 모두 충족되어야 함"], "ans": "정신적 독립성과 외관상 독립성의 관계는 다음과 같다. ①정신적 독립성은 실질적 독립성으로서 외관상 독립성보다 더 중요하다. ②그러나 정신적 독립성은 확인할 수가 없으므로 외관상 독립성은 독립성에 대한 최소한의 전제조건이다. ③그렇다고 외관상 독립성의 충족이 정신적 독립성의 충족을 의미하는 것은 아니다. ④그러므로 정신적 독립성과 외관상 독립성은 모두 충족되어야 한다."}, "t044": {"kw": ["[일반적인 경우] 업무착수일부터 인증보고서 발행일까지", "[반복적인 경우] 업무착수일부터 더 늦은 날(계약종료통보일과 최종인증보고서 발행일 중 늦은 날)까지", "[훼손시] 계약체결일 전에 인지한 경우 계약체결의 거부, 계약체결일 후에 인지한 경우 계약취소"], "ans": "독립성의 최소유지기간은 ①일반적인 경우 업무착수일부터 인증보고서 발행일까지이고, ②반복적인 경우 업무착수일부터 더 늦은 날(계약종료통보일과 최종인증보고서 발행일 중 늦은 날)까지이다. 독립성의 훼손시 감사인의 대응조치는 계약체결일 전에 인지한 경우 계약체결을 거부하고, 계약체결일 후에 인지한 경우 계약을 취소하는 것이다. 다만 독립성의 훼손사유가 고의적이 아니고 단기간 내에 훼손사유를 해소할 수 있는 경우에는 그 사유를 해소하면 된다."}, "t045": {"kw": ["직무와 직접 관련된 채권(예: 감사보수 미수금)", "약관에 따라 체결한 금융상품계약으로 발생한 채권·채무: 담보를 제공하고 성립된 채무(주택담보대출·예금담보대출 등), 신용카드 사용에 따른 지급기일이 2월 이내인 채무 중 연체되지 아니한 채무, 퇴직연금 등 채권, 건축물이나 주택의 분양·공급 등과 관련한 일괄적 대출(아파트집단대출)", "감사계약을 체결하기 전에 표준약관에 따라 구입하거나 정상적인 가액으로 구입한 회원권·시설물이용권 등 채권", "비자발적으로 발생된 채권·채무", "상거래를 위해 약관에 따라 체결된 3천만원 미만의 채권·채무"], "ans": "이기적 위협에서 제외되는(즉 감사업무 수임이 가능한) 일반적인 채권·채무는 다음과 같다. ①공인회계사의 직무와 직접 관련된 채권(예: 감사보수 미수금), ②약관에 따라 체결한 금융상품계약으로 발생한 채권·채무로서 ㉠감사기간 중에 만기를 연장한 담보대출채무(주택담보대출·예금담보대출 등)·보험채권·채무, ㉡신용카드 사용에 따른 지급기일이 2월 이내인 채무 중 연체되지 아니한 채무, ㉢퇴직연금 등 채권, ㉣건축물이나 주택의 분양·공급 등과 관련하여 금융회사와 일괄적으로 체결한 대출(아파트집단대출), ㉤이들 외의 채권·채무로서 감사계약을 체결하기 전에 발생한 채권·채무, ③감사계약을 체결하기 전에 표준약관에 따라 구입하거나 정상적인 가액으로 구입한 회원권·시설물이용권 등 채권, ④감사기간 중 합병·상속 또는 소송 등에 의하여 비자발적으로 발생된 채권·채무, ⑤이들 외에 상거래를 위해 약관에 따라 체결된 3천만원 미만의 채권 또는 채무이다."}, "t046": {"kw": ["친밀한 사업관계는 상업적이거나 일반적인 재무적 이해관계를 수반", "이기적 위협과 압력위협을 발생", "재무적 이해관계가 회계법인과 감사업무의뢰인 모두에게 중요하지 않고 그 관계가 명백하게 경미한 경우가 아닌 한 안전장치가 존재하지 않음"], "ans": "친밀한 사업관계는 상업적이거나 일반적인 재무적 이해관계를 수반하며, 이기적 위협과 압력위협을 발생시킬 수 있다. 그러한 재무적 이해관계가 회계법인과 감사업무의뢰인 모두에게 중요하지 않고 그 관계가 명백하게 경미한 경우가 아닌 한, 이러한 독립성 훼손위협을 수용가능한 수준 이하로 감소시킬 수 있는 안전장치는 존재하지 않는다."}, "t047": {"kw": ["공동투자: 감사대상회사(그 지배주주·임원 포함)와의 공동투자에서 중요한 재무적 이해관계를 가지는 경우", "결합 일괄판매: 회계법인과 인증의뢰인의 서비스나 상품을 결합하여 일괄 판매하는 약정을 체결한 경우", "유통·마케팅: 회계법인이나 인증의뢰인이 상대방의 상품이나 서비스를 유통하거나 마케팅을 수행하는 약정을 체결한 경우"], "ans": "친밀한 사업관계의 예시는 다음과 같다. ①감사대상회사(그 지배주주·임원 포함)와의 공동투자에서 중요한 재무적 이해관계를 가지는 경우, ②회계법인과 인증의뢰인의 서비스나 상품을 결합하여 일괄 판매하는 약정을 체결한 경우, ③회계법인이나 인증의뢰인이 상대방의 상품이나 서비스를 유통하거나 마케팅을 수행하는 약정을 체결한 경우이다."}, "t048": {"kw": ["회계법인이 감사업무와 관련하여 성공보수를 지급받기로 하는 경우", "이기적 위협과 변호위협이 발생", "수용가능한 수준 이하로 감소시키기 위한 안전장치가 존재하지 아니하므로 성공보수를 조건으로 계약을 체결하여서는 안 됨"], "ans": "회계법인이 감사업무와 관련하여 성공보수를 지급받기로 하는 경우 이기적 위협과 변호위협이 발생하며, 이러한 위협을 수용가능한 수준 이하로 감소시키기 위한 안전장치가 존재하지 아니한다. 따라서 회계법인은 감사업무에 대해 성공보수를 조건으로 계약을 체결하여서는 안 된다."}, "t049": {"kw": ["예정된 자에게 수행한 업무의 내용과 함께 보수의 산정근거를 제시", "보수의 산정근거와 관련하여 의뢰인에게 서면으로 된 사전동의서를 징구", "개업공인회계사가 수행한 업무를 객관적인 제3자가 검토", "품질관리 정책과 절차"], "ans": "일반적인 비감사업무의 성공보수계약은 가능하나 이기적 위협과 변호위협이 발생할 수 있으므로 안전장치를 마련하여야 한다. ①개업공인회계사가 수행한 업무결과를 이용할 것으로 예정된 자에게 수행한 업무의 내용과 함께 보수의 산정근거를 제시하고, ②보수의 산정근거와 관련하여 의뢰인에게 서면으로 된 사전동의서를 징구하며, ③개업공인회계사가 수행한 업무를 객관적인 제3자가 검토하고, ④품질관리 정책과 절차를 마련한다."}, "t050": {"kw": ["보수의 성격과 범위를 감사위원회 등 내부감시기구에 보고", "독립된 제3자에 의한 최종보수의 검토 또는 결정", "품질관리 정책과 절차"], "ans": "인증업무와 동시에 비감사업무를 수행할 경우 비감사업무의 성공보수에 대한 안전장치는 다음과 같다. ①보수의 성격과 범위를 감사위원회 등 내부감시기구에 보고하고, ②독립된 제3자에 의한 최종보수의 검토 또는 결정을 받으며, ③품질관리 정책과 절차를 마련한다."}, "t051": {"kw": ["적절한 시간의 투입과 자질있는 구성원을 해당 업무에 배정함을 입증", "인증업무와 관련된 모든 기준·지침 및 품질관리절차의 준수를 입증"], "ans": "현저히 낮은 감사보수로 감사계약을 체결하는 경우 전문가적 적격성과 정당한 주의 강령의 준수에 대한 이기적 위협이 발생하므로, 안전장치로 ①적절한 시간의 투입과 자질있는 구성원을 해당 업무에 배정함을 입증하고, ②인증업무와 관련된 모든 기준·지침 및 품질관리절차의 준수를 입증한다."}, "t052": {"kw": ["감사위원회 등 내부감시기구와 보수의 범위와 성격에 관하여 논의", "의뢰인에 대한 수입의존도를 줄이기 위한 조치를 취함", "외부의 품질관리검토를 받음", "해당 감독기관 또는 다른 공인회계사 등 제3자로부터 자문을 받음"], "ans": "특정회사의 감사보수가 회계법인 보수총액의 상당한 부분을 차지하는 경우 안전장치는 다음과 같다. ①감사위원회 등 내부감시기구와 보수의 범위와 성격에 관하여 논의하고, ②의뢰인에 대한 수입의존도를 줄이기 위한 조치를 취하며, ③외부의 품질관리검토를 받고, ④해당 감독기관 또는 다른 공인회계사 등 제3자로부터 자문을 받는다."}, "t053": {"kw": ["감사위원회 등 내부감시기구와 연체보수의 규모에 관하여 논의", "해당 인증업무에 참여하지 않은 공인회계사를 추가로 투입하여 인증업무팀이 수행한 업무를 검토하거나 필요한 경우 조언을 제공하도록 함"], "ans": "감사보수의 연체가 발생한 경우 안전장치는 ①감사위원회 등 내부감시기구와 연체보수의 규모에 관하여 논의하고, ②해당 인증업무에 참여하지 않은 공인회계사를 추가로 투입하여 인증업무팀이 수행한 업무를 검토하거나 필요한 경우 조언을 제공하도록 하는 것이다."}, "t054": {"kw": ["인증의뢰인과 진지하게 고용협상을 시작하는 해당 개인에게 이러한 사실을 회계법인에게 통보하도록 요구하는 정책과 절차", "해당 개인을 해당 인증업무에서 제외시킴", "해당 개인이 업무수행기간동안 행한 중요한 판단에 대하여 독립적인 검토를 수행할 것을 고려"], "ans": "감사대상회사로 이직할 예정인 경우 안전장치는 다음과 같다. ①인증의뢰인과 진지하게 고용협상을 시작하는 해당 개인에게 이러한 사실을 회계법인에게 통보하도록 요구하는 정책과 절차를 두고, ②해당 개인을 해당 인증업무에서 제외시키며, ③해당 개인이 업무수행기간동안 행한 중요한 판단에 대하여 독립적인 검토를 수행할 것을 고려한다."}, "t055": {"kw": ["[관계] 주식을 소유하고 있거나 중요한 간접적 재무적 이해관계를 가진 회사, 채권·채무관계(회계법인은 1억원 이상), 친밀한 사업관계, 지배력을 가지고 있는 자와 중요한 재무적 이해관계를 가진 회사", "[지급·제공] 직무 수행 대가로 자기 회사의 주식·잠재적 보통주를 제공, 업무 외의 업무로 계속적인 보수를 지급, 무상 또는 현저히 낮은 대가로 사무소·영업용 차량을 제공, 감사업무와 관련하여 성공보수를 받기로 한 회사"], "ans": "이기적 위협으로 감사업무를 수행할 수 없는 경우는 관계와 지급·제공으로 구분된다. 관계 측면에서 ①주식을 소유하고 있는 회사(직접적인 재무적 이해관계), ②중요한 간접적인 재무적 이해관계를 가진 회사, ③채권·채무관계에 있는 회사(회계법인은 1억원 이상), ④친밀한 사업관계에 있는 회사, ⑤지배력을 가지고 있는 자와 중요한 재무적 이해관계를 가진 경우 그 회사가 이에 해당한다. 지급·제공 측면에서 ⑥직무를 수행하는 대가로 자기 회사의 주식·신주인수권부사채·전환사채 또는 주식매수선택권(잠재적 보통주)을 제공하였거나 제공하기로 한 회사, ⑦공인회계사 업무 외의 업무로 인하여 계속적인 보수를 지급하거나 기타 경제상의 특별한 이익을 제공하고 있는 회사, ⑧무상 또는 현저히 낮은 대가로 공인회계사 사무소 또는 영업용 차량을 제공하고 있는 회사, ⑨감사업무와 관련하여 성공보수를 받기로 한 회사가 이에 해당한다."}, "t056": {"kw": ["[직접·심각한 영향을 미칠 수 있는 직위] 해당 공인회계사를 업무팀원에서 제외", "회계법인 소속 구성원이 독립성 및 공정의 준수와 관련된 문제를 회계법인내의 상급자에게 전달하도록 하는 정책과 절차를 마련", "해당 개인을 인증업무팀에서 제외시킴", "가능하면 해당 구성원이 그 직계가족(또는 측근가족)의 책임 하에 있는 사항들을 다루지 않도록 인증업무팀의 책임을 조정"], "ans": "직계가족이나 측근가족이 감사대상회사의 임직원인 경우 그 직위에 따른 안전장치는 다음과 같다. 재무정보에 직접적이고 심각한 영향을 미칠 수 있는 직위(예: 재무이사)에 있는 경우에는 해당 공인회계사를 업무팀원에서 제외한다. 재무정보에 직접적이고 심각한 영향을 미칠 수 있는 직위는 아니지만 명백하게 경미하지 않은 경우에는 ①회계법인 소속 구성원이 독립성 및 공정의 준수와 관련된 문제를 회계법인내의 상급자에게 전달하도록 하는 정책과 절차를 마련하고, ②해당 개인을 인증업무팀에서 제외시키며, ③가능하면 해당 구성원이 그 직계가족(또는 측근가족)의 책임 하에 있는 사항들을 다루지 않도록 인증업무팀의 책임을 조정한다. 공인회계사를 감사업무팀에서 제외시킬 수 없는 경우 유일한 대책은 감사업무를 해지하는 것이다."}, "t057": {"kw": ["직계가족(동거 중인 직계존비속)이나 측근가족(동거하지 않는 직계존비속·형제·자매)이 감사대상회사의 임직원인 경우", "이기적 위협·유착위협 또는 압력위협이 발생", "감사업무팀원이 감사대상회사의 임직원과 직계가족·측근가족인 경우 발생"], "ans": "감사업무팀원이 감사대상회사의 임직원과 직계가족(동거 중인 직계존비속)이나 측근가족(동거하지 않는 직계존비속, 형제·자매)인 경우 이기적 위협·유착위협 또는 압력위협이 발생할 수 있다."}, "t058": {"kw": ["[재무제표 작성 관련] 회계기록과 재무제표의 작성, 재무정보체제의 구축 또는 운영, 보험충당부채 금액 산출과 관련되는 보험계리업무", "[Deal업무 관련] 자산·자본 등의 매도·매수를 위한 실사·재무보고·가치평가 및 의견제시, 자금조달·투자 관련 알선 및 중개업무", "[임원역할 관련] 내부감사업무의 대행, 중요한 자산의 처분·양도·지배인의 선임·해임 등 경영에 관한 의사결정으로서 임원의 역할에 해당하는 업무", "[기타] 인사 및 조직 등에 관한 지원업무, 민·형사 소송에 대한 자문업무, 그 밖에 재무제표의 감사 또는 증명업무와 이해상충의 소지가 있는 것으로서 대통령령으로 정하는 업무"], "ans": "감사업무와 동시에 수행할 수 없는 비감사업무 10가지는 다음과 같다. 재무제표 작성 관련으로 ①회계기록과 재무제표의 작성, ②재무정보체제의 구축 또는 운영, ③재무제표에 계상되는 보험충당부채 금액 산출과 관련되는 보험계리업무가 있고, Deal업무 관련으로 ④자산·자본 그 밖의 권리 등을 매도 또는 매수하기 위한 자산등에 대한 실사·재무보고·가치평가 및 자산등의 매도·매수거래 또는 계약의 타당성에 대한 의견제시, ⑤자금조달·투자 관련 알선 및 중개업무가 있으며, 임원역할 관련으로 ⑥내부감사업무의 대행, ⑦중요한 자산의 처분 및 양도·지배인의 선임 또는 해임 등 경영에 관한 의사결정으로서 임원이나 이에 준하는 직위의 역할에 해당하는 업무가 있고, 기타로 ⑧인사 및 조직 등에 관한 지원업무, ⑨민·형사 소송에 대한 자문업무, ⑩그 밖에 재무제표의 감사 또는 증명업무와 이해상충의 소지가 있는 것으로서 대통령령으로 정하는 업무가 있다."}, "t059": {"kw": ["거래를 승인·실행·완결하는 행위 또는 회사를 대신하여 권한을 행사하거나 그 권한을 갖는 것", "회계법인의 권고사항 중 특정사항을 이행해야 한다고 결정해주는 행위", "내부감시기구에 경영자의 역할로 보고하는 행위", "고위경영진의 고용에 대한 의사결정(단, 최종 면접 후보자를 선발해 주는 경우는 가능)"], "ans": "공인회계사윤리기준에서 추가적으로 금지하고 있는 비감사업무는 다음과 같다. ①거래를 승인·실행·완결하는 행위 또는 회사를 대신하여 권한을 행사하거나 그 권한을 갖는 것, ②회계법인의 권고사항 중 특정사항을 이행해야 한다고 결정해주는 행위, ③내부감시기구에 경영자의 역할로 보고하는 행위, ④고위경영진의 고용에 대한 의사결정(단, 최종 면접 후보자를 선발해 주는 경우는 가능)이다."}, "t060": {"kw": ["제공되는 비인증업무의 결과가 감사절차의 대상이 되지 않아 자기검토위협을 발생시키지 않고", "안전장치의 적용을 통해 동 비감사 업무의 제공으로 인해 발생하는 독립성 훼손위협을 제거하거나 수용가능한 수준으로 감소시킬 수 있는 경우"], "ans": "감사대상회사와 특수관계에 있는 회사에게 비감사업무를 제공한 경우, 종속 또는 관계회사에 감사업무를 제공하고 지배 또는 투자회사에 비감사업무를 제공하는 경우에는 다음의 조건을 모두 충족시 독립성이 훼손되지 않는다. ①제공되는 비인증업무의 결과가 감사절차의 대상이 되지 않아 자기검토위협을 발생시키지 않고, ②안전장치의 적용을 통해 동 비감사 업무의 제공으로 인해 발생하는 독립성 훼손위협을 제거하거나 수용가능한 수준으로 감소시킬 수 있는 경우이다."}, "t061": {"kw": ["세무신고서의 작성·세액산정·세무규정의 준수·세무계획의 수립·공식적인 세무의견의 제공 및 세금분쟁 해결의 지원", "세무계획수립 목적의 가치평가업무", "세무업무는 세무당국 등 외부의 검토를 받도록 되어 있어 일반적으로 위협을 발생시키지 않는 것으로 간주"], "ans": "감사업무와 동시에 수행할 수 있는 비감사업무는 ①세무신고서의 작성·세액산정·세무규정의 준수·세무계획의 수립·공식적인 세무의견의 제공 및 세금분쟁 해결의 지원 등과 ②세무계획수립 목적의 가치평가업무이다. 세무업무는 세무당국 등 외부의 검토를 받도록 되어 있어 일반적으로 위협을 발생시키지 않는 것으로 간주한다. 다만 세무계획수립 목적의 가치평가업무는 자기검토위협이 발생할 수 있으므로, 위협이 명백하게 경미하지 않은 이상 위협의 정도에 따라 적절한 안전장치(감사위원회의 동의를 받거나 감사위원회와 협의)를 마련하여야 한다."}, "t062": {"kw": ["당해 의뢰인의 감사위원회 등 내부감시기구와 이미 제공된 비인증업무와 관련된 독립성 문제를 논의", "비인증업무를 제공한 구성원을 해당 재무제표감사업무에서 제외시킴(업무수행팀 분리)", "비인증업무의 결과에 대한 책임이 당해 의뢰인에게 있음을 인정하는 확인서를 입수", "다른 회계법인에게 해당 비인증업무의 결과를 검토하게 하거나 재수행하도록 함으로써 타 회계법인이 해당 비인증업무에 대한 책임을 질 수 있도록 함"], "ans": "전기에 비감사업무를 수행하고 당기에 감사업무를 수행하는 경우, 감사업무 착수 이전에 비감사업무를 수행한 경우의 안전장치는 다음과 같다. ①당해 의뢰인의 감사위원회 등 내부감시기구와 이미 제공된 비인증업무와 관련된 독립성 문제를 논의하고, ②비인증업무를 제공한 구성원을 해당 재무제표감사업무에서 제외시키며(업무수행팀 분리), ③비인증업무의 결과에 대한 책임이 당해 의뢰인에게 있음을 인정하는 확인서를 입수하고, ④다른 회계법인에게 해당 비인증업무의 결과를 검토하게 하거나 해당 비인증업무를 재수행하도록 함으로써 타 회계법인이 해당 비인증업무에 대한 책임을 질 수 있도록 한다."}, "t063": {"kw": ["변호위협은 공인회계사가 공정성이 손상될 수 있을 정도로 어떤 입장이나 의견을 옹호하는 경우에 발생", "변호위협은 별도의 비감사업무로 수행될 때 발생하므로 자기검토위협도 동시에 발생할 수 있음", "따라서 변호위협이 발생하는 업무는 자기검토위협으로 인하여 동시에 수행이 불가능한 경우가 대부분임"], "ans": "변호위협과 관련된 업무는 다음과 같다. ①변호위협은 공인회계사가 공정성이 손상될 수 있을 정도로 어떤 입장이나 의견을 옹호하는 경우에 발생한다. ②변호위협은 별도의 비감사업무로 수행될 때 발생하므로 자기검토위협도 동시에 발생할 수 있다. ③따라서 변호위협이 발생하는 업무는 자기검토위협으로 인하여 동시에 수행이 불가능한 경우가 대부분이다."}, "t064": {"kw": ["해임 또는 교체의 위협이 존재하는 경우", "소송의 위협이 있는 경우", "업무보수를 낮추기 위하여 수행업무의 범위를 부적절하게 제한하려는 압력이 존재하는 경우", "의뢰인으로부터 선물과 접대 제공을 받는 경우"], "ans": "압력위협이 발생하는 상황은 다음과 같다. ①해임 또는 교체의 위협이 존재하는 경우(감사인 유지제도와 연계), ②소송의 위협이 있는 경우, ③업무보수를 낮추기 위하여 수행업무의 범위를 부적절하게 제한하려는 압력이 존재하는 경우, ④의뢰인으로부터 선물과 접대 제공을 받는 경우(이기적 위협·유착위협도 발생)이다."}, "t065": {"kw": ["소송의 성격과 범위를 감사위원회 등 내부감시기구에 보고", "소송에 연루되어 있는 인증업무팀의 당해 구성원을 인증업무팀에서 제외", "인증업무팀의 구성원이 아닌 공인회계사를 추가로 투입하여 인증업무팀이 수행한 업무를 검토하거나 필요한 경우 조언을 제공하도록 함"], "ans": "회계법인과 감사대상회사간에 소송이 발생한 경우 안전장치는 다음과 같다. ①소송의 성격과 범위를 감사위원회 등 내부감시기구에 보고하고, ②소송에 연루되어 있는 인증업무팀의 당해 구성원을 인증업무팀에서 제외하며, ③인증업무팀의 구성원이 아닌 공인회계사를 추가로 투입하여 인증업무팀이 수행한 업무를 검토하거나 필요한 경우 조언을 제공하도록 한다."}, "t066": {"kw": ["리더십 책임: 회계법인내 품질에 대한 리더십 책임(최고경영자나 사원총회)", "관련 윤리적 요구사항", "의뢰인 관계 및 특정업무의 수용과 유지", "인적자원", "업무의 수행", "모니터링", "문서화"], "ans": "회계법인 차원의 자율적 품질관리(품질관리기준서 1, 인증업무를 포함한 모든 업무에 적용)의 구성요소는 ①회계법인내 품질에 대한 리더십 책임(최고경영자나 사원총회), ②관련 윤리적 요구사항, ③의뢰인 관계 및 특정업무의 수용과 유지, ④인적자원, ⑤업무의 수행, ⑥모니터링이며, 이에 문서화가 더해진다."}, "t067": {"kw": ["리더십 책임: 감사품질에 대한 리더십 책임(업무수행이사)", "관련 윤리적 요구사항", "의뢰인 관계와 감사업무의 수용과 유지", "업무팀의 배정", "감사업무의 수행", "모니터링", "문서화"], "ans": "개별감사업무 차원의 자율적 품질관리(회계감사기준, 감사업무에 적용)의 구성요소는 ①감사품질에 대한 리더십 책임(업무수행이사), ②관련 윤리적 요구사항, ③의뢰인 관계와 감사업무의 수용과 유지, ④업무팀의 배정, ⑤감사업무의 수행, ⑥모니터링이며, 이에 문서화가 더해진다."}, "t068": {"kw": ["지휘·감독 및 수행: 업무수행이사는 전문직 기준과 해당법규의 요구사항을 준수하여 감사업무를 지휘·감독 및 수행하고 해당상황에 적합한 감사보고서를 발행할 수 있도록 책임짐", "검토: 업무수행이사는 감사문서의 검토 및 감사업무팀과의 토의를 통해 충분하고 적합한 감사증거를 입수하고 도달된 결론에 만족할 수 있어야 함", "자문: 업무수행이사는 어렵거나 논쟁의 여지가 있는 사항들에 관하여 업무팀이 적합한 자문을 실시하도록 하는 책임을 짐"], "ans": "개별감사업무의 수행에서 업무수행이사는 다음을 수행한다. ①지휘·감독 및 수행으로서 전문직 기준과 해당법규의 요구사항을 준수하여 감사업무를 지휘·감독 및 수행하고 해당상황에 적합한 감사보고서를 발행할 수 있도록 책임지며, ②검토로서 감사문서의 검토 및 감사업무팀과의 토의를 통해 충분하고 적합한 감사증거를 입수하고 도달된 결론에 만족할 수 있어야 하고, ③자문으로서 어렵거나 논쟁의 여지가 있는 사항들에 관하여 업무팀이 적합한 자문을 실시하도록 하는 책임을 진다."}, "t069": {"kw": ["어렵거나 논쟁의 여지가 있는 사항들에 관하여 업무팀이 적합한 자문을 실시하도록 하는 책임을 짐", "업무팀원이 업무팀 내부 및 업무팀과 회계법인 내·외부의 적합한 위치의 사람들 간에 적합한 자문을 실시하였다는 것에 대하여 만족할 수 있음", "그러한 자문의 성격과 범위, 그리고 해당 자문에 따른 결론들이 자문제공자의 의견과 같다는 것에 대하여 만족할 수 있음", "그러한 자문의 결론들이 실행되었는지 결정함"], "ans": "자문과 관련하여 업무수행이사는 다음과 같이 하여야 한다. ①어렵거나 논쟁의 여지가 있는 사항들에 관하여 업무팀이 적합한 자문을 실시하도록 하는 책임을 지고, ②업무팀원이 업무팀 내부 및 업무팀과 회계법인 내·외부의 적합한 위치의 사람들 간에 적합한 자문을 실시하였다는 것에 대하여 만족할 수 있으며, ③그러한 자문의 성격과 범위, 그리고 해당 자문에 따른 결론들이 자문제공자의 의견과 같다는 것에 대하여 만족할 수 있고, ④그러한 자문의 결론들이 실행되었는지 결정한다."}, "t070": {"kw": ["업무품질관리검토자가 선임되어 있는지 결정함(심리담당이사)", "업무품질관리검토 중에 식별된 사항 등 감사업무의 수행중에 야기된 유의적 사항을 업무품질관리검토자와 논의함", "감사보고서일자를 업무품질관리검토의 종료일 전의 일자로 하지 않음"], "ans": "상장기업 등의 업무품질관리검토와 관련하여 업무수행이사는 다음과 같은 절차를 수행하여야 한다. ①업무품질관리검토자(심리담당이사)가 선임되어 있는지 결정하고, ②업무품질관리검토 중에 식별된 사항 등 감사업무의 수행중에 야기된 유의적 사항을 업무품질관리검토자와 논의하며, ③감사보고서일자를 업무품질관리검토의 종료일 전의 일자로 하지 않는다."}, "t071": {"kw": ["유의적 사항을 업무수행이사와 논의함", "재무제표와 감사보고서의 초안을 검토함", "감사업무팀이 내린 유의적 판단 및 도달된 결론과 관련된 감사문서를 선정하여 검토함", "감사보고서를 작성할 때 도달된 결론들을 평가하고 감사보고서 초안이 적합한지 여부를 고려함"], "ans": "업무품질관리검토자는 업무팀이 내린 유의적 판단사항과 감사보고서의 형성 과정에서 도달된 결론들에 대하여 객관적인 평가를 수행하여야 하며, 이 평가에는 다음이 포함된다. ①유의적 사항을 업무수행이사와 논의하고, ②재무제표와 감사보고서의 초안을 검토하며, ③감사업무팀이 내린 유의적 판단 및 도달된 결론과 관련된 감사문서를 선정하여 검토하고, ④감사보고서를 작성할 때 도달된 결론들을 평가하고 감사보고서 초안이 적합한지 여부를 고려한다."}, "t072": {"kw": ["업무품질관리검토에 관하여 회계법인의 정책에서 요구되는 절차를 수행하였음", "업무품질관리검토는 감사보고서일 또는 그 전에 종료되었음", "검토자는 업무팀이 내린 유의적 판단과 도달된 결론이 적합하지 않았다고 판단할 만한 어떠한 미해결 사항도 인지하고 있지 아니함"], "ans": "업무품질관리검토자가 수행한 업무에 대해서 문서화하여야 할 사항은 다음과 같다. ①업무품질관리검토에 관하여 회계법인의 정책에서 요구되는 절차를 수행하였고, ②업무품질관리검토는 감사보고서일 또는 그 전에 종료되었으며, ③검토자는 업무팀이 내린 유의적 판단과 도달된 결론이 적합하지 않았다고 판단할 만한 어떠한 미해결 사항도 인지하고 있지 아니함을 문서화한다."}, "t073": {"kw": ["유의적 위험을 발생시키는 사항", "감사절차를 수행한 결과 중요한 왜곡표시 가능성이 있는 사항 또는 전기의 평가위험을 수정할 사항", "감사절차 적용상 유의적인 어려움을 초래한 상황", "감사보고서의 감사의견을 변형시키거나 강조사항문단에 포함될 수도 있는 사항을 발견한 경우"], "ans": "유의적 사항의 예는 다음과 같다. ①유의적 위험을 발생시키는 사항, ②감사절차를 수행한 결과 중요한 왜곡표시 가능성이 있는 사항 또는 전기의 평가위험을 수정할 사항, ③감사절차 적용상 유의적인 어려움을 초래한 상황, ④감사보고서의 감사의견을 변형시키거나 강조사항문단에 포함될 수도 있는 사항을 발견한 경우이다."}, "t074": {"kw": ["[품질관리 준수 감리(조직 감리)] 회계법인 전사적 조직 차원에서 품질관리기준서 1과 회계감사기준에 따라 품질관리시스템을 적절하게 구축·운영하고 있는지 조사하는 업무, 대규모 감사인은 증권선물위원회가 직접 실시하고 소규모 감사인은 한국공인회계사회에 위탁", "[회계감사기준 준수 감리(감사보고서 감리)] 개별 감사업무 차원에서 감사인이 회계감사기준에 따라 감사업무를 수행하였는지 조사하는 업무, 상장법인은 증권선물위원회가 직접 실시하고 비상장법인은 한국공인회계사회에 위탁"], "ans": "증권선물위원회의 감리인 감리제도는 품질관리 준수 감리(조직 감리)와 회계감사기준 준수 감리(감사보고서 감리)로 구분된다. 품질관리 준수 감리는 회계법인(전사적 조직) 차원에서 회계법인이 품질관리기준서 1과 회계감사기준에 따라 품질관리시스템을 적절하게 구축하고 운영하고 있는지에 대해서 조사하는 업무로, 수행주체는 증권선물위원회이지만 대규모 감사인에 대해서는 증권선물위원회가 직접 실시하고 소규모 감사인에 대한 감리는 한국공인회계사회에 위탁하여 실시한다. 회계감사기준 준수 감리는 개별 감사업무 차원에서 감사인이 회계감사기준에 따라 감사업무를 수행하였는지 조사하는 업무로, 수행주체는 증권선물위원회이지만 상장법인에 대한 감사보고서 감리는 증권선물위원회가 직접 실시하고 비상장법인에 대한 감사보고서 감리는 한국공인회계사회에 위탁하여 실시한다."}, "t075": {"kw": ["[자유선임방식] 적격성 높음, 독립성 낮음, 상대적 감사품질 비교적 높음", "[국가배정방식(감사인 지정제)] 적격성 낮음, 독립성 높음, 상대적 감사품질 비교적 낮음"], "ans": "감사인의 선임방식은 자유선임방식과 국가배정방식(감사인 지정제)으로 구분된다. 자유선임방식은 적격성이 높고 독립성이 낮으며 상대적 감사품질이 비교적 높다. 국가배정방식은 적격성이 낮고 독립성이 높으며 상대적 감사품질이 비교적 낮다."}, "t076": {"kw": ["감사인 유지제도: 주권상장법인·대형비상장주식회사·금융회사는 연속하는 3개 사업연도에 대해 동일감사인으로부터 감사를 받아야 함", "감사참여자 교체제도", "전임감사인의 의견진술권", "감사(위원회) 또는 감사인선임위원회를 통한 선임", "감사인 지정제도(국가배정방식)"], "ans": "외부감사법상 감사인선임과 관련한 독립성 유지제도는 ①감사인 유지제도(주권상장법인·대형비상장주식회사·금융회사는 연속하는 3개 사업연도에 대해 동일감사인으로부터 감사를 받아야 함), ②감사참여자 교체제도, ③전임감사인의 의견진술권, ④감사(위원회) 또는 감사인선임위원회를 통한 선임, ⑤감사인 지정제도(국가배정방식)이다."}, "t077": {"kw": ["감사 1명", "사외이사가 있는 회사의 경우 그 사외이사 중 2명 이내", "기관투자자 중 의결권주식을 가장 많이 소유하고 있는 기관투자자의 임직원 1명(지배주주와 그 특수관계자 제외)", "다음의 주주를 제외한 주주 중에서 의결권 있는 주식을 가장 많이 소유한 주주 1명(지배주주와 그 특수관계자, 해당 회사의 임원인 주주, 위 기관투자자)", "채권 중 채권액이 가장 많은 금융회사의 임직원 1명(지배주주와 그 특수관계자 제외)"], "ans": "감사인선임위원회의 구성은 다음과 같다. ①감사 1명, ②사외이사가 있는 회사의 경우에는 그 사외이사 중 2명 이내, ③기관투자자 중 의결권주식을 가장 많이 소유하고 있는 기관투자자의 임직원 1명(지배주주와 그 특수관계자 제외), ④다음의 주주(지배주주와 그 특수관계자, 해당 회사의 임원인 주주, 위 ③의 기관투자자)를 제외한 주주 중에서 의결권 있는 주식을 가장 많이 소유한 주주 1명, ⑤채권 중 채권액이 가장 많은 금융회사의 임직원 1명(지배주주와 그 특수관계자 제외)이다."}, "t078": {"kw": ["[유지제도 장점] 교체압력이 완화되어 감사인의 독립성이 유지될 수 있음", "[유지제도 단점] 감사대상회사와 친밀한 관계가 형성되어 유착위협으로 인하여 독립성이 훼손될 수 있음", "[교체제도 장점] 유착위협이 감소되어 독립성이 유지될 수 있음", "[교체제도 단점] 교체된 감사업무팀원들이 회사에 대한 이해도가 높지 않아 효과적이고 효율적인 감사를 수행하기 어려울 수 있음"], "ans": "주권상장법인 등의 감사인 유지제도의 장점은 교체압력이 완화되어 감사인의 독립성이 유지될 수 있다는 점이고, 단점은 감사대상회사와 친밀한 관계가 형성되어 유착위협으로 인하여 독립성이 훼손될 수 있다는 점이다. 감사참여자 교체제도의 장점은 유착위협이 감소되어 독립성이 유지될 수 있다는 점이고, 단점은 교체된 감사업무팀원들이 회사에 대한 이해도가 높지 않아 효과적이고 효율적인 감사를 수행하기 어려울 수 있다는 점이다."}, "t079": {"kw": ["전기감사인과 다른 감사인을 신규로 선임하는 경우(증권선물위원회 보고의무 없음)", "주권상장법인·대형비상장주식회사·금융회사가 연속하는 3개 사업연도 중에 감사인이 직무상 의무를 위반하는 등의 사유로 연속하는 3개 사업연도 중에 감사인을 해임하는 경우(증권선물위원회 보고의무 있음)"], "ans": "회사는 자기의 요구에 따르지 않는 감사인을 부당하게 교체할 여지가 있으므로, 감사인의 교체나 해임시 전임감사인에게 감사 또는 감사위원회(감사인선임권자)에게 의견을 진술할 기회를 주어야 한다. 의견진술기회를 주어야 하는 경우는 ①전기감사인과 다른 감사인을 신규로 선임하는 경우(증권선물위원회 보고의무 없음), ②주권상장법인·대형비상장주식회사·금융회사가 연속하는 3개 사업연도 중에 감사인이 직무상 의무를 위반하는 등의 사유로 연속하는 3개 사업연도 중에 감사인을 해임하는 경우(증권선물위원회 보고의무 있음)이다."}, "t080": {"kw": ["국제적 정합성: 감사인 지정제도를 시행하고 있는 국가는 거의 없으므로 국제적 정합성에 맞지 않음", "지배구조 개선: 회사의 지배구조가 효과적이지 않아 독립성 유지가 어렵다면 감사인 지정제도가 아니라 지배구조를 개선하는 제도를 마련해야 함", "경쟁 약화로 적격성 저하: 감사인 지정은 회계법인간의 경쟁을 약화시키므로 감사인의 적격성을 떨어뜨릴 수 있음"], "ans": "감사인 지정제도에 대한 반대논리는 다음과 같다. ①감사인 지정제도를 시행하고 있는 국가는 거의 없으므로 국제적 정합성에 맞지 않는다. ②회사의 지배구조가 효과적이지 않아 감사 또는 감사위원회가 독립성을 유지하기 어렵다면 감사인 지정제도를 도입할 것이 아니라 지배구조를 개선하는 제도를 마련해야 한다. ③감사인 지정은 회계법인간의 경쟁을 약화시키므로 감사인의 적격성을 떨어뜨릴 수 있다(국가배정방식의 단점)."}, "t081": {"kw": ["[주기적 지정] 다음의 각 회사가 연속하는 6개 사업연도에 대해서 자유롭게 감사인을 선임한 경우 그 다음 3개 사업연도의 감사인으로 회계법인을 지정", "주권상장법인(코넥스시장 상장법인 제외)", "대주주와 그 특수관계자가 발행주식총수의 50% 이상을 소유하고 대주주 또는 그 특수관계자가 대표이사인 소유·경영 미분리 대형비상장주식회사", "다만 과거 6년 이내에 증권선물위원회의 감리를 받은 결과 회계처리기준 위반이 발견되지 않은 경우에는 자유롭게 선임 가능"], "ans": "감사인 지정제도 중 주기적 지정은 다음의 각 회사가 연속하는 6개 사업연도에 대해서 자유롭게 감사인을 선임한 경우, 증권선물위원회가 그 다음 3개 사업연도의 감사인으로 회계법인을 지정하는 제도이다. 대상은 ①주권상장법인(코넥스시장 상장법인은 제외), ②대주주와 그 특수관계자가 발행주식총수의 50% 이상을 소유하고, 대주주 또는 그 특수관계자가 해당 회사의 대표이사인 소유·경영 미분리 대형비상장주식회사이다. 다만 과거 6년 이내에 증권선물위원회의 감리를 받은 결과 회계처리기준 위반이 발견되지 않은 경우에는 회사가 자유롭게 감사인을 선임할 수 있다."}, "t082": {"kw": ["감사(위원회)의 승인을 받아 선임기간 내에 감사인 지정을 요청하거나, 선임기간 내에 감사인을 선임하지 아니한 회사", "기업구조조정 촉진법에 따른 주채권은행 또는 주주가 지정을 요청하는 회사", "외부감사법에 정한 절차를 위반하여 감사인을 선임하거나 감사계약의 해지·감사인 해임을 하지 아니한 회사, 감리 결과 회계처리기준을 위반한 회사", "외부감사법을 위반하여 감사인이 재무제표를 대신 작성하거나 회계처리 자문을 요구·제공받은 회사", "주권상장법인 중 3개 사업연도 연속 영업이익·영업현금흐름이 0보다 작거나 이자보상배율이 1 미만인 회사, 관리종목·투자주의환기종목, 최대주주 변경 2회 이상 또는 대표이사 교체 3회 이상 발생 회사", "표준감사시간보다 현저히 낮은 회사, 그 밖에 대통령령으로 정하는 회사"], "ans": "일반적 지정(직권지정) 사유는 다음과 같다. ①감사 또는 감사위원회의 승인을 받아 감사인의 선임기간 내에 감사인 지정을 요청한 회사, ②기업구조조정 촉진법에 따른 주채권은행 또는 대통령령으로 정하는 주주가 증권선물위원회에 감사인 지정을 요청하는 회사, ③감사인의 선임기간 내에 감사인을 선임하지 아니한 회사, ④외부감사법에 정한 절차를 위반하여 감사인을 선임하거나 증권선물위원회가 회사의 감사인 교체 사유가 부당하다고 인정한 회사, ⑤외부감사법에 정한 절차를 위반하여 감사계약의 해지 또는 감사인의 해임을 하지 아니하거나 새로운 감사인을 선임하지 아니한 회사, ⑥증권선물위원회의 감리 결과 회계처리기준을 위반한 회사, ⑦외부감사법을 위반하여 회사의 재무제표를 감사인이 대신하여 작성하거나 회계처리에 대한 자문을 요구하거나 받은 회사, ⑧주권상장법인 중 3개 사업연도 연속 영업이익이 0보다 작거나·영업현금흐름이 0보다 작거나·이자보상배율이 1 미만이거나·재무기준에 해당하는 회사, ⑨주권상장법인 중 관리종목이나 투자주의환기종목으로 지정된 회사, ⑩직전 사업연도를 포함하여 과거 3년간 최대주주 변경이 2회 이상 발생하거나 대표이사의 교체가 3회 이상 발생한 주권상장법인, ⑪감사인의 감사시간이 표준감사시간보다 현저히 낮은 수준이라고 증권선물위원회가 인정한 회사, ⑫그 밖에 공정한 감사가 특히 필요하다고 인정되어 대통령령으로 정하는 회사이다."}, "t083": {"kw": ["[선임권자] 주권상장법인·대형비상장주식회사·금융회사는 감사위원회(감사위원회 미설치시 감사인선임위원회 승인 후 감사가 선임), 기타비상장법인은 감사(위원회)", "[선임기한] 원칙은 매 사업연도 개시일부터 45일 이내, 감사위원회 설치대상은 매 사업연도 개시일 이전, 전기에 감사를 받지 않은 경우는 해당 사업연도 개시일부터 4개월 이내"], "ans": "감사인의 선임권자는 주권상장법인·대형비상장주식회사·금융회사의 경우 감사위원회이며(감사위원회가 설치되지 않은 경우 감사인선임위원회의 승인을 얻은 후 감사가 선임), 기타비상장법인의 경우 감사(위원회)이다. 감사인의 선임기한은 원칙적으로 매 사업연도 개시일부터 45일 이내이며, 예외적으로 감사위원회 설치대상은 매 사업연도 개시일 이전, 전기에 감사를 받지 않은 경우는 해당 사업연도 개시일부터 4개월 이내이다."}, "t084": {"kw": ["감사보수", "감사시간(예상되는 감사시간을 의미하며 실제 투입되는 감사시간은 달라질 수 있음)", "감사에 필요한 인력"], "ans": "감사인 선임시 감사 등이 문서화하여야 할 사항은 ①감사보수, ②감사시간(예상되는 감사시간을 의미하며 실제로 투입되는 감사시간은 달라질 수 있음), ③감사에 필요한 인력이다. 감사인의 선임주체인 감사 등은 감사가 완료된 후 이 3가지 사항이 준수되었는지 확인하여야 한다."}, "t085": {"kw": ["[감사대상회사] 주요 주주·주요 경영진 및 지배기구의 성실성", "당기 또는 이전에 감사업무를 수행하는 중에 발생한 유의적 사항들과 그러한 사항들이 의뢰인과의 관계유지에 대해 시사하는 점", "[감사인] 업무팀이 감사업무를 수행할 능력이 있으며 시간과 자원 등 필요한 역량을 갖추었는지 여부(적격성 관련)", "회계법인과 업무팀이 관련 윤리적 요구사항을 준수할 수 있는지 여부(독립성 관련)"], "ans": "감사업무의 수용·유지의 결정시 고려사항은 다음과 같다. 감사대상회사와 관련하여 ①주요 주주·주요 경영진 및 지배기구의 성실성, ②당기 또는 이전에 감사업무를 수행하는 중에 발생한 유의적 사항들과 그러한 사항들이 의뢰인과의 관계유지에 대해 시사하는 점을 고려한다. 감사인과 관련하여 ③업무팀이 감사업무를 수행할 능력이 있으며 시간과 자원 등 필요한 역량을 갖추었는지 여부(적격성 관련), ④회계법인과 업무팀이 관련 윤리적 요구사항을 준수할 수 있는지 여부(독립성 관련)를 고려한다."}, "t086": {"kw": ["의뢰인 관계의 수용 및 특정 감사업무의 수임 여부에 대하여 감사기준서 220에서 요구되는 절차를 수행함(수용유지 결정 고려사항 4가지 고려)", "공인회계사윤리기준의 관련 요구사항을 준수하기 위하여 전임감사인과 커뮤니케이션을 함"], "ans": "초도감사시 감사를 착수하기 전에 수행할 절차는 ①의뢰인 관계의 수용 및 특정 감사업무의 수임 여부에 대하여 감사기준서 220에서 요구되는 절차를 수행하는 것(수용·유지 결정시 4가지 고려사항을 고려하라는 의미)과, ②공인회계사윤리기준의 관련 요구사항을 준수하기 위하여 전임감사인과 커뮤니케이션을 하는 것이다."}, "t087": {"kw": ["재무제표 작성에 적용되는 재무보고체계가 수용가능한지 여부의 결정", "경영진의 재무제표 작성책임(재무보고체계에 따른 작성)", "중요한 왜곡표시방지를 위한 내부통제의 유지책임", "감사인에게 정보에 대한 접근, 기업 내부(외부×) 관계자들에 대한 제한 없는 접근, 감사목적으로 요청하는 추가적인 정보를 제공할 책임"], "ans": "경영진과 합의하여야 하는 감사업무의 전제조건은 다음과 같다. ①재무제표 작성에 적용되는 재무보고체계가 수용가능한지 여부의 결정, ②경영진이 다음 3가지 책임을 인정하고 이해하고 있다는 점에 대한 경영진의 동의이다. 즉 ㉠재무보고체계에 따른 재무제표의 작성책임, ㉡중요한 왜곡표시방지를 위한 내부통제의 유지책임, ㉢감사인에게 ⓐ재무제표의 작성과 관련하여 경영진이 알고 있는 모든 정보에 대한 접근, ⓑ감사인이 감사증거를 입수하기 위해 필요하다고 판단한 기업 내부(외부×) 관계자들에 대한 제한 없는 접근, ⓒ감사인이 감사목적으로 경영진에게 요청하는 추가적인 정보를 제공할 책임이다."}, "t088": {"kw": ["회사의 재무제표를 대표이사와 회계담당 이사를 대신하여 작성하는 행위", "회사의 재무제표 작성과 관련된 회계처리에 대한 자문에 응하는 행위", "회사의 재무제표 작성과 관련된 회계처리방법의 결정에 관여하는 행위", "회사의 재무제표 작성에 필요한 계산 또는 회계 분개를 대신하여 해주는 행위"], "ans": "재무제표 작성책임과 관련된 감사인의 세부금지행위는 다음과 같다. ①회사의 재무제표를 대표이사와 회계담당 이사를 대신하여 작성하는 행위, ②회사의 재무제표 작성과 관련된 회계처리에 대한 자문에 응하는 행위, ③회사의 재무제표 작성과 관련된 회계처리방법의 결정에 관여하는 행위, ④회사의 재무제표 작성에 필요한 계산 또는 회계 분개를 대신하여 해주는 행위이다."}, "t089": {"kw": ["재무제표감사의 목적과 범위", "경영진의 책임(감사업무의 전제조건)", "재무제표 작성을 위한 해당 재무보고체계의 식별(감사업무의 전제조건)", "감사인의 책임", "감사인에 의해 발행될 보고서의 예상되는 형태와 내용에 대한 언급", "해당 보고서가 예상되는 형태와 내용과 다를 수 있는 상황이 존재할 수 있다는 설명"], "ans": "감사계약서의 필수적 기재사항 6가지는 ①재무제표감사의 목적과 범위, ②경영진의 책임(감사업무의 전제조건), ③재무제표 작성을 위한 해당 재무보고체계의 식별(감사업무의 전제조건), ④감사인의 책임, ⑤감사인에 의해 발행될 보고서의 예상되는 형태와 내용에 대한 언급, ⑥해당 보고서가 예상되는 형태와 내용과 다를 수 있는 상황이 존재할 수 있다는 설명이다."}, "t090": {"kw": ["감사범위에 대한 상세한 설명: 감사인이 준수하는 해당 법규·감사기준·윤리기준 및 기타 전문직 단체가 공표한 기준에 대한 언급(재무제표감사의 목적과 범위 관련)", "감사인의 책임 관련: 내부통제의 고유한계 및 감사의 고유한계로 인해 감사가 적절하게 계획·수행되어도 중요왜곡표시가 발견되지 않을 수 있다는 사실", "후속사건 관련: 감사보고서일부터 재무제표 발행일까지의 기간 중 재무제표에 영향을 미칠 수 있는 사실로서 경영진이 알게 된 사실을 감사인에게 통지할 것에 대한 경영진의 동의", "감사보수 계산의 근거, 감사보수의 청구 및 지급방법 등"], "ans": "감사계약서의 보충적 기재사항의 예시는 다음과 같다. ①감사인이 준수하는 해당 법규·감사기준·윤리기준 및 기타 전문직 단체가 공표한 기준에 대한 언급 등 감사범위에 대한 상세한 설명(재무제표감사의 목적과 범위 관련), ②내부통제의 고유한계 및 감사의 고유한계로 인해 감사가 감사기준에 따라 적절하게 계획되고 수행되어도 중요왜곡표시가 발견되지 않을 수 있다는 사실(감사인의 책임 관련), ③감사보고서일부터 재무제표 발행일까지의 기간 중 재무제표에 영향을 미칠 수 있는 사실로서 경영진이 알게 된 사실을 감사인에게 통지할 것에 대한 경영진의 동의(후속사건 관련), ④감사보수 계산의 근거, 감사보수의 청구 및 지급방법 등이다."}, "t091": {"kw": ["[상황] 감사의 필요성에 영향을 미치는 상황의 변화, 당초 요청했던 감사의 성격에 대한 오해", "[대응] 조건을 변경하고 감사인과 경영진은 새로운 업무조건에 합의하고 계약서 등에 이를 기록함", "보고서를 읽을 때의 혼란을 피하기 위하여 관련 서비스의 보고서에는 당초 감사업무와 당초 감사업무에서 수행되었을 절차를 언급하지 않아야 함"], "ans": "감사대상회사가 감사업무조건 변경을 요구할 때 합리적 정당성이 있는 상황은 ①감사의 필요성에 영향을 미치는 상황의 변화, ②당초 요청했던 감사의 성격에 대한 오해이다. 이 경우 대응절차로 ①조건을 변경하고 감사인과 경영진은 새로운 업무조건에 합의하고 계약서 등에 이를 기록하며, ②보고서를 읽을 때의 혼란을 피하기 위하여 관련 서비스의 보고서에는 당초 감사업무와 당초 감사업무에서 수행되었을 절차를 언급하지 않아야 한다."}, "t092": {"kw": ["[상황] 감사범위의 제한으로 인한 한정의견을 회피하기 위해 검토업무로 변경을 요청한 경우", "[대응] 해당 법규에서 허용하는 경우 감사업무를 해지함", "지배기구·소유주 또는 규제기관과 같은 기타 이해관계자에게 그러한 상황을 보고해야 할 계약상 또는 기타 형태의 의무가 존재하는지 여부를 결정함"], "ans": "감사업무조건 변경 요구시 합리적 정당성이 없는 상황은 감사범위의 제한으로 인한 한정의견을 회피하기 위해 검토업무로 변경을 요청한 경우이다. 이 경우 대응절차로 ①해당 법규에서 허용하는 경우 감사업무를 해지하고, ②지배기구·소유주 또는 규제기관과 같은 기타 이해관계자에게 그러한 상황을 보고해야 할 계약상 또는 기타 형태의 의무가 존재하는지 여부를 결정한다."}, "t093": {"kw": ["[자격요건 또는 독립성] 외부감사법에 따라 회사의 감사인이 될 수 없는 경우", "회계감사기준에서 정한 감사인의 독립성이 훼손된 경우로서 증권선물위원회가 인정", "직업윤리에 관한 규정에서 정한 감사인의 독립성이 훼손된 경우로서 증권선물위원회가 인정", "[감사보수] 회사가 직전·해당 사업연도 중 감사보수를 미지급하거나, 합병·분할·사업양수도로 규모가 현저히 달라졌으나 감사보수에 대한 재계약이 안 된 경우"], "ans": "모든 회사에 적용되는 감사인 측의 감사계약 해지사유는 다음과 같다. 자격요건 또는 독립성 측면에서 ①외부감사법에 따라 회사의 감사인이 될 수 없는 경우, ②회계감사기준에서 정한 감사인의 독립성이 훼손된 경우로서 증권선물위원회가 인정한 경우, ③직업윤리에 관한 규정에서 정한 감사인의 독립성이 훼손된 경우로서 증권선물위원회가 인정한 경우가 있고, 감사보수 측면에서 ④회사가 직전·해당 사업연도 중 감사보수를 미지급한 경우, ⑤회사의 합병·분할·사업양수도로 주요 사업부문의 성격이나 회사의 규모가 현저히 달라졌으나 감사보수에 대한 재계약이 안 된 경우가 있다."}, "t094": {"kw": ["회사가 공인회계사법의 직무제한 규정(제21조·제33조)을 위반하여 감사인을 선임한 경우", "이 경우 감사계약 해지사유는 회사 측(부당선임)에 귀책"], "ans": "모든 회사에 적용되는 회사 측 귀책의 감사계약 해지사유는, 회사가 공인회계사법의 직무제한 규정(제21조 직무제한 및 제33조 직무제한)을 위반하여 감사인을 선임한 경우이다. 이 경우 해당 감사인은 감사계약을 해지할 수 있다."}, "t095": {"kw": ["공인회계사법 제33조(회계법인·사원과 그 배우자에 대한 직무제한)를 위반하여 선임한 경우", "이는 자격요건 또는 독립성과 관련된 회사 귀책의 해지사유에 해당"], "ans": "감사인 측 감사계약 해지사유 중 자격요건 관련 사유는, 회사가 공인회계사법 제33조(회계법인·사원과 그 배우자에 대한 직무제한 규정)를 위반하여 감사인을 선임한 경우이다. 이 경우 감사인은 감사계약을 해지할 수 있다."}, "t096": {"kw": ["[상대방 귀책] 감사인이 회사의 기밀을 누설하는 등 직무상 의무를 위반, 감사인이 그 임무를 게을리하여 회사에 손해를 발생, 감사인이 회계감사와 관련하여 부당한 요구나 압력 행사, 회사가 특별한 사유 없이 요청한 자료를 미제출하여 감사업무에 현저한 지장 발생, 회사관계자가 감사의견과 관련하여 부당한 요구나 압력 행사", "[기타] 외국투자가가 출자한 회사로서 출자조건에서 감사인을 한정, 지배회사나 종속회사와 같은 지정감사인 선임, 2개 사업연도 연속 내부회계관리제도의 감사의견에 발견된 중요한 취약점 내용 포함"], "ans": "주권상장법인·대형비상장주식회사·금융회사에 추가로 적용되는 감사계약 해지사유는 다음과 같다. 상대방 귀책으로 ①감사인이 회사의 기밀을 누설하는 등 직무상 의무를 위반한 경우, ②감사인이 그 임무를 게을리하여 회사에 손해를 발생시킨 경우, ③감사인이 회계감사와 관련하여 부당한 요구나 압력을 행사한 경우, ④회사가 특별한 사유 없이 요청한 자료를 미제출하여 감사업무에 현저한 지장이 발생한 경우, ⑤회사관계자가 감사의견과 관련하여 부당한 요구나 압력을 행사한 경우가 있고, 기타로 ⑥외국투자가가 출자한 회사로서 출자조건에서 감사인을 한정한 경우, ⑦지배회사나 종속회사와 같은 지정감사인을 선임한 경우, ⑧2개 사업연도 연속 내부회계관리제도의 감사의견에 발견된 중요한 취약점 내용이 포함된 경우가 있다."}, "t097": {"kw": ["오해를 나타내는 어떤 징후가 있는 경우", "경영진의 변경", "소유구조의 유의적 변화", "사업의 성격이나 규모의 유의적 변화", "법규·재무보고체계의 개정", "기타 감사업무의 조건과 관련된 상황의 변화"], "ans": "계속감사의 경우 감사인은 상황의 변화에 따라 감사업무의 조건이 수정되어야 하는지 여부 및 기존 감사업무조건을 기업에 다시 알릴 필요가 있는지 여부를 평가하여야 한다. 감사업무 조건을 갱신하거나 현행 조건을 기업에 다시 알리는 사유로는 ①기업이 감사업무의 조건을 오해하고 있다는 어떤 징후가 있는 경우, ②경영진의 변경, ③소유구조의 유의적 변화, ④사업의 성격이나 규모의 유의적 변화, ⑤법규나 재무보고체계의 개정, ⑥기타 감사업무의 조건과 관련된 상황의 변화가 있다."}, "t098": {"kw": ["기업과 기업환경의 이해", "해당 재무보고체계의 이해", "내부통제시스템의 이해", "이를 통한 중요왜곡표시위험(RMM)의 식별과 평가", "평가된 위험에 대한 대응절차(계획수립)"], "ans": "위험평가절차는 ①기업과 기업환경, ②해당 재무보고체계, ③내부통제시스템을 이해하고, ④이를 통해 중요왜곡표시위험(RMM)을 식별·평가하며, ⑤평가된 위험에 대응하는 절차(계획수립)를 설계하는 것으로 구성된다."}, "t099": {"kw": ["중요왜곡표시위험이 높은 경우 더 많은 양이 요구됨", "감사증거의 질(적합성)이 낮은 경우 더 많은 양이 요구됨(단, 양을 증가시키더라도 질이 높아지는 것은 아님)", "중요성이 낮은 경우 더 많은 양이 요구됨"], "ans": "감사증거의 충분성(감사증거의 양)에 영향을 미치는 요소는 ①중요왜곡표시위험(중요왜곡표시위험이 높을수록 더 많은 양이 요구됨), ②감사증거의 질인 적합성(질이 낮을수록 더 많은 양이 요구되나, 양을 증가시키더라도 질이 높아지는 것은 아님), ③중요성(중요성이 낮을수록 더 많은 양이 요구됨)이다."}, "t100": {"kw": ["신뢰성(증거력)", "목적적합성(경영진주장과의 관련성)"], "ans": "적합성(감사증거의 질) 있는 감사증거가 되기 위한 요건은 ①신뢰성(증거력)과 ②목적적합성(경영진주장과의 관련성)이다. 예를 들어 실재성은 역진법으로, 완전성은 전진법으로 관련성 있는 증거를 입수한다."}, "t101": {"kw": ["원천: 감사증거의 원천", "성격: 감사증거의 성격", "증거의 작성과 유지에 대한 통제"], "ans": "감사증거의 신뢰성(증거력)에 영향을 미치는 요소는 ①원천, ②성격, ③증거의 작성과 유지에 대한 통제이다."}, "t102": {"kw": ["외부의 독립된 원천에서 감사증거를 입수한 경우", "감사인이 직접 입수한 감사증거(통제의 적용에 대한 관찰)는 간접적으로 또는 추론으로 입수한 증거(통제의 적용에 관한 질문)보다 신뢰성이 높음", "문서증거가 구두증거보다 신뢰성이 높음(경영진의 서면진술은 구두진술보다 신뢰성이 높음)", "내부증거는 그 작성과 유지에 대한 통제 등 기업이 수립한 관련 통제가 효과적일 때 신뢰성이 높음"], "ans": "감사증거는 다음의 경우 신뢰성이 높다. ①기업 외부의 독립된 원천에서 감사증거를 입수한 경우, ②감사인이 직접 입수한 감사증거(통제의 적용에 대한 관찰)는 간접적으로 또는 추론으로 입수한 감사증거(통제의 적용에 관한 질문)보다 신뢰성이 높고, ③문서증거가 구두증거보다 신뢰성이 높으며(경영진의 서면진술은 구두진술보다 신뢰성이 높음), ④내부증거는 그 작성과 유지에 대한 통제 등 기업이 수립한 관련 통제가 효과적일 때 신뢰성이 높다."}, "t103": {"kw": ["정보의 완전성과 정확성을 평가", "정보가 감사목적상 충분히 정밀하고 상세한지 평가", "입수·검토를 통해 확인"], "ans": "기업이 생산한 정보를 감사증거로 이용할 때 감사인은 그 정보의 신뢰성을 평가하기 위하여, 해당 정보의 정확성과 완전성에 대한 감사증거를 입수하고, 정보가 감사목적상 충분히 정밀하고 상세한지 평가하여야 한다."}, "t104": {"kw": ["실재성은 역진법으로 확인", "역진법: 총계정원장·보조장부에서 증빙으로 거슬러 확인(과대계상 검증)", "매출채권은 과대계상 방향이므로 역진법 적용"], "ans": "역진법은 총계정원장이나 보조장부에 기록된 금액에서 출발하여 관련 증빙으로 거슬러 올라가며 확인하는 방법으로, 자산의 과대계상(실재성) 여부를 검증하는 데 사용된다. 매출채권의 실재성(매출의 발생사실)은 역진법으로 확인하며, 이때 모집단은 장부이다."}, "t105": {"kw": ["전반적인 감사목적의 달성에 관한 결론의 근거를 제공", "감사가 감사기준과 관련법규의 요구사항에 따라 계획되고 수행되었다는 사실의 증거를 제공"], "ans": "감사조서 작성의 주된 목적은 ①전반적인 감사목적의 달성에 관한 결론의 근거를 제공하고, ②감사가 감사기준과 관련법규의 요구사항에 따라 계획되고 수행되었다는 사실의 증거를 제공하는 것이다."}, "t106": {"kw": ["업무팀이 감사를 계획하고 수행하는 것을 지원", "업무팀이 자신이 수행한 업무에 대해 책임질 수 있도록 함", "감독책임이 있는 업무팀원들이 감사업무를 지휘·감독하며 검토책임을 완수하도록 지원", "향후의 감사에 지속적으로 유의적인 사항에 대한 기록을 유지", "한국공인회계사회가 제정한 품질관리기준 또는 해당국가의 요구사항에 따른 품질관리검토와 검사를 가능하게 함", "관련법규 또는 기타요구사항에 따른 외부 검사업무 수행을 가능하게 함"], "ans": "감사조서 작성의 추가 목적은 ①업무팀이 감사를 계획하고 수행하는 것을 지원하고, ②업무팀이 자신이 수행한 업무에 대해 책임질 수 있도록 하며, ③감독책임이 있는 업무팀원들이 감사업무를 지휘·감독하며 검토책임을 완수하도록 지원하고, ④향후의 감사에 지속적으로 유의적인 사항에 대한 기록을 유지하며, ⑤한국공인회계사회가 제정한 품질관리기준 또는 최소한 이에 준하는 해당국가의 요구사항에 따른 품질관리검토와 검사를 가능하게 하고, ⑥관련법규 또는 기타요구사항에 따른 외부 검사업무 수행을 가능하게 하는 것이다."}, "t107": {"kw": ["감사기준과 관련법규의 요구사항을 준수하기 위해 수행한 감사절차의 성격·시기 및 범위", "감사절차의 수행결과 및 입수한 감사증거", "감사 중 발생한 유의적 사항, 그러한 사항에 대해 도달된 결론 및 결론에 도달할 때 행한 유의적인 전문가적 판단"], "ans": "이전에 해당 감사에 관여되지 않은 숙련된 감사인이 충분히 이해할 수 있도록 감사조서에 포함되어야 하는 내용은 ①감사기준과 관련법규의 요구사항을 준수하기 위해 수행한 감사절차의 성격·시기 및 범위, ②감사절차의 수행결과 및 입수한 감사증거, ③감사 중 발생한 유의적 사항, 그러한 사항에 대해 도달된 결론 및 결론에 도달할 때 행한 유의적인 전문가적 판단이다."}, "t108": {"kw": ["감사조서 취합완료일: 감사보고서일부터 60일 이내", "감사문서 보존: 감사종료시점부터 8년간(취합완료일 이후 보존기간 종료 전까지 삭제·폐기 불가)"], "ans": "감사조서 관련 기간규정은 다음과 같다. 감사조서의 취합완료일은 감사보고서일부터 60일 이내이며, 이는 취합이 과도하게 지연되는 것을 방지하고 향후 감리나 소송 등에서 감사조서가 감사인에게 유리하게 부당하게 수정·추가되는 행위를 예방하기 위함이다. 감사조서의 소유권은 감사인에게 있으며, 외부감사법에 따라 감사문서를 감사종료시점(재무제표일 아님)부터 8년간 보존해야 한다."}, "t109": {"kw": ["감사문서를 수정하거나 추가하는 구체적 이유", "감사문서를 수정·추가하고 이를 검토한 사람과 그 시기"], "ans": "감사인이 감사조서를 수정하거나 추가할 때 문서화할 사항은 ①감사문서를 수정하거나 추가하는 구체적 이유와 ②감사문서를 수정·추가하고 이를 검토한 사람과 그 시기이다."}, "t110": {"kw": ["당면한 상황(해당 후속사건)", "새로 수행한 감사절차 또는 추가적인 감사절차, 입수한 감사증거, 도달된 결론 및 감사보고서에 미친 영향", "이에 따른 감사문서의 변경자와 검토자 및 그 시기"], "ans": "후속사건에 대해 감사보고서일 이후에 입수한 감사증거에 대해 문서화할 사항은 ①당면한 상황(해당 후속사건), ②새로 수행한 감사절차 또는 추가적인 감사절차, 입수한 감사증거, 도달된 결론 및 감사보고서에 미친 영향, ③이에 따른 감사문서의 변경자와 검토자 및 그 시기이다."}, "t111": {"kw": ["알려진 반대의 조건이 존재하지 않는 상황에서 데이터 간에는 상관관계가 존재함", "그 상관관계는 지속됨"], "ans": "분석적절차의 2가지 가정은 ①알려진 반대의 조건이 존재하지 않는 상황에서 데이터 간에는 상관관계가 존재하고, ②그 상관관계는 지속된다는 것이다."}, "t112": {"kw": ["경영진에게 질문하고 경영진의 답변과 관련성이 있는 적합한 감사증거를 입수함(전문가적 의구심 중 감사증거에 대해 비판적인 평가를 하는 태도)", "그러한 상황에 필요한 기타의 감사절차를 수행함"], "ans": "분석적절차의 수행결과 유의적인 차이가 발견된 경우 추가적인 수행절차는 ①경영진에게 질문하고 경영진의 답변과 관련성이 있는 적합한 감사증거를 입수하는 것(전문가적 의구심 중 감사증거에 대해 비판적인 평가를 하는 태도)과, ②그러한 상황에 필요한 기타의 감사절차를 수행하는 것이다."}, "t113": {"kw": ["감사인이 알지 못한 기업의 측면들을 식별하게 할 수 있음", "위험평가에 대한 대응을 설계하고 실행하는 근거를 제공하기 위해 중요왜곡표시위험을 평가하는 데 도움을 주기 위하여 수행함"], "ans": "위험평가절차단계의 분석적절차(필수)의 목적은 감사인이 알지 못한 기업의 측면들을 식별하게 할 수 있고, 위험평가에 대한 대응을 설계하고 실행하는 근거를 제공하기 위해 중요왜곡표시위험을 평가하는 데 도움을 주기 위하여 수행하는 것이다. 수행주체는 주요업무팀원(감사현장책임자)이다."}, "t114": {"kw": ["관련성이 있고 신뢰할 수 있는 감사증거를 입수(적합성)", "실증적인 분석적절차를 이용하여 감사증거를 입수함"], "ans": "실증절차단계의 분석적절차(선택)의 목적은 감사인이 실증적인 분석적절차를 이용하여 관련성이 있고 신뢰할 수 있는 감사증거를 입수(적합성)하기 위한 것이다. 수행주체는 각 계정과목의 담당자이다."}, "t115": {"kw": ["필요성 결정: 특정 실증적인 분석적절차가 적절한지를 결정", "(원천)데이터의 신뢰성 평가: 기대치가 도출될 데이터의 신뢰성을 평가", "합리적 기대치의 도출: 기대치가 충분히 정확한지 여부를 평가", "수용가능한 차이금액 결정: 추가조사 없이 수용될 수 있는 기록된 금액과 기대치와의 차이금액을 결정"], "ans": "합리적 기대치와 회사의 실제재무정보를 비교하기 전에 수행해야 하는 4가지 절차는 ①실증적인 분석적절차의 필요성 결정(특정 실증적인 분석적절차가 적절한지를 결정), ②(원천)데이터의 신뢰성 평가(기록된 금액이나 비율에 대한 감사인의 기대치가 도출될 데이터의 신뢰성을 평가), ③합리적 기대치의 도출(기록된 금액이나 비율에 대한 기대치를 도출하고, 그 기대치가 왜곡표시를 식별할 정도로 충분히 정확한지 평가), ④수용가능한 차이금액의 결정(추가적인 조사를 하지 않고 수용될 수 있는 기록된 금액과 기대치와의 차이금액을 결정)이다."}, "t116": {"kw": ["이용가능한 정보의 원천(외부에서 독립적인 원천)", "이용가능한 정보의 성격과 관련성(목표에 근거한 예산보다 예상되는 결과에 근거한 예산)", "정보의 완전성·정확성 및 타당성을 보장하도록 설계된 정보의 작성에 대한 통제(예산의 작성과 검토 및 유지에 대한 통제)", "이용가능한 정보의 비교가능성(광범위한 산업 데이터는 개별 기업의 데이터와 비교하기 위해 보완 필요)"], "ans": "데이터의 신뢰성 평가시 고려사항은 ①이용가능한 정보의 원천(외부에서 독립적인 원천일수록 신뢰성이 높음), ②이용가능한 정보의 성격과 관련성(목표에 근거한 예산보다 예상되는 결과에 근거한 예산이 신뢰성이 높음), ③정보의 완전성·정확성 및 타당성을 보장하도록 설계된 정보의 작성에 대한 통제(예산의 작성과 검토 및 유지에 대한 통제), ④이용가능한 정보의 비교가능성(광범위한 산업 데이터를 특정 제품을 생산·판매하는 개별 기업의 데이터와 비교하기 위해서는 해당 데이터를 보완해야 함)이다."}, "t117": {"kw": ["과거 보고기간에 대한 비교가능한 정보", "기업의 예산 또는 예측과 같은 기업의 기대치, 또는 감가상각비의 추정과 같은 감사인의 기대치", "유사한 산업정보(산업평균 또는 동일 산업에서 비슷한 규모 기업의 매출채권회전율과 해당 기업의 매출채권회전율 비교)"], "ans": "합리적 기대치의 재무정보에 대한 비교대상 예시는 ①과거 보고기간에 대한 비교가능한 정보, ②기업의 예산 또는 예측과 같은 기업의 기대치 또는 감가상각비의 추정과 같은 감사인의 기대치, ③유사한 산업정보(산업평균 또는 동일한 산업에서 비슷한 규모를 가진 기업의 매출채권회전율과 해당 기업의 매출채권회전율을 비교)이다."}, "t118": {"kw": ["실증적인 분석적절차의 예상결과가 예측되는 정확성(연구비 또는 광고비<매출총이익)", "정보가 세분될 수 있는 정도", "재무 및 비재무 정보의 이용가능성"], "ans": "기대치의 정확성을 결정짓는 요소는 ①실증적인 분석적절차의 예상결과가 예측되는 정확성(연구비 또는 광고비보다 매출총이익이 예측 정확성이 높음), ②정보가 세분될 수 있는 정도, ③재무 및 비재무 정보의 이용가능성이다."}, "t119": {"kw": ["경영진에게 질문하고 경영진의 답변과 관련성이 있는 적합한 감사증거를 입수함", "그러한 상황에 필요한 기타의 감사절차를 수행함", "(수용가능한 차이금액 이내면 세부테스트를 축소하거나 생략 가능)"], "ans": "기대치와 실제 재무정보의 차이가 수용가능한 차이금액을 초과하는 경우 감사인은 ①경영진에게 질문하고 경영진의 답변과 관련성이 있는 적합한 감사증거를 입수하며, ②그러한 상황에 필요한 기타의 감사절차를 수행한다. 반면 수용가능한 차이금액 이내인 경우에는 축소된 세부테스트를 수행하거나 충분하고 적합한 감사증거가 수집되었다면 세부테스트를 생략할 수 있다."}, "t120": {"kw": ["감사의 종료시점에 근접하여", "기업에 대하여 이해한 바와 재무제표가 일치하는지에 대해", "전반적인 결론을 내리기 위하여 분석적절차를 설계하고 수행"], "ans": "전반적인 결론형성단계의 분석적절차(필수)의 목적은 감사인이 감사의 종료시점에 근접하여 기업에 대하여 이해한 바와 재무제표가 일치하는지에 대해 전반적인 결론을 내리기 위하여 분석적절차를 설계하고 수행하는 것이다. 이 단계에서 이전에 인식되지 않았던 중요왜곡표시위험이 식별될 경우 위험평가를 수정하고 추가감사절차를 변경해야 한다. 수행주체는 주요업무팀원과 업무수행이사이다."}, "t121": {"kw": ["전에 존재하지 않던 정보나 확인적 감사증거", "기존 정보와 유의적으로 차이가 나는 정보", "경영진이나 지배기구의 변화·태도·동기 등에 관한 추가적 정보(변화·추론·근거)"], "ans": "질문에 대한 답변의 평가를 통해 감사인은 ①전에 존재하지 않던 정보나 기존 감사증거를 뒷받침하는 확인적 정보를 얻을 수 있고, ②입수한 다른 감사증거와 유의적으로 차이가 나는 정보를 얻을 수 있으며, ③경영진이나 지배기구의 태도·인식·동기의 변화 등에 관하여 추가적인 감사절차의 필요성을 시사하거나 그 근거가 되는 정보를 얻을 수 있다."}, "t122": {"kw": ["내·외부의 소재를 떠나", "종이나 전자 또는 기타매체 형태의", "기록이나 문서에 대한 조사"], "ans": "문서검사란 내·외부의 소재를 떠나 종이나 전자 또는 기타매체 형태의 기록이나 문서에 대한 조사를 말한다."}, "t123": {"kw": ["현금·유가증권·받을어음과 같이 상호융통이 가능한 자산은 동시에 실사함으로써 상호융통을 방지", "선택실사할 경우 실사장소를 미리 통보하지 않아야 함", "가능한 한 재무제표일 전후에 실사를 수행하여 증거의 적시성을 확보", "예금통장 등을 확인할 때에는 반드시 원본을 확인", "실사는 담당자의 참관 아래 수행되어야 하며 실사 완료 후 해당자산이 모두 이상 없이 반납되었음을 담당자로부터 문서(반납확인)로 확인받아야 함"], "ans": "실사 수행시 유의사항은 다음과 같다. ①현금·유가증권·받을어음과 같이 상호융통이 가능한 자산은 동시에 실사함으로써 상호융통을 방지해야 하고, ②선택실사할 경우 실사장소를 감사대상회사에 미리 통보하면 관련자산의 융통을 저지를 수 있으므로 미리 통보하지 않아야 하며, ③가능한 한 재무제표일 전후에 실사를 수행하여 증거의 적시성을 확보해야 하고, ④예금통장 등을 확인할 때에는 반드시 원본을 확인하여야 하며, ⑤자산의 분실에 대한 오해를 방지하기 위하여 실사는 감사대상회사 담당자의 참관 아래 수행되어야 하고 실사 완료 후에는 해당자산이 모두 이상 없이 반납되었음을 담당자로부터 문서(반납확인)로 확인받아야 한다."}, "t124": {"kw": ["타인이 수행하는 어떤 과정이나 절차를 육안으로 보는 것", "어떤 과정이나 절차의 수행에 대한 감사증거를 제공", "관찰이 행해지는 시점으로만 제한되며 그 행위가 관찰되고 있다는 사실 자체가 그 과정이나 절차가 수행되는 방식에 영향을 미칠 수 있다는 제한이 있음"], "ans": "관찰(입회)이란 타인이 수행하는 어떤 과정이나 절차를 육안으로 보는 것을 말한다. 관찰은 어떤 과정이나 절차의 수행에 대한 감사증거를 제공하지만, 관찰이 행해지는 시점으로만 제한되며 그 행위가 관찰되고 있다는 사실 자체가 그 과정이나 절차가 수행되는 방식에 영향을 미칠 수 있다는 제한이 있다."}, "t125": {"kw": ["감사인이 직접 제3자(외부), 즉 조회처로부터", "종이형태·전자문서 또는 기타매체(문서)를 통해", "직접적인 서면회신으로 입수한 감사증거"], "ans": "외부조회란 감사인이 직접 제3자(외부), 즉 조회처로부터 종이형태·전자문서 또는 기타매체(문서)를 통해 직접적인 서면회신으로 입수한 감사증거를 말한다."}, "t126": {"kw": ["기업 외부의 독립된 원천으로부터 입수된 감사증거임", "감사인이 직접 입수한 감사증거임", "종이·전자문서·기타매체 등 문서형태의 감사증거임"], "ans": "외부조회로 입수한 감사증거가 신뢰성이 높은 이유는 ①기업 외부의 독립된 원천으로부터 입수된 감사증거이고, ②감사인이 직접 입수한 감사증거이며, ③종이·전자문서·기타매체 등 문서형태의 감사증거이기 때문이다."}, "t127": {"kw": ["소극적 조회절차의 대상이 되는 항목의 모집단이 다수의 동질적이며 소액인 계정잔액이나 거래 또는 조건들로 구성되어 있음", "중요왜곡표시위험이 낮다고 평가하였고 경영진주장과 관련된 통제의 운영효과성에 대해 충분하고 적합한 감사증거를 입수하였음", "불일치사항의 발생률이 매우 낮을 것으로 예상됨", "감사인은 소극적 조회의 수신자가 그러한 요청을 무시할 상황이나 조건에 대하여 알고 있지 아니함(수신자가 요청을 무시할 가능성이 낮은 경우)"], "ans": "소극적 조회를 이용할 수 있는 경우는 다음 요건을 모두 충족할 때이다. ①소극적 조회절차의 대상이 되는 항목의 모집단이 다수의 동질적이며 소액인 계정잔액이나 거래 또는 조건들로 구성되어 있고, ②감사인이 중요왜곡표시위험이 낮다고 평가하였으며 경영진주장과 관련된 통제의 운영효과성에 대해 충분하고 적합한 감사증거를 입수하였고, ③불일치사항의 발생률이 매우 낮을 것으로 예상되며, ④감사인은 소극적 조회의 수신자가 그러한 요청을 무시할 상황이나 조건에 대하여 알고 있지 아니한 경우이다."}, "t128": {"kw": ["계정잔액과 그 구성요소에 관한 정보(예금잔액과 그 이자율, 최종이자지급일 등)", "해당기업과 다른 당사자 간의 약정·계약 또는 거래의 조건(부정에 대한 감사절차 관련)", "이면계약과 같은 특정의 조건이 없다는 사실(부정에 대한 감사절차 관련)"], "ans": "외부조회를 통해 확인할 수 있는 정보는 ①계정잔액과 그 구성요소에 관한 정보(예금잔액과 그 이자율, 최종이자지급일 등), ②해당기업과 다른 당사자 간의 약정·계약 또는 거래의 조건(부정에 대한 감사절차 관련), ③이면계약과 같은 특정의 조건이 없다는 사실(부정에 대한 감사절차 관련)이다."}, "t129": {"kw": ["확인하거나 요청할 정보의 결정", "적합한 조회대상자의 선택", "조회서의 설계", "조회처에 대한 조회요청서의 발송"], "ans": "외부조회시 감사인이 직접 통제해야 하는 4가지 절차는 ①확인하거나 요청할 정보의 결정, ②적합한 조회대상자의 선택, ③조회서의 설계, ④조회처에 대한 조회요청서의 발송이다."}, "t130": {"kw": ["조회서의 종류: 적극적 조회와 소극적 조회 중에 선택", "조회서에 수신인이 적절히 표시되어 있는지 여부", "감사인에게 직접 발송되도록 회신에 관한 정보가 포함되었는지 여부(조회서의 회신인이 반드시 감사인이어야 함)"], "ans": "조회서의 설계시 결정사항은 ①조회서의 종류(적극적 조회와 소극적 조회 중에 선택), ②조회서에 수신인이 적절히 표시되어 있는지 여부, ③감사인에게 직접 발송되도록 회신에 관한 정보가 포함되었는지 여부(조회서의 회신인이 반드시 감사인이어야 함)이다."}, "t131": {"kw": ["회사를 통해서 독촉", "추가조회서의 발송이 가능함", "대체적 감사절차를 수행함"], "ans": "외부조회가 미회신되는 경우 ①회사를 통해서 독촉하고(감사대상회사를 통해 회신을 독촉하면 보다 효과적·효율적으로 회신율을 높일 수 있음), ②최초의 주소가 정확한지 다시 확인한 후 추가(후속)조회서의 발송이 가능하며(필수 아님), ③대체적 감사절차를 수행한다."}, "t132": {"kw": ["왜곡표시의 여부를 확인함(거래처와 논의를 통해 차이내역을 확인)", "왜곡표시인 경우 부정징후의 여부를 평가함"], "ans": "외부조회 결과 조회내용이 불일치한다고 회신받은 경우 ①먼저 감사대상회사에게 그 거래처와 논의를 통하여 그 차이내역을 확인해 줄 것을 요청하고 그 확인된 내용이 실제로 맞는지 추가로 검토하여 왜곡표시의 여부를 확인하며, ②만약 그 불일치사항이 왜곡표시로 식별되는 경우 그러한 왜곡표시가 부정의 징후인지 여부를 평가한다."}, "t133": {"kw": ["[매출채권] 재무제표일 후 특정현금회수, 선적서류, 보고기간말에 근접하여 발생한 매출거래", "[매입채무] 재무제표일 후 현금지급, 상품수령증과 같은 기타기록, 제3자로부터의 서신(은행·중개업자)"], "ans": "매출채권과 매입채무에 대한 조회서의 미회신시 대체적 절차는 다음과 같다. 매출채권은 ①재무제표일 후 특정현금회수, ②선적서류, ③보고기간말에 근접하여 발생한 매출거래에 대한 조사를 수행한다. 매입채무는 ①재무제표일 후 현금지급, ②상품수령증과 같은 기타기록, ③제3자로부터의 서신(은행·중개업자)에 대한 조사를 수행한다."}, "t134": {"kw": ["경영진주장을 확인하기 위해 이용가능한 정보가 오직 기업의 외부에서만 입수가능한 경우", "특정 부정위험요소로 인해 감사인이 기업에서 입수한 증거를 신뢰할 수 없는 경우(경영진의 통제무력화위험, 종업원 및 경영진이 연루될 수 있는 공모위험)", "이 경우 대체적 감사절차는 불가하며 감사의견을 변형해야 함"], "ans": "적극적 조회의 회신이 반드시 필요한 경우는 ①경영진주장을 확인하기 위해 이용가능한 정보가 오직 기업의 외부에서만 입수가능한 경우, ②특정 부정위험요소로 인해 감사인이 기업에서 입수한 증거를 신뢰할 수 없는 경우(경영진의 통제무력화위험, 종업원 및 경영진이 연루될 수 있는 공모위험)이다. 이 경우 대체적 감사절차는 불가하며 감사의견을 변형해야 한다."}, "t135": {"kw": ["[간접 전달·의도되지 않은 발송] 조회처에 전화하여 실제로 회신을 보냈는지 확인하고 직접 서면회신을 요청", "[전자적 수령] 암호·전자서명·웹사이트 신뢰성 검증 절차 이용, 조회처에 전화 확인", "[특수관계자 회신] 조회 후 관련 문서검사 등 추가절차 실시", "[제한적 문구가 있는 경우] 비밀보장·회계감사목적 이용 등 이용 제한 문구가 있어도 신뢰성이 무효화되는 것은 아님(일반적으로 조회서에 포함되는 문구)"], "ans": "조회결과에 대하여 신뢰성이 의심되는 상황과 그 대응절차는 다음과 같다. ①회신이 감사인에게 간접적으로 전달된 경우나 회신이 원래 의도된 조회대상자로부터 발송되지 않은 것으로 보이는 경우, 조회처에 전화하여 조회처가 실제 그 회신을 보냈는지 확인하고 조회처가 감사인에게 직접 서면으로 회신해 달라고 요청한다. ②전자적으로 수령한 회신인 경우, 전자형태정보의 발신자 신원을 확인하기 위하여 암호·전자서명·웹사이트의 신뢰성을 검증하는 절차를 이용하고 조회처에 전화하여 확인한다. ③특수관계자로부터 회신한 경우, 조회로부터 입수한 감사증거의 신뢰성이 낮으므로 일단 조회를 실시한 후에 관련 문서검사 등 추가적인 절차를 실시한다. ④회신의 이용에 관한 제한적인 문구가 있는 경우, 비밀보장·회계감사목적으로만 이용한다는 등의 이용에 관한 제한적인 문구가 있다고 해서 감사증거의 신뢰성이 무효화되는 것은 아니다(일반적으로 조회서에 포함되는 문구임)."}, "t136": {"kw": ["경영진의 거부사유에 관하여 질문하고 그 타당성과 합리성에 관해 감사증거를 구함", "경영진의 거부가 부정위험 등 관련 중요왜곡표시위험에 대한 감사인의 평가와 다른 감사절차의 성격·시기 및 범위에 대하여 갖는 시사점을 평가함", "관련성이 있고 신뢰할 수 있는 감사증거를 입수할 수 있도록 설계된 대체적 감사절차를 수행함"], "ans": "경영진이 외부조회를 거부할 때 감사인의 대응절차는 ①경영진의 거부사유에 관하여 질문하고 그 타당성과 합리성에 관해 감사증거를 구하며, ②경영진의 거부가 부정위험 등 관련 중요왜곡표시위험에 대한 감사인의 평가와 다른 감사절차의 성격·시기 및 범위에 대하여 갖는 시사점을 평가하고, ③관련성이 있고 신뢰할 수 있는 감사증거를 입수할 수 있도록 설계된 대체적 감사절차를 수행하는 것이다."}, "t137": {"kw": ["지배기구와 커뮤니케이션한다", "감사와 감사의견에 대한 시사점을 결정한다"], "ans": "조회서의 발송
