의 다른 인원에게 질문하고, ②지배기구의 회의록 및 기업과 외부 법률고문간의 왕복문서를 검토하며, ③법률비용 계정을 검토하는 것이다."}, "t319": {"kw": ["식별된 소송이나 배상청구에 관하여 감사인이 중요왜곡표시위험이 있다고 평가한 경우", "감사절차를 수행한 결과 그 밖의 중요한 소송이나 배상청구가 존재할 가능성이 나타나는 경우(누락가능성)"], "ans": "외부법률고문과 직접 커뮤니케이션(변호사조회서)하여야 하는 경우는 ①식별된 소송이나 배상청구에 관하여 감사인이 중요왜곡표시위험이 있다고 평가한 경우, ②감사절차를 수행한 결과 그 밖의 중요한 소송이나 배상청구가 존재할 가능성이 나타나는 경우(누락가능성)이다."}, "t320": {"kw": ["모든 소송과 배상청구 사항(목록)", "그 결과에 대한 평가(승소여부)", "관련 비용 등 재무적 영향의 추정치"], "ans": "변호사조회서의 일반질문서는 다음 사항을 알려줄 것을 요청하는 질문서이다. ①모든 소송과 배상청구 사항(목록), ②그 결과에 대한 평가(승소여부), ③관련 비용 등 재무적 영향의 추정치이다."}, "t321": {"kw": ["소송과 배상청구의 목록", "가능한 경우 각 소송과 배상청구의 결과에 대한 경영진의 평가", "가능한 경우 관련 비용 등 재무적 영향에 대한 경영진의 추정치", "경영진의 평가가 타당한지 외부 법률고문이 확인해 주고, 소송과 배상청구 목록이 불완전하거나 부정확하다고 판단되면 추가적인 정보를 감사인에게 제공해 줄 것을 요청하는 내용"], "ans": "변호사조회서의 세부질문서는 외부법률고문이 일반질문서에 대하여 적절하게 답변하지 않을 것으로 판단되는 경우 다음 사항을 포함하는 질문서이다. ①소송과 배상청구의 목록, ②가능한 경우 각 소송과 배상청구의 결과에 대한 경영진의 평가, ③가능한 경우 관련 비용 등 재무적 영향에 대한 경영진의 추정치, ④경영진의 평가가 타당한지 외부 법률고문이 확인해 주고 소송과 배상청구 목록이 불완전하거나 부정확하다고 판단되면 추가적인 정보를 감사인에게 제공해 줄 것을 요청하는 내용이다."}, "t322": {"kw": ["유의적 위험이 있는 사항이라고 결정한 경우", "사항이 복잡한 경우", "경영진과 외부법률고문 간에 의견의 불일치가 있는 경우"], "ans": "외부법률고문과 직접 만날 필요가 있는 경우는 외부법률고문과 직접적인 커뮤니케이션이 금지되었거나 다음과 같은 경우로서, ①유의적 위험이 있는 사항이라고 결정한 경우, ②사항이 복잡한 경우, ③경영진과 외부법률고문 간에 의견의 불일치가 있는 경우이다. 감사인에게는 비밀유지의무가 있으므로 경영진의 동의를 받아 경영진측 대리인이 참석하여야 한다."}, "t323": {"kw": ["관련 사항을 다룰 책임이 있는 경영진(사내 법률고문)에게 질문하여 입수", "외부법률고문으로부터 갱신된 정보를 입수"], "ans": "조회기준일(질의서 회신일)과 감사보고서일까지 소송진행상황에 대한 감사증거는 ①관련 사항을 다룰 책임이 있는 경영진(사내 법률고문)에게 질문하여 입수하고, ②외부법률고문으로부터 갱신된 정보를 입수하는 것이다."}, "t324": {"kw": ["실제의 또는 발생가능한 소송과 배상청구를 감사인에게 모두 공개하였다", "소송과 배상청구를 해당 재무보고체계에 따라 회계처리하고 공시하였다"], "ans": "소송과 배상청구와 관련하여 경영진으로부터 수령하여야 할 서면진술은 ①실제의 또는 발생가능한 소송과 배상청구를 감사인에게 모두 공개하였다는 것과 ②소송과 배상청구를 해당 재무보고체계에 따라 회계처리하고 공시하였다는 것이다."}, "t325": {"kw": ["[고유한계 증가 이유] 특히 해당 재무보고체계에서 특수관계자에 관한 요구사항이 없는 경우 경영진이 특수관계 및 특수관계자 거래를 모두 알지 못할 수 있음(오류), 특수관계는 경영진에 의한 공모·은폐·조작의 기회를 더 많이 제공할 수 있음(부정)"], "ans": "특수관계자 거래가 감사의 고유한계를 증가시키는 이유는 ①특히 해당 재무보고체계에서 특수관계자에 관한 요구사항이 없는 경우 경영진이 특수관계 및 특수관계자 거래를 모두 알지 못할 수 있고(오류), ②특수관계는 경영진에 의한 공모·은폐·조작의 기회를 더 많이 제공할 수 있기(부정) 때문이다."}, "t326": {"kw": ["특수관계자들은 그 성격상 광범위한 복잡한 관계 및 구조를 통해 사업을 수행하고 이에 따라 특수관계자 거래의 복잡성이 증가하는 경우", "정보시스템이 해당 기업과 그 특수관계자들간의 거래와 잔액을 식별하거나 요약하는 데 효과적이지 않을 경우", "특수관계자 거래가 정상적인 시장의 계약조건 하에서 수행되지 않을 경우(특수관계자 거래가 대가의 교환 없이 수행될 경우)"], "ans": "특수관계자 거래가 중요왜곡표시위험이 높은 경우는 ①특수관계자들은 그 성격상 광범위한 복잡한 관계 및 구조를 통해 사업을 수행하고 이에 따라 특수관계자 거래의 복잡성이 증가하는 경우, ②정보시스템이 해당 기업과 그 특수관계자들간의 거래와 잔액을 식별하거나 요약하는 데 효과적이지 않을 경우, ③특수관계자 거래가 정상적인 시장의 계약조건 하에서 수행되지 않을 경우(특수관계자 거래가 대가의 교환 없이 수행될 경우)이다."}, "t327": {"kw": ["특수관계자들의 신원", "기업과 특수관계자들간 관계의 성격", "기업이 해당 기간 중에 특수관계자와 거래를 체결했는지 여부, 만약 그렇다면 그러한 거래의 형태와 목적"], "ans": "특수관계자 거래에 대해서 이해할 사항은 ①특수관계자들의 신원, ②기업과 특수관계자들간 관계의 성격, ③기업이 해당 기간 중에 특수관계자와 거래를 체결했는지 여부 및 만약 그렇다면 그러한 거래의 형태와 목적이다."}, "t328": {"kw": ["감사절차의 일부로서 입수한 은행의 확인서(은행조회서)나 법률문제에 관한 확인서(은행조회서 및 변호사조회서)", "주주총회의사록과 지배기구(회의)의사록", "해당 기업의 상황에서 감사인이 필요하다고 생각하는 기타의 기록이나 문서(주주명부 등)"], "ans": "특수관계자 거래를 식별하기 위하여 검사하여야 하는 사항들은 ①감사절차의 일부로서 입수한 은행의 확인서(은행조회서)나 법률문제에 관한 확인서(은행조회서 및 변호사조회서), ②주주총회의사록과 지배기구(회의)의사록, ③해당 기업의 상황에서 감사인이 필요하다고 생각하는 기타의 기록이나 문서(주주명부 등)이다."}, "t329": {"kw": ["업무팀의 다른 구성원에게 관련 정보를 신속하게 커뮤니케이션함", "해당 재무보고체계에서 특수관계자에 관한 요구사항을 정하고 있는 경우 경영진에게 새로 식별된 특수관계자와의 모든 거래를 식별할 것을 요청하고, 기업의 통제가 실패한 이유를 질문함", "새로 식별된 특수관계자 또는 이들과의 유의적 거래에 대하여 적합한 실증감사절차를 수행함", "경영진이 이전에 식별하지 못했거나 감사인에게 공개하지 않았던 다른 특수관계자 및 이들과의 유의적 거래가 존재할 위험을 재고려하고 필요에 따라 추가적인 감사절차를 수행함", "만약 경영진의 미공개가 고의적인 경우에는 해당 감사에 대한 시사점을 평가함"], "ans": "새로운 특수관계자나 그 거래를 식별한 경우 수행절차는 ①업무팀의 다른 구성원에게 관련 정보를 신속하게 커뮤니케이션하고, ②해당 재무보고체계에서 특수관계자에 관한 요구사항을 정하고 있는 경우 경영진에게 새로 식별된 특수관계자와의 모든 거래를 식별할 것을 요청하고 특수관계 및 특수관계자 거래에 대한 기업의 통제가 해당 특수관계나 특수관계자 거래를 식별하거나 공개하는 데 실패한 이유를 질문하며, ③새로 식별된 특수관계자 또는 이들과의 유의적 거래에 대하여 적합한 실증감사절차를 수행하고, ④경영진이 이전에 식별하지 못했거나 감사인에게 공개하지 않았던 다른 특수관계자 및 이들과의 유의적 거래가 존재할 위험을 재고려하고 필요에 따라 추가적인 감사절차를 수행하며, ⑤만약 경영진의 미공개가 고의적인 경우에는(따라서 부정으로 인한 중요왜곡표시위험을 나타낸다면) 해당 감사에 대한 시사점을 평가하는 것이다."}, "t330": {"kw": ["근거 계약이나 약정이 존재한다면 이를 검사하여 다음 사항을 평가함: 해당 거래의 사업상 이유에 비추어 볼 때 그러한 거래가 부정한 재무보고를 행하거나 자산의 횡령을 은폐하기 위해 체결되었을 것임을 나타내는지 여부, 해당 거래의 조건이 경영진의 설명과 일관성이 있는지 여부, 해당 거래가 해당 재무보고체계에 따라 적합하게 회계처리되고 공시되었는지 여부", "해당 거래가 적합하게 권한이 부여되고 승인되었다는 감사증거를 입수함"], "ans": "정상적인 사업과정을 벗어난 유의적인 특수관계자 거래를 식별한 경우 수행절차는 유의적 위험으로 취급하고 다음을 수행하는 것이다. ①근거 계약이나 약정이 존재한다면 이를 검사하여 ㉠해당 거래의 사업상 이유에 비추어 볼 때 그러한 거래가 부정한 재무보고를 행하거나 자산의 횡령을 은폐하기 위해 체결되었을 것임을 나타내는지 여부, ㉡해당 거래의 조건이 경영진의 설명과 일관성이 있는지 여부, ㉢해당 거래가 해당 재무보고체계에 따라 적합하게 회계처리되고 공시되었는지 여부를 평가하고, ②해당 거래가 적합하게 권한이 부여되고 승인되었다는 감사증거를 입수한다."}, "t331": {"kw": ["경영진(적절한 경우 지배기구 포함)은 그들이 알고 있는 기업의 특수관계자들의 신원과 모든 특수관계 및 특수관계자 거래의 내용을 감사인에게 모두 공개하였음(질문사항)", "경영진(적절한 경우 지배기구 포함)은 이러한 관계 및 거래들을 해당 재무보고체계에 따라 적합하게 회계처리하고 공시하였음"], "ans": "특수관계자 거래와 관련하여 경영진으로부터 수령할 서면진술은 ①경영진(적절한 경우 지배기구 포함)은 그들이 알고 있는 기업의 특수관계자들의 신원과 모든 특수관계 및 특수관계자 거래의 내용을 감사인에게 모두 공개하였다는 것, ②경영진(적절한 경우 지배기구 포함)은 이러한 관계 및 거래들을 해당 재무보고체계에 따라 적합하게 회계처리하고 공시하였다는 것이다."}, "t332": {"kw": ["전형적으로 재무제표에 영향을 미치지 않고 기업의 재무보고와 관련된 정보시스템에 의해 포착되지 않는 주로 기업의 영업활동 측면과 관련된 법규가 다수 존재함", "법규위반은 공모·위조·거래의 고의적인 기재누락·경영진의 통제무력화 또는 감사인에 대한 의도적인 허위진술 등을 은폐하기 위한 목적으로 설계된 행위들과 관련된 것일 수 있음", "특정 행위가 위반에 해당되는지 여부는 궁극적으로 법원이 결정할 사항임"], "ans": "감사대상회사의 법규위반을 발견하는데 고유한계의 잠재적 영향이 큰 이유는 ①전형적으로 재무제표에 영향을 미치지 않고 기업의 재무보고와 관련된 정보시스템에 의해 포착되지 않는 주로 기업의 영업활동 측면과 관련된 법규가 다수 존재하고, ②법규위반은 공모·위조·거래의 고의적인 기재누락·경영진의 통제무력화 또는 감사인에 대한 의도적인 허위진술 등을 은폐하기 위한 목적으로 설계된 행위들과 관련된 것일 수 있으며, ③특정 행위가 위반에 해당되는지 여부는 궁극적으로 법원이 결정할 사항이기 때문이다."}, "t333": {"kw": ["재무제표에 직접적인 영향을 미치는 법규", "감사인은 법규의 준수에 대하여 충분하고 적합한 감사증거를 입수하여야 함", "세법·근로기준법 등"], "ans": "유형 1의 법규는 재무제표에 직접적인 영향을 미치는 법규로서, 감사인은 법규의 준수에 대하여 충분하고 적합한 감사증거를 입수하여야 한다. 예시로 세법·근로기준법 등이 있다."}, "t334": {"kw": ["재무제표 금액과 공시의 결정에 직접적인 영향을 미치지는 않지만 해당 법규의 준수가 사업의 일상적인 운영 면이나 사업을 계속할 수 있는 능력 또는 중요한 처벌을 면할 수 있는 능력에 대한 근본이 되는 기타 법규", "기업이 이와 같은 법규를 준수하고 있는지 여부에 대하여 경영진에게 질의하고, 관련 인허가기관이나 규제기관과의 왕복문서가 있는 경우 이를 검사함", "은행업법·여객자동차법 등"], "ans": "유형 2의 법규는 재무제표 금액과 공시의 결정에 직접적인 영향을 미치지는 않지만 해당 법규의 준수가 사업의 일상적인 운영 면이나 사업을 계속할 수 있는 능력 또는 중요한 처벌을 면할 수 있는 능력에 대한 근본이 되는 기타 법규이다. 감사인은 재무제표에 중요한 영향을 미칠 수 있는 법규의 위반을 식별하는 데 도움을 주는 특정의 감사절차만 수행하는데, ①기업이 이와 같은 법규를 준수하고 있는지 여부에 대하여 경영진에게 질의하고, ②관련 인허가기관이나 규제기관과의 왕복문서가 있는 경우 이를 검사한다. 예시로 은행업법·여객자동차법 등이 있다."}, "t335": {"kw": ["행위의 성격 및 그 행위가 발생한 상황을 이해함", "재무제표에 미칠 수 있는 영향을 평가하기 위한 추가적인 정보를 입수함", "경영진(적합한 경우 지배기구를 포함)과 그 사항에 대하여 논의함"], "ans": "법규위반 또는 의심되는 위반사례에 대해서 정보를 알게 된 경우 수행절차는 ①행위의 성격 및 그 행위가 발생한 상황을 이해하고, ②재무제표에 미칠 수 있는 영향을 평가하기 위한 추가적인 정보를 입수하며, ③경영진(적합한 경우 지배기구를 포함)과 그 사항에 대하여 논의하는 것이다."}, "t336": {"kw": ["재무제표를 작성할 때 그 영향을 고려해야 하는 법규위반 또는 위반으로 의심되는 사항으로서", "알고 있는 모든 사실들을 감사인에게 공개하였음"], "ans": "법규준수와 관련하여 경영진으로부터 수령하여야 할 서면진술은, 재무제표를 작성할 때 그 영향을 고려해야 하는 법규위반 또는 위반으로 의심되는 사항으로서 알고 있는 모든 사실들을 감사인에게 공개하였다는 것이다."}, "t337": {"kw": ["경영진이 부문정보의 결정에 사용한 방법을 이해함(그러한 방법에 의해 결과적으로 해당 재무보고체계에 따른 공시가 이루어질 수 있는지 여부를 평가하고, 적절한 경우 해당 방법의 적용에 대하여 테스트함)", "분석적절차 또는 해당 상황에 적합한 기타의 감사절차를 수행함"], "ans": "부문정보의 공시에 대한 감사절차는 ①경영진이 부문정보의 결정에 사용한 방법을 이해하는 것으로서 ㉠그러한 방법에 의해 결과적으로 해당 재무보고체계에 따른 공시가 이루어질 수 있는지 여부를 평가하고 ㉡적절한 경우 해당 방법의 적용에 대하여 테스트하며, ②분석적절차 또는 해당 상황에 적합한 기타의 감사절차를 수행하는 것이다."}, "t338": {"kw": ["모집단이 금액이 큰 소수의 항목으로 구성되어 있을 때", "유의적 위험이 존재하며 다른 방법으로는 충분하고 적합한 감사증거를 제공하지 못할 때", "정보시스템에 의해 자동적으로 수행되는 계산이나 기타 처리(그 반복적 특성으로 인하여 전수조사가 비용 측면에서 효과적임)"], "ans": "전수조사가 적합한 상황은 ①모집단이 금액이 큰 소수의 항목으로 구성되어 있을 때, ②유의적 위험이 존재하며 다른 방법으로는 충분하고 적합한 감사증거를 제공하지 못할 때, ③정보시스템에 의해 자동적으로 수행되는 계산이나 기타 처리(그 반복적 특성으로 인하여 전수조사가 비용 측면에서 효과적임)이다."}, "t339": {"kw": ["금액이 크거나 주요한 항목: 금액이 큰 항목 또는 의심스럽고 비경상적이며 특별히 위험성이 있거나 과거에 오류가 발생되었던 항목", "일정금액 이상의 모든 항목: 전체금액에서 많은 부분을 검증하기 위하여 일정 금액을 초과하는 항목", "정보를 입수하기 위한 항목: 기업의 성격이나 거래의 성격과 같이 어떤 사항에 대한 정보를 입수하기 위한 관련 항목"], "ans": "특정항목 추출의 예는 ①금액이 크거나 주요한 항목(금액이 큰 항목 또는 의심스럽고 비경상적이며 특별히 위험성이 있거나 과거에 오류가 발생되었던 항목), ②일정금액 이상의 모든 항목(거래유형이나 계정잔액의 전체금액에서 많은 부분을 검증하기 위하여 일정 금액을 초과하는 항목), ③정보를 입수하기 위한 항목(기업의 성격이나 거래의 성격과 같이 어떤 사항에 대한 정보를 입수하기 위한 관련 항목)이다. 특정항목의 추출은 그 항목이 모집단을 대표하는지에 대하여 고려하지 않으므로 비표본위험을 낮춘다."}, "t340": {"kw": ["추출방법: 표본항목을 무작위로 추출함", "결과평가: 표본위험의 측정 등 표본결과의 평가에 확률이론을 적용함"], "ans": "통계적 표본감사와 비통계적 표본감사를 구분하는 기준은 ①추출방법(표본항목을 무작위로 추출함)과 ②결과평가(표본위험의 측정 등 표본결과의 평가에 확률이론을 적용함)이다. 통계적 표본감사는 이 두 특성을 모두 갖는 접근법이고, 비통계적 표본감사는 이 두 특성을 하나라도 갖추지 않은 접근법이다."}, "t341": {"kw": ["감사인은 모집단의 표본단위에 내재된 특정한 유형이 표본추출간격과 상응하는 방식으로 구성되어 있지는 않다는 것을 결정해야 함"], "ans": "체계적추출법을 사용할 수 있는 경우는, 감사인이 모집단의 표본단위에 내재된 특정한 유형이 표본추출간격과 상응하는 방식으로 구성되어 있지는 않다는 것을 결정한 경우이다."}, "t342": {"kw": ["모집단을 구성하고 있는 거래처별 계정잔액의 특성이 포아송분포의 특성과 유사함", "포아송분포는 모수가 하나이므로 적용하기가 쉬움"], "ans": "속성표본감사와 금액비례확률표본감사에서 포아송분포를 가정하는 이유는 ①모집단을 구성하고 있는 거래처별 계정잔액의 특성이 포아송분포의 특성과 유사하고, ②포아송분포는 모수가 하나이므로 적용하기가 쉽기 때문이다."}, "t343": {"kw": ["[장점] 표본추출방법이 객관적임, 표본결과의 평가가 객관적임, 표본추출방법과 결과의 평가가 객관적이므로 법률적인 문제가 발생할 경우 유리함", "[단점] 표본감사의 결과평가 등 감사인의 주관적 판단을 완전히 배제할 수 없으므로 표본위험을 완전히 제거할 수 없음, 시간과 비용이 많이 투입됨"], "ans": "통계적 표본감사의 장점은 ①표본추출방법이 객관적이고, ②표본결과의 평가가 객관적이며, ③표본추출방법과 결과의 평가가 객관적이므로 법률적인 문제가 발생할 경우 유리하다는 것이다. 단점은 ①표본감사의 결과평가 등 감사인의 주관적 판단을 완전히 배제할 수 없으므로 표본위험을 완전히 제거할 수 없고, ②시간과 비용이 많이 투입된다는 것이다."}, "t344": {"kw": ["[장점] 숙련된 감사인에게 효과적임, 시간과 비용이 적게 투입됨", "[단점] 표본추출방법이 주관적임, 표본결과의 평가가 주관적임, 표본추출방법과 결과의 평가가 주관적이므로 법률적인 문제가 발생할 경우 불리함"], "ans": "비통계적 표본감사의 장점은 ①숙련된 감사인에게 효과적이고, ②시간과 비용이 적게 투입된다는 것이다. 단점은 ①표본추출방법이 주관적이고, ②표본결과의 평가가 주관적이며, ③표본추출방법과 결과의 평가가 주관적이므로 법률적인 문제가 발생할 경우 불리하다는 것이다."}, "t345": {"kw": ["[알파위험(제1종 오류)] 통제테스트에서는 과소신뢰위험(통제가 실제보다 덜 효과적이라고 평가), 세부테스트에서는 부당거부위험(중요왜곡표시가 없음에도 있다고 결론), 감사의 효율성에 영향, 고려되는 통계적 표본감사는 전통적 변량표본감사", "[베타위험(제2종 오류)] 통제테스트에서는 과대신뢰위험(통제가 실제보다 더 효과적이라고 평가), 세부테스트에서는 부당수용위험(중요왜곡표시가 있음에도 없다고 결론), 감사의 효과성에 영향, 감사인이 가장 경계해야 할 표본위험, 고려되는 통계적 표본감사는 속성·금액비례확률·전통적 변량표본감사"], "ans": "표본위험의 2가지 유형은 다음과 같다. ①제1종 오류(알파위험, 맞는 것을 틀리다고 할 위험)는 통제테스트에서 과소신뢰위험(통제가 실제보다 덜 효과적이라고 평가), 세부테스트에서 부당거부위험(실제로 중요한 왜곡표시가 존재하지 않음에도 존재한다고 결론)이며, 최초의 결론이 부정확한지 확인하기 위한 추가업무로 이어지므로 감사의 효율성에 영향을 미친다. ②제2종 오류(베타위험, 틀린 것을 맞다고 할 위험)는 통제테스트에서 과대신뢰위험(통제가 실제보다 더 효과적이라고 평가), 세부테스트에서 부당수용위험(중요한 왜곡표시가 존재함에도 존재하지 않는다고 결론)이며, 감사의 효과성에 영향을 미치고 부적합한 감사의견에 이르게 할 수 있어 감사인이 가장 경계(통제)해야 할 표본위험이다."}, "t346": {"kw": ["부적합한 감사절차의 적용(설득적)", "감사증거를 잘못 해석", "왜곡표시 또는 이탈을 인식하지 못함", "감사증거가 결론적이라기보다 설득적임"], "ans": "비표본위험이 발생하는 이유는 ①감사증거가 결론적이라기보다 설득적임(감사의 고유한계 관련), ②부적합한 감사절차의 적용, ③감사증거를 잘못 해석, ④왜곡표시 또는 이탈을 인식하지 못함(잘못된 감사절차 관련)이다."}, "t347": {"kw": ["전문가적 의구심의 유지", "적절한 감사절차의 선택", "감사보조자에 대한 적절한 감독", "감사업무에 대한 품질관리정책의 수립과 실시", "품질관리제도에 대한 자체모니터링"], "ans": "비표본위험의 감소 방안은 ①전문가적 의구심의 유지, ②적절한 감사절차의 선택, ③감사보조자에 대한 적절한 감독, ④감사업무에 대한 품질관리정책의 수립과 실시, ⑤품질관리제도에 대한 자체모니터링이다."}, "t348": {"kw": ["[통제테스트] 허용이탈율(증가시 감소), 예상이탈율(증가시 증가), 확신의 수준(증가시 증가), 모집단의 표본단위 수(영향없음), 위험평가시 통제 운영효과성 테스트 계획 고려정도(증가시 증가)", "[세부테스트] 허용왜곡표시(증가시 감소), 예상왜곡표시(증가시 증가), 확신의 수준(증가시 증가), 모집단의 표본단위 수(영향없음), 중요왜곡표시위험(증가시 증가), 대체적 절차(증가시 감소), 모집단의 계층화(증가시 감소)"], "ans": "표본규모에 영향을 미치는 요소는 다음과 같다. 통제테스트에서는 ①허용이탈율(증가시 표본규모 감소), ②예상이탈율(증가시 증가), ③확신의 수준(증가시 증가), ④모집단의 표본단위 수(영향 없음), ⑤위험평가시 통제의 운영효과성 테스트 계획의 고려정도(증가시 증가)이다. 세부테스트에서는 ①허용왜곡표시(증가시 감소), ②예상왜곡표시(증가시 증가), ③확신의 수준(증가시 증가), ④모집단의 표본단위 수(영향 없음), ⑤중요왜곡표시위험(증가시 증가), ⑥대체적 절차(증가시 감소), ⑦모집단의 계층화(증가시 감소)이다."}, "t349": {"kw": ["잔액이 더 큰 항목의 추출기회를 높임으로써 이들 항목에 감사가 집중되도록 하고", "표본규모를 줄일 수 있음"], "ans": "금액단위추출법의 장점은 잔액이 더 큰 항목의 추출기회를 높임으로써 이들 항목에 감사가 집중되도록 하고, 표본규모를 줄일 수 있다는 것이다."}, "t350": {"kw": ["각 계층 내 항목들의 변동성을 감소시키는 것이며", "그 결과 표본위험을 증가시키지 않고 표본규모를 감소시킬 수 있음", "따라서 표본규모가 감소되어 감사의 효율성을 향상시킴"], "ans": "계층화의 이유(목적·장점)는 각 계층 내 항목들의 변동성을 감소시키는 것이며, 그 결과 표본위험을 증가시키지 않고 표본규모를 감소시킬 수 있다. 따라서 표본규모가 감소되어 감사의 효율성을 향상시킨다."}, "t351": {"kw": ["대부분의 모집단은 연속된 항목들이 서로 유사한 특성을 가지며", "모집단의 다른 부분에 있는 항목들은 다른 특징을 가지도록 구성되어 있기 때문(대표성 결여)"], "ans": "구획추출이 일반적으로 표본감사에서 사용될 수 없는 이유는, 대부분의 모집단은 연속된 항목들이 서로 유사한 특성을 가지며 모집단의 다른 부분에 있는 항목들은 다른 특징을 가지도록 구성되어 있어 모집단의 대표성이 결여되기 때문이다."}, "t352": {"kw": ["매출채권·대여금 계정과 같이 금액단위가 큰 개별항목을 반드시 표본으로 추출하고자 할 때", "과대계상의 왜곡표시에 더욱 민감한 사항을 감사하고자 할 때", "왜곡표시가 거의 없을 것으로 예상되는 계정잔액을 테스트하고자 할 때", "확률분포나 표준편차와 같은 모집단의 특성을 파악하기 어려울 때"], "ans": "금액비례확률표본감사가 보다 효과적인 상황은 ①매출채권·대여금 계정과 같이 금액단위가 큰 개별항목을 반드시 표본으로 추출하고자 할 때, ②과대계상의 왜곡표시에 더욱 민감한 사항을 감사하고자 할 때, ③왜곡표시가 거의 없을 것으로 예상되는 계정잔액을 테스트하고자 할 때, ④확률분포나 표준편차와 같은 모집단의 특성을 파악하기 어려울 때이다."}, "t353": {"kw": ["경영진에게 식별된 왜곡표시 및 잠재적인 추가왜곡표시에 대하여 조사를 수행하고 필요한 수정을 하도록 요구함", "요구되는 확신을 가장 잘 달성할 수 있도록 추가감사절차의 성격·시기 및 범위를 조정함"], "ans": "표본감사결과가 모집단의 결론에 대한 합리적 근거를 제공하지 못할 경우 다음 중 하나의 절차를 수행한다. ①경영진에게 식별된 왜곡표시 및 잠재적인 추가왜곡표시에 대하여 조사를 수행하고 필요한 수정을 하도록 요구하거나, ②요구되는 확신을 가장 잘 달성할 수 있도록 추가감사절차의 성격·시기 및 범위를 조정한다."}, "t354": {"kw": ["전체재무제표를 구성하는 모든 내용의 작성이 완료되고", "인정된 권한을 가진 기구(이사회 등)가 해당재무제표에 대해서 책임을 진다고 확인한 날", "일반적으로 이사회 승인일을 의미"], "ans": "재무제표 (발행)승인일이란 전체재무제표를 구성하는 모든 내용의 작성이 완료되고, 인정된 권한을 가진 기구(이사회 등)가 해당재무제표에 대해서 책임을 진다고 확인한 날로서, 일반적으로 이사회 승인일을 의미한다."}, "t355": {"kw": ["감사인이 재무제표에 대한 감사보고서에 기재한 일자로서", "감사보고서일까지 발생되었고 감사인이 알게 된 사건과 거래의 영향을 감사인이 고려하였음을 감사보고서의 이용자들에게 알리는 것"], "ans": "감사보고서일이란 감사인이 재무제표에 대한 감사보고서에 기재한 일자로서, 감사보고서일까지 발생되었고 감사인이 알게 된 사건과 거래의 영향을 감사인이 고려하였음을 감사보고서의 이용자들에게 알리는 것이다."}, "t356": {"kw": ["감사보고서와 감사받은 재무제표를 제3자들이 이용할 수 있게 된 날", "일반적으로 정기주주총회일을 의미"], "ans": "재무제표 발행일이란 감사보고서와 감사받은 재무제표를 제3자들이 이용할 수 있게 된 날로서, 일반적으로 정기주주총회일을 의미한다."}, "t357": {"kw": ["감사보고서일은 감사인이 재무제표에 대한 의견의 기초가 되는 충분하고 적합한 감사증거를 입수하는 날보다 더 빠른 일자가 될 수 없음(감사보고서일=감사증거수집완료일)", "재무제표를 구성하는 모든 내용이 작성되었고 인정된 권한을 가진 기구가 해당 재무제표에 대한 책임을 진다고 확인하였다는 증거가 포함되므로 감사보고서일은 재무제표 (발행)승인일보다 빠를 수 없음"], "ans": "감사보고서일은 감사인이 재무제표에 대한 의견의 기초가 되는 충분하고 적합한 감사증거를 입수하는 날보다 더 빠른 일자가 될 수 없다(감사보고서일=감사증거수집완료일). 해당 감사증거에는 재무제표를 구성하는 모든 내용이 작성되었고 인정된 권한을 가진 기구가 해당 재무제표에 대한 책임을 진다고 확인하였다는 증거가 포함되므로, 감사보고서일은 재무제표 (발행)승인일보다 빠를 수 없다."}, "t358": {"kw": ["경영진이 후속사건을 식별하기 위해 수립한 절차들을 이해함", "재무제표에 영향을 미칠 수 있는 후속사건이 발생했는지 여부에 대하여 경영진에게 질문함", "재무제표일 후에 개최된 주주·경영진 그리고 지배기구 회의록이 있을 경우 이를 열람하고, 회의록이 아직 이용가능하지 않는 경우에는 해당 회의에서 논의된 사항들에 대하여 질문함", "기업의 최근 후속 중간재무제표가 있다면 이를 열람함"], "ans": "감사보고서일까지 발생한 후속사건의 식별절차는 ①경영진이 후속사건을 식별하기 위해 수립한 절차들을 이해하고, ②재무제표에 영향을 미칠 수 있는 후속사건이 발생했는지 여부에 대하여 경영진에게 질문하며, ③재무제표일 후에 개최된 주주·경영진 그리고 지배기구 회의록이 있을 경우 이를 열람하고 회의록이 아직 이용가능하지 않는 경우에는 해당 회의에서 논의된 사항들에 대하여 질문하고, ④기업의 최근 후속 중간재무제표가 있다면 이를 열람하는 것이다."}, "t359": {"kw": ["경영진(적절한 경우 지배기구 포함)과 이 사항을 토의함", "재무제표의 수정이 필요한지 여부를 결정함", "재무제표의 수정이 필요하다고 결정했다면 경영진이 재무제표에서 이 사항을 어떻게 다룰 계획인지 질문함"], "ans": "감사보고서일 이후에 알게 된 경우 기본수행절차는 ①경영진(적절한 경우 지배기구 포함)과 이 사항을 토의하고, ②재무제표의 수정이 필요한지 여부를 결정하며, ③재무제표의 수정이 필요하다고 결정했다면 경영진이 재무제표에서 이 사항을 어떻게 다룰 계획인지 질문하는 것이다."}, "t360": {"kw": ["[방법1: 이중감사보고서일] 해당 수정사항에 한정된 추가적인 일자를 포함하도록 감사보고서를 수정함", "[방법2: 추가설명문단 기재] 후속사건에 대한 감사절차는 오직 재무제표의 관련 주석에 기술된 수정에만 한정하여 수행되었다는 설명을 강조사항문단 또는 기타사항문단에 포함하는 새로운 감사보고서 또는 수정된 감사보고서를 제출함"], "ans": "해당 수정사항에만 한정하여 추가감사절차를 수행한 경우 감사보고서일 기재방법은 ①이중감사보고서일 방법(해당 수정사항에 한정된 추가적인 일자를 포함하도록 감사보고서를 수정함), ②추가설명문단 기재 방법(후속사건에 대한 감사절차는 오직 재무제표의 관련 주석에 기술된 수정에만 한정하여 수행되었다는 설명을 강조사항문단 또는 기타사항문단에 포함하는 새로운 감사보고서 또는 수정된 감사보고서를 제출함)이다."}, "t361": {"kw": ["재무제표의 수정을 발생시키는 후속사건의 영향에 대해서만 경영진이 재무제표를 수정하고", "재무제표 승인권자가 이에 대해서만 승인하는 것이", "법규나 재무보고체계에서 금지되지 않는다면"], "ans": "해당 수정사항에만 한정하여 추가감사절차를 수행하는 것이 허용되는 경우는, 재무제표의 수정을 발생시키는 후속사건의 영향에 대해서만 경영진이 재무제표를 수정하고 재무제표 승인권자가 이에 대해서만 승인하는 것이 법규나 재무보고체계에서 금지되지 않는 경우이다."}, "t362": {"kw": ["감사인이 이전에 발행한 감사보고서 언급", "이전에 발행한 재무제표의 수정이유를 더 넓게 논의한 재무제표 주석 언급"], "ans": "재무제표 발행일 이후 감사보고서가 재발행되는 경우 강조(기타)사항문단에 포함할 사항은 ①감사인이 이전에 발행한 감사보고서 언급, ②이전에 발행한 재무제표의 수정이유를 더 넓게 논의한 재무제표 주석 언급이다."}, "t363": {"kw": ["감사의견을 변형함", "[감사보고서 제출 후~재무제표 발행일 전] 경영진에게 필요한 수정을 하기 전에는 재무제표를 제3자에게 발행하지 말라고 통보하고, 그럼에도 불구하고 필요한 수정 없이 재무제표가 발행된 경우 감사인은 해당 감사보고서에 대한 의존을 못하게 하기 위한 적합한 조치를 취함", "[재무제표 발행일 이후] 경영진에게 감사보고서에 대한 차후의 의존을 방지할 조치를 취할 것이라고 통보하고, 그럼에도 경영진 또는 지배기구가 필요한 조치를 취하지 않으면 감사인은 해당 감사보고서에 대한 의존을 방지하기 위한 적합한 조치를 취함"], "ans": "경영진이 필요한 수정을 하지 않는 경우 시기별 감사인의 대응절차는 다음과 같다. 감사보고서일부터 감사보고서 제출 전에는 감사의견을 변형한다. 감사보고서 제출 후부터 재무제표 발행일 전에는 ①경영진에게 필요한 수정을 하기 전에는 재무제표를 제3자에게 발행하지 말라고 통보하고, ②이렇게 했음에도 불구하고 필요한 수정 없이 재무제표가 발행된 경우 감사인은 해당 감사보고서에 대한 의존을 못하게 하기 위한 적합한 조치를 취한다. 재무제표 발행일 이후에는 ①경영진에게 감사보고서에 대한 차후의 의존을 방지할 조치를 취할 것이라고 통보하고, ②그러한 통보에도 불구하고 경영진 또는 지배기구가 필요한 조치를 취하지 않으면 감사인은 해당 감사보고서에 대한 의존을 방지하기 위한 적합한 조치를 취한다."}, "t364": {"kw": ["재무제표의 작성에 있어 경영진의 회계의 계속기업전제 사용의 적합성에 대하여 충분하고 적합한 감사증거를 입수하고 결론을 내림", "입수된 감사증거에 기초하여 계속기업으로서의 존속능력에 대한 중요한 불확실성이 존재하는지 여부에 대하여 결론을 내림(주석공시 사항)"], "ans": "계속기업전제에 대한 감사인의 책임은 ①재무제표의 작성에 있어 경영진의 회계의 계속기업전제 사용의 적합성에 대하여 충분하고 적합한 감사증거를 입수하고 결론을 내리는 것과, ②입수된 감사증거에 기초하여 계속기업으로서의 존속능력에 대한 중요한 불확실성이 존재하는지 여부에 대하여 결론을 내리는 것(주석공시 사항)이다."}, "t365": {"kw": ["경영진과 그 평가에 대하여 토의하여야 함", "경영진이 개별적으로 또는 집합적으로 계속기업으로서의 존속능력에 유의적 의문을 제기할 수 있는 사건이나 상황을 식별하였는지 여부를 확인하여야 함", "식별된 경우에는 이에 대한 경영진의 계획을 확인하여야 함"], "ans": "경영진이 예비평가를 수행한 경우 위험평가절차는 ①경영진과 그 평가에 대하여 토의하여야 하며, ②경영진이 개별적으로 또는 집합적으로 계속기업으로서의 존속능력에 유의적 의문을 제기할 수 있는 사건이나 상황을 식별하였는지 여부를 확인하여야 하고, ③식별된 경우에는 이에 대한 경영진의 계획을 확인하여야 하는 것이다."}, "t366": {"kw": ["경영진이 계획하는 회계의 계속기업전제 사용의 근거에 대하여 감사인은 경영진과 토의해야 함", "개별적으로 또는 집합적으로 계속기업으로서의 존속능력에 유의적 의문을 제기할 수 있는 사건이나 상황이 존재하는지 여부를 질문하여야 함"], "ans": "경영진이 예비평가를 수행하지 않은 경우 위험평가절차는 ①경영진이 계획하는 회계의 계속기업전제 사용의 근거에 대하여 감사인은 경영진과 토의해야 하고, ②개별적으로 또는 집합적으로 계속기업으로서의 존속능력에 유의적 의문을 제기할 수 있는 사건이나 상황이 존재하는지 여부를 질문하여야 하는 것이다."}, "t367": {"kw": ["경영진이 그 평가를 위해 수행한 절차", "평가의 기초가 된 가정", "경영진의 향후 실행계획", "해당 상황에서 경영진 계획의 실행가능성 여부"], "ans": "경영진의 예비평가에 대해 감사인이 평가할 사항은 ①경영진이 그 평가를 위해 수행한 절차, ②평가의 기초가 된 가정, ③경영진의 향후 실행계획, ④해당 상황에서 경영진 계획의 실행가능성 여부이다. 경영진이 수행한 분석 부족을 바로잡는 것은 감사인의 책임이 아니다."}, "t368": {"kw": ["경영진이 계속기업으로서의 존속능력에 대한 평가를 아직 수행하지 않은 경우 평가를 수행하도록 요청함", "기업이 현금흐름을 예측하였고 이 예측에 대한 분석이 경영진의 미래 실행계획을 평가할 때 사건이나 상황의 미래결과를 고려하는 데 유의적인 요소인 경우 예측을 위해 생성된 기초 데이터의 신뢰성을 평가하고 예측의 기초가 되는 가정들에 대한 적절한 근거가 있는지 여부를 결정함", "경영진이 평가를 실시한 날 후에 추가적인 사실이나 정보가 이용가능하게 되었는지 여부를 고려함", "계속기업에 대한 경영진의 평가와 관련된 경영진의 향후 실행계획에 대하여 이러한 계획의 결과가 상황을 개선시킬지 여부 및 경영진의 계획이 해당 상황에서 실행가능한지 여부를 평가함", "경영진에게 향후 실행계획과 이러한 계획의 실행가능성에 대하여 서면진술을 요청함"], "ans": "계속기업으로서의 존속능력에 유의적 의문을 제기할 수 있는 사건이나 상황(계존유의사상)을 식별한 경우 감사절차는 ①경영진이 계속기업으로서의 존속능력에 대한 평가를 아직 수행하지 않은 경우 평가를 수행하도록 요청하고, ②기업이 현금흐름을 예측하였고 이 예측에 대한 분석이 경영진의 미래 실행계획을 평가할 때 사건이나 상황의 미래결과를 고려하는 데 유의적인 요소인 경우 예측을 위해 생성된 기초 데이터의 신뢰성을 평가하고 예측의 기초가 되는 가정들에 대한 적절한 근거가 있는지 여부를 결정하며, ③경영진이 평가를 실시한 날 후에 추가적인 사실이나 정보가 이용가능하게 되었는지 여부를 고려하고, ④계속기업에 대한 경영진의 평가와 관련된 경영진의 향후 실행계획에 대하여 이러한 계획의 결과가 상황을 개선시킬지 여부 및 경영진의 계획이 해당 상황에서 실행가능한지 여부를 평가하며, ⑤경영진에게 향후 실행계획과 이러한 계획의 실행가능성에 대하여 서면진술을 요청하는 것이다."}, "t369": {"kw": ["경영진에게 계존유의사상을 알고 있는지 질문하여야 함(질문의 책임 없음)"], "ans": "평가기간 이후의 기간에 대해 계속기업전제와 관련하여 수행할 절차는, 경영진에게 계속기업으로서의 존속능력에 유의적 의문을 제기할 수 있는 사건이나 상황(계존유의사상)을 알고 있는지 질문하는 것이다. 다만 감사인이 계존유의사상을 질문할 책임까지 있는 것은 아니다."}, "t370": {"kw": ["계속기업으로서의 존속능력에 대하여 유의적 의문을 초래할 수 있는 주요 사건이나 상황(계존유의사상) 및 이러한 사건이나 상황을 다루기 위한 경영진의 계획이 재무제표에 적절히 공시되어 있는지 여부", "계속기업으로서의 존속능력에 대하여 유의적 의문을 초래할 수 있는 사건이나 상황과 관련하여 중요한 불확실성이 존재하고 따라서 정상적인 사업과정에서 자산을 회수하고 부채를 상환하지 못할 수 있다는 사실이 재무제표에 명확히 공시되어 있는지 여부"], "ans": "계속기업으로서의 존속능력에 중요한 불확실성이 존재한다고 결론을 내리는 경우 결정할 사항은 ①계속기업으로서의 존속능력에 대하여 유의적 의문을 초래할 수 있는 주요 사건이나 상황(계존유의사상) 및 이러한 사건이나 상황을 다루기 위한 경영진의 계획이 재무제표에 적절히 공시되어 있는지 여부, ②계속기업으로서의 존속능력에 대하여 유의적 의문을 초래할 수 있는 사건이나 상황과 관련하여 중요한 불확실성이 존재하고 따라서 정상적인 사업과정에서 자산을 회수하고 부채를 상환하지 못할 수 있다는 사실이 재무제표에 명확히 공시되어 있는지 여부이다."}, "t371": {"kw": ["재무제표의 작성에 있어 경영진의 회계의 계속기업전제 사용이 적합한지 여부", "사건이나 상황이 중요한 불확실성을 구성하는지 여부", "재무제표의 관련 공시의 적절성", "해당되는 경우 감사보고서에 대한 시사점"], "ans": "계존유의사상과 관련하여 지배기구와 커뮤니케이션할 사항은 ①재무제표의 작성에 있어 경영진의 회계의 계속기업전제 사용이 적합한지 여부, ②사건이나 상황이 중요한 불확실성을 구성하는지 여부, ③재무제표의 관련 공시의 적절성, ④해당되는 경우 감사보고서에 대한 시사점이다."}, "t372": {"kw": ["계속기업으로서의 존속능력에 대하여 유의적 의문을 초래할 수 있는 주요 사건이나 상황 및 이러한 사건이나 상황을 다루기 위한 경영진의 계획", "계속기업으로서의 존속능력에 대하여 유의적 의문을 초래할 수 있는 사건이나 상황과 관련하여 중요한 불확실성이 존재하고 따라서 정상적인 사업과정에서 자산을 회수하고 부채를 상환하지 못할 수 있다는 사실"], "ans": "계속기업전제는 적합하지만 중요한 불확실성이 존재하는 경우 주석공시사항은 ①계속기업으로서의 존속능력에 대하여 유의적 의문을 초래할 수 있는 주요 사건이나 상황 및 이러한 사건이나 상황을 다루기 위한 경영진의 계획, ②계속기업으로서의 존속능력에 대하여 유의적 의문을 초래할 수 있는 사건이나 상황과 관련하여 중요한 불확실성이 존재하고 따라서 정상적인 사업과정에서 자산을 회수하고 부채를 상환하지 못할 수 있다는 사실이다."}, "t373": {"kw": ["계속기업으로서의 존속능력에 유의적 의문을 초래할 수 있는 사건이나 상황이 식별되었으나", "감사인이 입수된 감사증거를 근거로 감사인이 중요한 불확실성이 존재하지 않는다고 결론을 내리는 경우"], "ans": "Close call이란 계속기업으로서의 존속능력에 유의적 의문을 초래할 수 있는 사건이나 상황이 식별되었으나, 감사인이 입수된 감사증거를 근거로 중요한 불확실성이 존재하지 않는다고 결론을 내리는 경우를 말한다. 이 경우 감사인은 해당 재무보고체계의 요구사항에 비추어 재무제표에 이러한 사건이나 상황에 대한 적절한 공시가 이루어지는지 여부를 평가하여야 한다."}, "t374": {"kw": ["재무제표의 계속기업 관련 중요한 불확실성에 대한 주석에 주의를 기울이도록 함", "이러한 사건과 상황이 계속기업으로서의 존속능력에 유의적 의문을 초래할 수 있는 중요한 불확실성이 존재한다는 사실을 나타낸다는 점을 명시하고, 해당 사항과 관련하여 감사의견이 변형되지 않았음을 명시함"], "ans": "계속기업 관련 중요한 불확실성 단락에 포함되어야 하는 사항은 ①재무제표의 계속기업 관련 중요한 불확실성에 대한 주석에 주의를 기울이도록 하고, ②이러한 사건과 상황이 계속기업으로서의 존속능력에 유의적 의문을 초래할 수 있는 중요한 불확실성이 존재한다는 사실을 나타낸다는 점을 명시하고 해당 사항과 관련하여 감사의견이 변형되지 않았음을 명시하는 것이다."}, "t375": {"kw": ["재무제표의 작성책임: 감사업무 조건에서 정한 바와 같이 경영진이 해당 재무보고체계에 따라 재무제표를 작성할 책임을 완수하였음", "제공된 정보 및 거래의 완전성에 대한 책임: 경영진은 감사업무 조건에서 합의한 대로 모든 관련 정보를 감사인에게 제공하고 접근하게 하였으며, 모든 거래를 기록하고 재무제표에 반영하였음"], "ans": "서면진술에 포함되어야 하는 내용 중 경영진의 책임 관련 내용은 ①재무제표의 작성책임(감사업무 조건에서 정한 바와 같이 경영진이 해당 재무보고체계에 따라 재무제표를 작성할 책임을 완수하였음), ②제공된 정보 및 거래의 완전성에 대한 책임(㉠경영진은 감사업무 조건에서 합의한 대로 모든 관련 정보를 감사인에게 제공하고 접근하게 하였고, ㉡경영진은 모든 거래를 기록하고 재무제표에 반영하였음)이다."}, "t376": {"kw": ["재무제표에 대한 추가적인 서면진술(회계정책의 선택과 적용이 적합한지 여부 등)", "감사인에게 제공된 정보에 대한 추가적인 서면진술(경영진이 알고 있는 내부통제의 모든 미비점을 감사인에게 전달하였음)", "특정 경영진주장에 대한 서면진술(의도·능력 등)"], "ans": "서면진술에 포함되어야 하는 내용 중 기타 내용 관련 내용은 ①재무제표에 대한 추가적인 서면진술(회계정책의 선택과 적용이 적합한지 여부 등), ②감사인에게 제공된 정보에 대한 추가적인 서면진술(경영진이 알고 있는 내부통제의 모든 미비점을 감사인에게 전달하였음), ③특정 경영진주장에 대한 서면진술(의도·능력 등)이다."}, "t377": {"kw": ["해당사항을 경영진과 토의함", "경영진의 성실성을 다시 평가하고 경영진진술(구두 또는 서면) 및 감사증거일반의 신뢰성에 미칠 수 있는 영향을 평가함", "감사의견에 미칠 가능성이 있는 영향의 결정을 포함한 적절한 조치를 취함"], "ans": "경영진이 서면진술 중 하나 이상을 제공하지 않는 경우 수행절차는 ①해당사항을 경영진과 토의하고, ②경영진의 성실성을 다시 평가하고 경영진진술(구두 또는 서면) 및 감사증거일반의 신뢰성에 미칠 수 있는 영향을 평가하며, ③감사의견에 미칠 가능성이 있는 영향의 결정을 포함한 적절한 조치를 취하는 것이다."}, "t378": {"kw": ["데이터를 수집하거나 처리할 때의 부정확성", "금액이나 공시의 누락", "사실에 대한 간과나 명백한 해석상 오류에 따른 부정확한 회계추정치", "감사인이 비합리적이라고 고려하는 회계추정치와 관련된 경영진의 판단", "감사인이 적합하지 않다고 고려하는 경영진의 회계정책의 선택과 적용"], "ans": "왜곡표시의 발생원인은 다음과 같다. ①데이터를 수집하거나 처리할 때의 부정확성, ②금액이나 공시의 누락, ③사실에 대한 간과나 명백한 해석상 오류에 따른 부정확한 회계추정치, ④감사인이 비합리적이라고 고려하는 회계추정치와 관련된 경영진의 판단, 또는 감사인이 적합하지 않다고 고려하는 경영진의 회계정책의 선택과 적용이다."}, "t379": {"kw": ["명백하게 사소한 왜곡표시는 집계에서 제외", "수정분개 형식으로 집계하여 경영진에게 제시하면 자기검토위협으로 독립성이 훼손될 수 있어 제시하지 않음", "표본감사시 표본에서 식별된 왜곡표시가 아니라 모집단 전체를 감사하였다면 발생하였을 투영된 왜곡표시를 집계", "손익효과가 플러스/마이너스인 경우 상계하거나 절대값으로 사용 가능"], "ans": "식별된 왜곡표시를 집계할 때에는 다음 사항에 유의하여야 한다. ①명백하게 사소한 왜곡표시는 집계에서 제외한다. ②감사인이 왜곡표시를 수정분개의 형식으로 집계하여 이를 경영진에게 제시하면, 감사인이 스스로 작성한 회계처리를 감사인 자신이 감사하는 결과가 되어 자기검토위협을 발생시켜 독립성이 훼손되므로, 감사인은 수정분개를 제시하지 않는다. ③표본감사를 적용한 경우에는 표본에서 실제로 식별된 왜곡표시가 아니라, 모집단 전체를 감사하였다면 발생하였을 것으로 추정되는 투영된 왜곡표시를 집계한다. ④왜곡표시의 손익효과가 플러스(+)이거나 마이너스(-)인 경우, 그 금액을 상계하거나 절대값으로 사용할 수 있다."}, "t380": {"kw": ["식별된 왜곡표시의 성격과 발생상황에 비추어 다른 왜곡표시가 존재할 가능성", "다른 왜곡표시가 감사중 집계한 왜곡표시와 합쳐졌을 때 중요할 수 있는 경우", "감사 중 집계한 왜곡표시의 합계가 중요성에 근접하는 경우"], "ans": "감사인은 다음의 경우 전반감사전략과 감사계획을 수정할 필요가 있는지를 결정하여야 한다. ①식별된 왜곡표시의 성격과 그 왜곡표시가 발생한 상황에 비추어 볼 때 다른 왜곡표시가 존재할 가능성이 있고, 이러한 잠재적 왜곡표시가 감사 중에 집계한 왜곡표시와 합쳐졌을 때 중요할 수 있는 경우, ②감사 중에 집계한 왜곡표시의 합계가 중요성에 근접하는 경우이다."}, "t381": {"kw": ["집계된 왜곡표시의 합계가 중요성에 근접하는 경우 전반감사전략과 감사계획을 수정할 필요가 있는지 결정", "추가적인 감사절차의 수행이 필요한지", "위험평가가 여전히 적절한지 고려"], "ans": "감사 중에 집계한 왜곡표시의 합계가 중요성에 근접하는 경우, 감사인은 전반감사전략과 감사계획을 수정할 필요가 있는지를 결정하여야 한다. 이 경우 아직 식별되지 않은 왜곡표시가 존재할 위험이 예상보다 높을 수 있으므로, 추가적인 감사절차의 수행이 필요한지와 위험평가가 여전히 적절한지를 고려하여야 한다."}, "t382": {"kw": ["왜곡표시가 잔존하고 있는지 여부를 결정하기 위하여 추가적인 감사절차를 수행"], "ans": "경영진이 감사인에 의해 커뮤니케이션된 왜곡표시를 수정한 경우, 감사인은 왜곡표시가 잔존하고 있는지 여부를 결정하기 위하여 추가적인 감사절차를 수행하여야 한다."}, "t383": {"kw": ["경영진이 수정하지 않는 사유를 이해", "재무제표 전체에 중요한 왜곡표시가 없는지 평가(감사의견 형성)할 때 그 사유를 고려"], "ans": "경영진이 식별된 왜곡표시의 일부 또는 전부를 수정하지 않는 경우, 감사인은 경영진이 수정하지 않는 사유를 이해하여야 하고, 재무제표 전체에 중요한 왜곡표시가 없는지를 평가할 때(즉 감사의견을 형성할 때) 그 사유를 고려하여야 한다."}, "t384": {"kw": ["충분하고 적합한 감사증거를 입수할 수 없는 경우(감사범위의 제한)", "재무제표 전체에 중요한 왜곡표시가 존재한다고 결론내리는 경우"], "ans": "감사인은 다음의 경우 감사의견을 변형하여야 한다. ①감사인이 재무제표 전체에 중요한 왜곡표시가 없다고 결론내릴 수 있을 정도로 충분하고 적합한 감사증거를 입수할 수 없는 경우(감사범위의 제한), ②감사인이 입수한 감사증거에 근거할 때 재무제표 전체에 중요한 왜곡표시가 존재한다고 결론내리는 경우이다."}, "t385": {"kw": ["미수정왜곡표시", "미수정왜곡표시가 개별적으로 또는 집합적으로 감사의견에 미치는 영향", "지배기구와 커뮤니케이션"], "ans": "감사인은 미수정왜곡표시와, 그 미수정왜곡표시가 개별적으로 또는 집합적으로 감사의견에 미치는 영향에 대하여 지배기구와 커뮤니케이션하여야 한다."}, "t386": {"kw": ["중요성의 수준에 수정이 필요한지 고려", "전반적인 결론을 내리기 위한 분석적절차의 수행"], "ans": "미수정왜곡표시가 재무제표에 미치는 영향을 평가하기에 앞서, 감사인은 감사 중 설정한 중요성의 수준에 수정이 필요한지를 고려하여야 하고, 전반적인 결론을 내리기 위하여 분석적절차를 수행하여야 한다."}, "t387": {"kw": ["재무제표의 특정 요소·계정과목·항목에 국한되지 않음", "재무제표의 상당한 부분을 나타내거나 나타낼 수 있음", "이용자가 재무제표를 이해하는 데 근본적임"], "ans": "왜곡표시가 재무제표에 전반적인 영향을 미친다는 것은, ①재무제표의 특정 요소·계정과목·항목에 국한되지 않거나, ②특정 요소·계정과목·항목에 국한되더라도 이들이 재무제표의 상당한 부분을 나타내거나 나타낼 수 있거나, ③공시와 관련하여 재무제표이용자가 재무제표를 이해하는 데 근본적인 경우를 말한다."}, "t388": {"kw": ["감사인 업무의 성격이나 시기와 관련된 상황", "기업의 통제를 벗어난 상황(회계기록 파기·훼손, 정부당국의 압류·압수)", "경영진에 의한 제한(재고실사 입회 방해, 외부조회 방해)"], "ans": "감사범위의 제한은 다음과 같은 상황에서 발생한다. ①감사인 업무의 성격이나 시기와 관련된 상황(예: 관계기업에 대한 지분법 적용 여부를 평가하기 위한 충분한 증거를 입수할 수 없는 경우, 선임시기로 인해 재고자산 실사에 입회할 수 없는 경우, 실증절차만으로는 불충분하나 관련 통제가 효과적으로 운영되지 않는 경우), ②기업의 통제를 벗어난 상황(예: 회계기록이 파기·훼손된 경우, 회계기록이 정부당국에 의하여 무기한 압류·압수된 경우), ③경영진에 의한 제한(예: 재고자산 실사에 입회하는 것을 막거나 특정 계정잔액에 대한 외부조회를 하지 못하게 하는 경우)이다."}, "t389": {"kw": ["특정 거래유형·계정잔액·공시 및 재무제표 전체와 관련한 왜곡표시의 규모와 성격, 발생된 특정 상황", "과거 보고기간과 관련된 미수정왜곡표시가 미치는 영향"], "ans": "미수정왜곡표시가 중요한지 여부를 결정할 때, 감사인은 ①특정 거래유형, 계정잔액, 공시 및 재무제표 전체와 관련한 왜곡표시의 규모와 성격, 그리고 그 왜곡표시가 발생한 특정 상황(당기 미수정왜곡표시와 관련), ②과거 보고기간과 관련된 미수정왜곡표시가 관련 거래유형, 계정잔액, 공시 및 재무제표 전체에 미치는 영향을 고려하여야 한다."}, "t390": {"kw": ["미공시에 대하여 지배기구와 토의", "누락된 정보(공시)의 성격을 감사의견근거단락에 기술", "행가능하고 충분·적합한 증거를 보유한 경우 법규상 금지되지 않는 한 누락된 공시를 포함"], "ans": "경영진이 재무제표를 공정하게 표시하기 위하여 요구되는 중요한 정보를 공시하지 않는 경우, 감사인은 그 미공시에 대하여 지배기구와 토의하여야 하고, 감사의견근거단락에 누락된 정보(공시)의 성격을 기술하여야 하며, 관련 법규에 의하여 금지되지 않는 한, 감사인이 누락된 공시를 포함시키는 것이 행가능하고 그 누락된 공시에 대하여 충분하고 적합한 감사증거를 보유하고 있는 경우에는 그 누락된 공시를 포함하여야 한다."}, "t391": {"kw": ["보고서 제목", "보고대상(수신인)", "업무수행이사의 이름(상장법인)", "보고자(감사인)", "보고일자(감사보고서일)"], "ans": "감사보고서의 형식과 관련된 구성요소는 다음과 같다. ①보고서 제목(‘독립된 감사인의 감사보고서’라고 기재), ②보고대상(수신인, 일반적으로 ‘주주 및 이사회 귀중’이라고 기재하며 ‘감사’는 기재하지 않음), ③업무수행이사의 이름(주권상장법인의 감사보고서에만 포함), ④보고자(감사인)로서 국가내 주소·회계법인명·대표이사 이름·서명을 기재, ⑤보고일자(감사보고서일)로서 재무제표에 대한 의견의 기초가 되는 충분하고 적합한 감사증거를 입수하는 날보다 더 빠른 일자가 될 수 없다."}, "t392": {"kw": ["감사의견", "감사의견근거", "핵심감사사항(주권상장법인만)", "재무제표에 대한 경영진과 지배기구의 책임", "재무제표감사에 대한 감사인의 책임"], "ans": "감사보고서의 내용과 관련된 구성요소는 다음과 같다. ①감사의견, ②감사의견근거, ③핵심감사사항(주권상장법인의 감사보고서에만 기재), ④재무제표에 대한 경영진과 지배기구의 책임, ⑤재무제표감사에 대한 감사인의 책임이다."}, "t393": {"kw": ["업무수행이사 이름 공시가 개인의 안전에 대한 유의적 위험을 발생시킨다고 합리적으로 예상되는 경우", "위험의 발생가능성과 심각성에 대한 평가를 알리기 위해 이름을 기재하지 않으려는 의도를 지배기구와 논의"], "ans": "매우 드문 상황에서, 업무수행이사의 이름을 감사보고서에 공시하는 것이 그 개인의 안전에 대한 유의적 위협을 발생시킬 것으로 합리적으로 예상되는 경우, 감사인은 감사보고서에 그 이름을 기재하지 않을 수 있다. 이 경우 감사인은 그러한 위험의 발생가능성과 심각성에 대한 평가를 알리기 위하여, 이름을 기재하지 않으려는 의도를 지배기구와 논의하여야 한다."}, "t394": {"kw": ["전단:감사대상 회사의 이름과 재무제표를 감사하였다는 사실", "단위재무제표의 명칭, 보고대상 일자나 기간, 유의적 회계정책의 요약을 포함한 재무제표의 주석에 대한 언급", "후단:우리의 의견으로는, 별첨된 회사의 재무제표는, 재무상태와 재무성과 및 현금흐름을, 한국채택국제회계기준에 따라 중요성의 관점에서 공정하게 표시"], "ans": "감사의견 단락은 전단(감사대상)과 후단(감사의견)으로 구성된다. 전단에는 ①감사대상 회사의 이름과 해당 회사의 재무제표를 감사하였다는 사실, ②재무제표를 구성하는 단위재무제표의 명칭, 재무제표를 구성하는 단위재무제표의 보고대상 일자나 기간, 유의적인 회계정책의 요약을 포함한 재무제표의 주석에 대한 언급을 기재한다. 후단에는 ①우리의 의견으로는, ②별첨된 회사의 재무제표는, ③회사의 재무상태와 재무성과 및 현금흐름을, ④한국채택국제회계기준에 따라 중요성의 관점에서 공정하게(적정×) 표시하고 있다는 문구를 기재한다."}, "t395": {"kw": ["감사기준에 따라 감사를 수행", "우리의 책임은 감사인의 책임 단락에 기술", "대한민국의 윤리적 요구사항에 따라 독립적이며 기타의 윤리적 책임 이행", "입수한 감사증거가 감사의견을 위한 근거로서 충분하고 적합하다고 믿음"], "ans": "감사의견근거단락에는 다음 4가지를 기재하여야 한다. ①우리는 감사기준에 따라 감사를 수행하였다. ②우리의 책임은 감사인의 책임 단락에 기술되어 있다. ③우리는 국제윤리기준과 함께 대한민국의 윤리적 요구사항에 따라 회사로부터 독립적이며, 그러한 요구사항과 기타의 윤리적 책임들을 이행하였다. ④우리가 입수한 감사증거가 감사의견을 위한 근거로서 충분하고 적합하다고 우리는 믿는다."}, "t396": {"kw": ["감사기준에 따라 감사를 수행하였다는 문구 삭제", "우리의 책임은 감사인의 책임 단락에 기술되어 있다는 문구 삭제", "입수한 감사증거가 감사의견을 위한 근거로서 충분하고 적합하다는 문구 삭제"], "ans": "의견거절의 경우 감사인은 사실상 감사를 실시하였다고 할 수 없으므로, 감사의견근거단락에서 “우리는 감사기준에 따라 감사를 수행하였다”, “우리의 책임은 감사인의 책임 단락에 기술되어 있다”, “우리가 입수한 감사증거가 감사의견을 위한 근거로서 충분하고 적합하다고 우리는 믿는다”는 문구를 모두 삭제하여, 감사를 실시하지 못하였다는 취지를 반영한다."}, "t397": {"kw": ["전단:재무제표 작성책임", "내부통제에 대한 책임(정보제공책임 언급×)", "후단:계속기업으로서의 존속능력 평가책임", "계속기업전제의 사용에 대한 책임"], "ans": "재무제표에 대한 경영진의 책임단락에는, 전단에 ①재무제표 작성책임, ②내부통제에 대한 책임(정보제공책임은 언급하지 않음)을 기재하고, 후단에 ①계속기업으로서의 존속능력 평가책임(해당되는 경우 공시책임 포함), ②계속기업전제의 사용에 대한 책임을 기재한다."}, "t398": {"kw": ["회사의 재무보고절차의 감시(감지)에 대한 책임"], "ans": "재무제표에 대한 지배기구의 책임단락에는 회사의 재무보고절차의 감시에 대한 책임을 기재한다."}, "t399": {"kw": ["우리의 목적은 재무제표에 중요한 왜곡표시가 없는지에 대한 합리적 확신을 얻어 의견이 포함된 감사보고서를 발행하는 데 있음", "합리적 확신은 높은 수준의 확신이나 중요한 왜곡표시의 발견을 보장하지 않음", "왜곡표시의 원인(부정 또는 오류)", "중요한 왜곡표시의 개념(이용자의 경제적 의사결정에 영향을 미칠 것이 합리적으로 예상될 경우)"], "ans": "보고서 본문에 기재해야 하는 감사인의 책임(700-37)은 다음과 같다. ①우리의 목적은 재무제표에 중요한 왜곡표시가 없는지에 대한 합리적인 확신을 얻어, 의견이 포함된 감사보고서를 발행하는 데 있다. ②합리적 확신은 높은 수준의 확신이나 중요한 왜곡표시의 발견을 보장하지 않는다. ③왜곡표시의 원인(부정 또는 오류)과 중요한 왜곡표시의 개념(왜곡표시 중 이용자의 경제적 의사결정에 영향을 미칠 것이 합리적으로 예상될 경우)을 설명한다."}, "t400": {"kw": ["수행된 감사에 대해 투명성을 제고", "감사보고서에서의 커뮤니케이션 가치를 향상"], "ans": "핵심감사사항 커뮤니케이션의 목적은 수행된 감사에 대해 투명성을 제고함으로써 감사보고서에서의 커뮤니케이션 가치를 향상시키는 데 있다."}, "t401": {"kw": ["이용자가 감사인의 전문가적 판단상 가장 유의적인 사항을 이해하는 데 추가 정보 제공", "기업과 감사받은 재무제표의 유의적 판단분야를 이해하는 데 도움", "경영진·지배기구에 더 관여할 수 있는 근거 제공"], "ans": "핵심감사사항 커뮤니케이션의 효익은 다음과 같다. ①재무제표이용자가 감사인의 전문가적 판단상 가장 유의적인 사항을 이해하는 데 추가 정보를 제공한다. ②재무제표이용자가 기업과 감사받은 재무제표의 유의적 판단분야를 이해하는 데 도움을 준다. ③경영진과 지배기구가 감사인 및 지배기구와 더 관여할 수 있는 근거를 제공한다."}, "t402": {"kw": ["지배기구와 커뮤니케이션한 사항 중에서 유의적감사인주의가 필요하였던 사항을 결정", "유의적감사인주의가 필요하였던 사항 중 당기 재무제표감사에서 가장 유의적인 사항을 핵심감사사항으로 결정"], "ans": "핵심감사사항은 다음 단계로 결정한다. ①감사인은 지배기구와 커뮤니케이션한 사항 중에서 유의적감사인주의가 필요하였던 사항을 결정한다(701-9의 고려사항 적용). ②그중에서 감사인의 전문가적 판단에 따라 당기 재무제표감사에서 가장 유의적인 사항을 핵심감사사항으로 결정한다. 즉 핵심감사사항은 지배기구와 커뮤니케이션한 사항 중에서 선택된다."}, "t403": {"kw": ["중요왜곡표시위험이 더 높게 평가되거나 유의적 위험으로 식별된 분야", "높은 추정불확실성을 가지는 회계추정치를 포함하여 유의적경영진판단이 수반된 분야와 관련한 유의적감사인판단", "보고기간 중 발생한 유의적사건이나 거래가 감사에 미치는 영향"], "ans": "유의적감사인주의 결정시 고려사항(701-9)은 다음과 같다. ①중요왜곡표시위험이 더 높게 평가되거나 유의적 위험으로 식별된 분야, ②높은 추정불확실성을 가지는 회계추정치를 포함하여 유의적경영진판단이 수반된 재무제표 분야와 관련되는 유의적감사인판단, ③보고기간 중 발생한 유의적인 사건이나 거래가 감사에 미치는 영향이다."}, "t404": {"kw": ["핵심감사사항은 감사인의 전문가적 판단에 따라 당기 재무제표감사에서 가장 유의적인 사항", "재무제표 전체에 대한 감사의 관점에서 감사의견을 형성할 때 다루어진 사항이며 별도의 의견을 제공하지 않음"], "ans": "핵심감사사항 도입문구에 포함될 사항(701-11)은 다음과 같다. ①핵심감사사항은 감사인의 전문가적 판단에 따라 당기 재무제표감사에서 가장 유의적인 사항이다(핵심감사사항의 정의). ②해당 사항은 재무제표 전체에 대한 감사의 관점에서, 재무제표 전체에 대한 감사의견을 형성할 때 다루어진 사항이며, 감사인은 이 사항에 대하여 별도의 의견을 제공하지 않는다."}, "t405": {"kw": ["재무제표의 관련 공시(주석번호)에 대한 언급을 포함", "해당 사항이 감사에서 가장 유의적인 사항 중 하나로 고려되어 핵심감사사항으로 결정된 이유", "해당 사항이 감사에서 다루어진 방법(감사절차)"], "ans": "개별 핵심감사사항의 기재사항(701-13)은, 재무제표의 관련 공시에 대한 언급(주석 번호)을 포함하여, ①해당 사항이 감사에서 가장 유의적인 사항 중 하나로 고려되어 핵심감사사항으로 결정된 이유, ②해당 사항이 감사에서 다루어진 방법(감사절차)을 기재하여야 한다."}, "t406": {"kw": ["법규에서 해당 사항에 대한 공시를 배제함", "극히 드문 상황에서 감사보고서에 커뮤니케이션함으로써 발생할 수 있는 부정적 결과가 공익적 효익을 훨씬 넘어설 것이라고 합리적으로 예상되어 커뮤니케이션해서는 안 된다고 결정(단, 기업이 이미 공시한 적이 있는 경우 적용×)"], "ans": "핵심감사사항으로 결정된 사항이 감사보고서에 커뮤니케이션되지 않는 상황(701-14)은 다음과 같다. ①법규에서 해당 사항에 대한 공시를 배제하는 경우, ②극히 드문 상황에서, 해당 사항을 감사보고서에 커뮤니케이션함으로써 발생할 수 있는 부정적 결과가 그러한 커뮤니케이션의 공익적 효익을 훨씬 넘어설 것이라고 합리적으로 예상되기 때문에 감사인이 감사보고서에 해당 사항을 커뮤니케이션해서는 안 된다고 결정하는 경우이다(단, 기업이 해당 사항에 관한 정보를 이미 공시한 적이 있는 경우에는 이 문단을 적용해서는 안 됨)."}, "t407": {"kw": ["재무제표에 적절히 표시·공시되어 있으나 이용자가 재무제표를 이해하는 데 근본이 될 정도로 중요한 사항이라고 판단되는 사항을 언급하는 문단"], "ans": "강조사항문단이란 재무제표에 적절히 표시되거나 공시되어 있으나 이용자가 재무제표를 이해하는 데 근본이 될 정도로 중요한 사항이라고 감사인의 판단에 따라 감사보고서에서 언급하는 문단을 말한다."}, "t408": {"kw": ["재무제표에 표시·공시되지 않은 사항으로서 이용자가 감사·감사인의 책임·감사보고서를 이해하는데 관련성이 있다고 판단되는 사항을 언급하는 문단"], "ans": "기타사항문단이란 재무제표에 표시되거나 공시되지 않은 사항으로서 이용자가 감사, 감사인의 책임 또는 감사보고서를 이해하는 데 관련성이 있다고 감사인의 판단에 따라 감사보고서에서 언급하는 문단을 말한다."}, "t409": {"kw": ["예외적인 소송이나 규제조치의 미래 결과에 대한 불확실성", "재무제표일과 감사보고서일 사이에 발생한 유의적인 후속사건", "재무제표에 중요한 영향을 미치는 새로운 회계기준의 조기적용", "기업의 재무상태에 유의적인 영향을 미쳤거나 미치고 있는 주요 재해"], "ans": "강조사항문단의 기재가 필요한 상황(706-A5)은 다음과 같다. ①예외적인 소송이나 규제조치의 미래 결과에 대한 불확실성, ②재무제표일과 감사보고서일 사이에 발생한 유의적인 후속사건, ③재무제표에 중요한 영향을 미치는 새로운 회계기준의 조기적용, ④기업의 재무상태에 유의적인 영향을 미쳤거나 미치고 있는 주요 재해이다."}, "t410": {"kw": ["해당 사항으로 인해 감사기준서 705에 따라 의견을 변형할 것으로 요구되지 않음", "감사기준서 701 적용시 해당 사항이 커뮤니케이션되어야 하는 핵심감사사항으로 결정되지 않음"], "ans": "강조사항문단의 기재조건(706-8)은 다음과 같다. ①해당 사항으로 인해 감사기준서 705에 따라 의견을 변형할 것으로 요구되지 않아야 한다. ②감사기준서 701이 적용되는 경우, 해당 사항이 감사보고서에 커뮤니케이션되어야 하는 핵심감사사항으로 결정되지 않아야 한다."}, "t411": {"kw": ["강조사항이라는 용어를 포함한 적합한 제목을 가진 별도 단락", "강조될 사항 및 이를 상세히 기술한 재무제표 공시의 위치를 명확히 언급(재무제표상 정보만 언급)", "강조된 사항과 관련하여 감사의견이 변형되지 않는다는 점을 나타냄"], "ans": "강조사항문단 기재시 준수사항은 다음 3가지이다. ①“강조사항”이라는 용어를 포함하는 적합한 제목을 가진 감사보고서의 별도의 단락 내에 해당 문단을 포함한다. ②강조하고자 하는 사항 및 이를 상세히 기술하고 있는 재무제표 공시의 위치를 명확하게 언급한다(재무제표상의 정보만을 언급). ③강조된 사항과 관련하여 감사의견이 변형되지 않는다는 점을 나타낸다."}, "t412": {"kw": ["계속감사시 전기의견의 변경", "초도감사시(타 감사인이 감사한 경우 또는 전기재무제표가 감사받지 않은 경우)", "기타정보의 불일치", "감사에 대한 이용자의 이해와 관련되어 있는 경우", "복수 재무제표에 대한 보고", "감사보고서의 배포나 이용의 제약"], "ans": "기타사항문단의 기재가 필요한 상황(706-A10~A14)은 다음과 같다. ①계속감사시 전기재무제표에 대한 감사의견이 이전에 표명한 의견과 다른 경우, ②초도감사시(전기재무제표를 타 감사인이 감사한 경우 또는 전기재무제표가 감사받지 않은 경우), ③기타정보의 불일치, ④감사인의 책임이나 감사보고서에 대한 이용자의 이해와 관련되어 있는 경우, ⑤복수 재무제표에 대한 보고, ⑥감사보고서의 배포나 이용의 제약이 있는 경우이다."}, "t413": {"kw": ["기타사항문단을 포함하는 것이 법규상 금지되어 있지 않음", "해당 사항은 감사보고서에 커뮤니케이션되어야 하는 핵심감사사항으로 결정되지 않았음"], "ans": "기타사항의 정의를 만족한 경우 기타사항문단의 기재조건(706-10)은 다음과 같다. ①기타사항문단을 포함하는 것이 법규상 금지되어 있지 않아야 한다. ②해당 사항은 감사보고서에 커뮤니케이션되어야 하는 핵심감사사항으로 결정되지 않았어야 한다."}, "t414": {"kw": ["기타사항이라는 용어를 포함하는 적합한 제목을 가진 별도의 단락에 포함", "해당 기타사항이 재무제표에 표시 또는 공시가 요구되지 않는다는 점을 명확하게 나타냄"], "ans": "기타사항문단 기재시 준수사항은 다음과 같다. ①“기타사항”이라는 용어를 포함하는 적합한 제목을 가진 감사보고서의 별도의 단락 내에 해당 문단을 포함한다. ②해당 기타사항이 재무제표에 표시 또는 공시가 요구되지 않는다는 점을 명확하게 나타낸다."}, "t415": {"kw": ["강조사항이나 기타사항의 기재가 예상된다는 사실", "해당문단의 예상문안"], "ans": "강조사항 또는 기타사항의 기재가 예상되는 경우, 감사인은 ①강조사항이나 기타사항의 기재가 예상된다는 사실, ②해당 문단의 예상문안을 지배기구와 커뮤니케이션하여야 한다."}, "t416": {"kw": ["전임감사인이 동의하는 경우: 전임감사인이 재발행한 전기재무제표에 대한 감사보고서를 포함(감사보고서 2장)", "전임감사인이 동의하지 않는 경우: 기타사항문단에 전기재무제표는 전임감사인이 감사하였음, 전임감사인이 표명한 의견의 유형과 변형이유, 전임감사인의 감사보고서일을 기재"], "ans": "전기재무제표에 대해 전임감사인으로부터 감사를 받은 경우 전기재무제표에 대한 감사보고방법(710-17)은 다음과 같다. 전임감사인이 재발행에 동의하는 경우, 당기 감사보고서에 전임감사인이 재발행한 전기재무제표에 대한 감사보고서를 포함한다(감사보고서가 2장이 됨). 전임감사인이 동의하지 않는 경우, 당기감사보고서에 다음 사항이 포함된 기타사항문단을 기재한다. ①전기재무제표는 전임감사인이 감사하였음, ②전임감사인이 표명한 의견의 유형, 그리고 해당 의견이 변형되었으면 그 이유, ③전임감사인의 감사보고서일이다."}, "t417": {"kw": ["회사가 전기재무제표를 재작성하는 경우", "전임감사인이 제3자에 대해 재발행한 경우로서 동의하는 경우: 재발행된 전기 감사보고서 포함(2장)", "전임감사인이 재발행하지 않은 경우로서 동의하지 않는 경우: 기타사항문단에 전기재무제표는 전임감사인이 감사하였음, 의견유형과 변형이유, 감사보고서일, 그리고 전임감사인이 수정 전 전기재무제표에 대해 의견을 표명했다는 사실을 추가로 기재"], "ans": "회사가 전기재무제표를 재작성하는 경우 전기재무제표에 대한 감사보고방법(710-18)은 다음과 같다. 전임감사인이 제3자에 대해 감사보고서를 재발행한 경우로서 그 재발행에 동의하는 경우에는, 당기 감사보고서에 전임감사인이 재발행한 전기재무제표에 대한 감사보고서를 포함한다(감사보고서가 2장이 됨). 전임감사인이 제3자에 대해 감사보고서를 재발행하지 않은 경우로서 재발행에 동의하지 않는 경우에는, 당기감사보고서에 다음 사항이 포함된 기타사항문단을 기재한다. ①전기재무제표는 전임감사인이 감사하였음, ②전임감사인이 표명한 의견의 유형, 그리고 해당 의견이 변형되었으면 그 이유, ③전임감사인의 감사보고서일, 그리고 이에 더하여 ④전임감사인은 수정 전 전기재무제표에 대하여 의견을 표명했다는 사실이다. 다만 회사가 전기재무제표의 수정에 대한 내용을 주석에 적절하게 기재하였고 그 주석공시의 내용이 강조사항의 정의를 만족한다면, 강조사항문단을 기재하여야 한다."}, "t418": {"kw": ["적합한 수준의 경영진과 지배기구의 모든 구성원이 경영에 참여하고 있지 않는 한 지배기구와 해당 왜곡표시를 커뮤니케이션", "이러한 사실을 전임감사인에게 알리도록 경영진에게 요청"], "ans": "초도감사시 전임감사인이 감사한 전기재무제표에서 중요한 왜곡표시를 발견한 경우 수행절차(710-18)는 다음과 같다. ①적합한 수준의 경영진, 그리고 지배기구의 모든 구성원이 그 기업의 경영에 참여하고 있지 않는 한, 지배기구와 해당 왜곡표시를 커뮤니케이션하여야 하며, ②이러한 사실을 전임감사인에게 알리도록 경영진에게 요청하여야 한다."}, "t419": {"kw": ["경영진과의 논의를 통해 사업보고서를 구성하는 문서와 입수방식·시기를 결정", "사업보고서 문서의 최종본을 적시에 가능하면 감사보고서일 전에 입수하기 위해 경영진과 협의", "일부·전부가 감사보고서일 후에 제공될 경우 감사기준서 720의 절차를 완료할 수 있도록 최종본을 발행 전에 제공하겠다는 서면진술을 요청"], "ans": "기타정보의 입수와 관련한 수행절차(720-13)는 다음과 같다. ①경영진과의 논의를 통해 사업보고서를 구성하는 문서와 그 입수방식 및 시기를 결정하여야 한다. ②사업보고서를 구성하는 문서의 최종본을 적시에, 가능하다면 감사보고서일 전에 입수하기 위하여 경영진과 협의하여야 한다. ③기타정보의 일부 또는 전부가 감사보고서일 후에 제공될 것으로 예상되는 경우, 감사기준서 720에 따른 절차를 완료할 수 있도록 최종본을 발행 전에 제공하겠다는 서면진술을 경영진에게 요청하여야 한다."}, "t420": {"kw": ["재무제표와 기타정보 간에 중요한 불일치가 존재하는지 여부를 고려", "감사에서 입수한 증거와 도달한 결론의 관점에서 기타정보와 감사에서 얻은 감사인의 지식 간에 중요한 불일치가 존재하는지 여부를 고려"], "ans": "기타정보의 열람시 수행절차(720-14)는 다음과 같다. ①재무제표와 기타정보 간에 중요한 불일치가 존재하는지 여부를 고려하여야 한다. ②감사에서 입수한 증거와 도달한 결론의 관점에서, 기타정보와 감사에서 얻은 감사인의 지식 간에 중요한 불일치가 존재하는지 여부를 고려하여야 한다."}, "t421": {"kw": ["기타정보에 중요한 왜곡표시가 존재하는지 여부", "재무제표에 중요한 왜곡표시가 존재하는지 여부", "기업과 기업환경에 대한 감사인의 이해가 갱신될 필요가 있는지 여부"], "ans": "중요한 불일치의 존재나 기타정보가 중요하게 왜곡표시된 것으로 보이는 경우, 감사인은 추가감사절차를 수행하여 다음 3가지 사항에 대한 결론을 내려야 한다(720-16). ①기타정보에 중요한 왜곡표시가 존재하는지 여부, ②재무제표에 중요한 왜곡표시가 존재하는지 여부, ③기업과 기업환경에 대한 감사인의 이해가 갱신될 필요가 있는지 여부이다."}, "t422": {"kw": ["경영진에게 기타정보를 수정할 것을 요구", "경영진이 수정에 동의하는 경우 수정이 이루어졌는지 결정", "경영진이 수정을 거부하는 경우 이 사실을 지배기구와 커뮤니케이션하고 수정을 요구"], "ans": "기타정보에 중요한 왜곡표시가 존재한다고 결론을 내린 경우 수행절차(720-17)는 다음과 같다. ①경영진에게 기타정보를 수정할 것을 요구하여야 한다. ②이후, 경영진이 수정에 동의하는 경우에는 수정이 이루어졌는지 결정하고, 경영진이 수정을 거부하는 경우에는 이 사실을 지배기구와 커뮤니케이션하고 수정을 요구하여야 한다."}, "t423": {"kw": ["감사보고서일 전:감사보고서에 미치는 시사점을 고려하고 감사보고서에서 중요한 왜곡표시를 어떻게 다룰 계획인지 지배기구와 커뮤니케이션, 해당 법규에서 가능한 경우 감사업무를 해지", "감사보고서일 후:감사보고서 이용자가 중요한 미수정왜곡표시에 적절하게 주의를 기울일 수 있도록 감사인의 법적 권리와 의무를 고려하여 적절한 조치"], "ans": "지배기구와 커뮤니케이션한 후에도 기타정보가 수정되지 않는 경우 수행절차(720-18, 19)는 다음과 같다. 감사보고서일 전인 경우, ①감사보고서에 미치는 시사점을 고려하고 감사보고서에서 중요한 왜곡표시를 어떻게 다룰 계획인지 지배기구와 커뮤니케이션하고, ②해당 법규에서 가능한 경우 감사업무를 해지한다. 감사보고서일 후인 경우, 감사보고서 이용자가 중요한 미수정왜곡표시에 적절하게 주의를 기울일 수 있도록, 감사인의 법적 권리와 의무를 고려하여 적절한 조치를 취한다."}, "t424": {"kw": ["경영진이 기타정보에 책임이 있다는 설명", "감사보고서일 전 입수한 기타정보 및(상장기업은) 후 입수 예정 기타정보의 식별", "의견은 기타정보를 대상으로 하지 않으며 확신을 표명하지 않는다는 설명", "기타정보 열람·고려·보고 관련 감사인의 책임 기술", "감사보고서일 전 입수된 경우 보고할 내용이 없다는 설명 또는 미수정왜곡표시를 기술하는 설명"], "ans": "기타정보 단락(720-22)에는 다음 사항을 포함하여야 한다. ①경영진이 기타정보에 책임이 있다는 설명, ②감사보고서일 전에 입수한 기타정보 및(상장기업의 경우) 후에 입수할 것으로 예상되는 기타정보의 식별, ③감사의견은 기타정보를 대상으로 하지 않으며 확신을 표명하지 않는다는 설명, ④기타정보의 열람, 고려 및 보고와 관련한 감사인의 책임의 기술, ⑤감사보고서일 전에 기타정보를 입수한 경우, 보고할 내용이 없다는 설명 또는 미수정왜곡표시를 기술하는 설명이다."}, "t425": {"kw": ["공인회계사, 인증대상업무 책임자 및 의도된 이용자로 구성되는 삼자관계", "적절한 인증대상", "적절한 준거기준", "충분하고 적합한 증거", "합리적 확신업무와 제한적 확신업무 각각의 성격에 적합한 형태의 인증보고서"], "ans": "인증업무의 5가지 구성요소는 다음과 같다. ①공인회계사, 인증대상업무 책임자 및 의도된 이용자로 구성되는 삼자관계, ②적절한 인증대상, ③적절한 준거기준, ④충분하고 적합한 증거, ⑤합리적 확신업무와 제한적 확신업무 각각의 성격에 적합한 형태의 인증보고서이다."}, "t426": {"kw": ["세무신고서에 첨부하는 전체재무제표에 적용된 세무목적 회계기준", "실체가 채권자들을 위해 작성하는 현금흐름정보에 적용된 현금수지회계기준", "규제기관의 요구사항을 충족하기 위해 해당규제기관이 제정한 재무보고규정", "사채발행약정, 차입약정, 프로젝트지원 등 계약상의 재무보고조항"], "ans": "특정목적 재무보고체계의 예는 다음과 같다. ①세무신고서에 첨부하는 전체재무제표에 적용된 세무목적 회계기준, ②실체가 채권자들을 위해 작성하는 현금흐름정보에 적용된 현금수지회계기준, ③규제기관의 요구사항을 충족하기 위해 해당 규제기관이 제정한 재무보고규정, ④사채발행약정, 차입약정, 프로젝트지원 등 계약상의 재무보고조항이다."}, "t427": {"kw": ["해당재무제표가 작성되는 목적", "의도된 이용자", "해당 상황에서 해당재무보고체계가 수용될 수 있는지 여부를 결정하기 위해 경영진이 취한 조치"], "ans": "특정목적 재무보고체계의 수용가능성 결정시 이해할 사항은 다음과 같다. ①해당 재무제표가 작성되는 목적, ②의도된 이용자, ③해당 상황에서 해당 재무보고체계가 수용될 수 있는지 여부를 결정하기 위해 경영진이 취한 조치이다."}, "t428": {"kw": ["충분하고 적합한 감사증거의 입수여부와 관련한 수용·유지의 결정과 감사범위의 제한으로 인한 감사의견의 결정", "업무유형의 결정(유의적인 부문과 비유의적인 부문)", "부문감사인 활용시 감사절차", "연결절차에 대한 감사절차"], "ans": "그룹재무제표에 대한 주요 주제는 다음과 같다. ①충분하고 적합한 감사증거의 입수여부와 관련한 수용·유지의 결정과 감사범위의 제한으로 인한 감사의견의 결정, ②업무유형의 결정(유의적인 부문과 비유의적인 부문), ③부문감사인 활용시 감사절차, ④연결절차에 대한 감사절차이다."}, "t429": {"kw": ["그룹업무팀은 그룹재무제표에 대한 감사의견에 전적인 책임을 짐", "감사보고서에는 부문감사인을 언급하여서는 안 됨", "법규상 부문감사인의 언급이 요구되는 경우에도 그룹업무수행이사나 그가 속한 회계법인의 책임이 경감되지 아니함을 나타내야 함"], "ans": "그룹업무팀은 그룹재무제표에 대한 감사의견에 대하여 전적인 책임을 지므로, 감사보고서에는 부문감사인을 언급하여서는 안 된다. 법규상 부문감사인의 언급이 요구되는 경우에는, 부문감사인을 언급하더라도 그룹업무수행이사 또는 그가 속한 회계법인의 그룹감사의견에 대한 책임이 경감되지 아니함을 그룹재무제표에 대한 감사보고서에 나타내야 한다."}, "t430": {"kw": ["그룹업무팀은 유의적일 것 같은 부문을 식별하는 데 충분하도록 해당 그룹과 부문 및 그 환경을 이해하여야 함", "부문감사인이 업무를 수행할 예정인 경우 그룹업무수행이사는 부문감사인들의 업무에 관여할 수 있을 것인지 여부를 평가하여야 함"], "ans": "연결절차 및 부문재무정보에 관한 충분하고 적합한 감사증거를 입수할 수 있을 것인지를 결정할 때 수행하여야 하는 절차(600-12)는 다음과 같다. ①그룹업무팀은 유의적일 것 같은 부문을 식별하는 데 충분하도록 해당 그룹과 부문 및 그 환경을 이해하여야 한다. ②부문감사인이 그러한 부문의 재무정보에 대한 업무를 수행할 예정인 경우, 그룹업무수행이사는 그룹업무팀이 충분하고 적합한 감사증거를 입수하는 데 필요한 만큼 부문감사인들의 업무에 관여할 수 있을 것인지 여부를 평가하여야 한다."}, "t431": {"kw": ["그룹업무팀이 제약없는 접근권한 및 필요한 업무수행 권한을 보유하고 있는지 여부", "그룹에 유의적인 부문사업활동", "네트워크 회계법인 아닌 부문감사인 여부와 복수 감사인 선임의 논리적 근거", "그룹의 구조(법적 구조와 조직체계)", "연결절차의 복잡성"], "ans": "그룹과 부문 및 그 환경에 대한 이해와 관련하여 구체적으로 이해할 사항(600-A11)은 다음과 같다. ①그룹업무팀이 그룹지배기구·그룹경영진·부문지배기구·부문경영진·부문정보 및 부문감사인에 대하여 제약을 받지 않고 접근할 수 있고, 부문의 재무정보에 대하여 필요한 업무를 수행할 수 있는 권한을 보유하고 있는지 여부, ②그룹에 유의적인 부문사업활동(해당 산업과 규제적·경제적·정치적 환경 포함), ③그룹업무수행이사가 소속된 회계법인이나 그 네트워크 회계법인에 소속되지 않은 부문감사인이 부문의 재무정보에 대한 업무를 수행할 것인지 여부, 그리고 그룹경영진이 둘 이상의 감사인을 선임한 논리적 근거, ④그룹의 구조(법적 구조와 조직체계 등), ⑤연결절차의 복잡성 등이다."}, "t432": {"kw": ["업무의 수용 또는 유지 단계에서 입수한 그룹, 부문과 그 환경(그룹차원의 통제 포함)에 대한 이해를 강화함", "연결절차를 이해함"], "ans": "그룹업무팀의 위험평가절차(600-17)는 다음과 같다. ①업무의 수용 또는 유지 단계에서 입수한 그룹, 부문과 그 환경(그룹차원의 통제 포함)에 대한 이해를 강화하여야 한다. ②연결절차를 이해하여야 한다."}, "t433": {"kw": ["유의적인 것 같은 부문에 대한 최초 식별내용을 재확인하거나 수정함(업무유형의 결정 목적)", "부정이나 오류로 인한 그룹재무제표의 중요왜곡표시위험을 평가함(위험평가절차의 목적)"], "ans": "그룹, 부문 및 그 환경 이해의 정도(위험평가절차의 목적)(600-18)는 다음을 수행하는 데 충분하여야 한다. ①유의적인 것 같은 부문에 대한 최초 식별내용을 재확인하거나 수정함(업무유형의 결정 목적), ②부정이나 오류로 인한 그룹재무제표의 중요왜곡표시위험을 평가함(위험평가절차의 목적)이다."}, "t434": {"kw": ["그룹에 대하여 개별적으로 재무적 유의성을 가짐(그룹업무팀이 선택한 벤치마크의 15%를 초과하는 부문)", "고유한 성격이나 상황으로 인하여 그룹재무제표의 유의적인 중요왜곡표시위험을 포함할 것 같음(예: 그룹의 외환거래를 수행하는 부문)"], "ans": "유의적인 부문의 판단기준(600-9, A5~6)은 다음과 같다. ①그룹에 대하여 개별적으로 재무적 유의성을 가짐(예: 그룹업무팀이 선택한 벤치마크의 15%를 초과하는 부문), ②고유한 성격이나 상황으로 인하여 그룹재무제표의 유의적인 중요왜곡표시위험을 포함할 것 같음(예: 개별적으로 재무적 유의성을 갖지 않지만 그룹의 외환거래를 수행하고 있는 부문)이다."}, "t435": {"kw": ["부문중요성을 사용하여 해당 부문의 재무정보에 대한 감사를 수행"], "ans": "재무적 유의성으로 인하여 유의적인 부문에 대해서는, 부문중요성을 사용하여 해당 부문의 재무정보에 대한 감사를 수행하여야 한다."}, "t436": {"kw": ["하나 이상의 거래유형, 계정잔액 또는 공시에 대한 감사", "하나 이상의 계정잔액, 거래유형 또는 공시와 관련된 특정한 절차, 또는 그룹재무제표 수준에서 식별된 유의적인 중요왜곡표시위험과 관련된 통제테스트나 실증절차의 수행"], "ans": "고유한 성격이나 상황으로 인하여 유의적인 부문에 대해서는, 하나 이상의 거래유형, 계정잔액 또는 공시에 대한 감사, 또는 그룹재무제표 수준에서 식별된 유의적인 중요왜곡표시위험과 관련하여 하나 이상의 특정한 절차(통제테스트나 실증절차)를 수행하여야 한다."}, "t437": {"kw": ["그룹업무팀 수준에서의 분석적절차(그룹분석적절차)를 수행"], "ans": "유의적이지 않은 부문에 대해서는, 그룹업무팀 수준에서의 분석적절차(그룹분석적절차)를 수행하여야 한다."}, "t438": {"kw": ["유의적이지 아니한 부문 중 일부를 추출한 후 개별 부문의 재무정보에 대하여 다음 절차 중 하나 이상을 수행하거나 부문감사인에게 이를 수행하도록 요청", "부문중요성을 사용한 감사", "하나 이상의 거래유형·계정잔액·공시에 대한 감사", "특정의 절차", "부문중요성을 사용한 검토"], "ans": "2)에서 정한 절차와 그룹차원의 통제 및 연결절차에 대하여 수행한 절차를 통해서 충분하고 적합한 감사증거를 입수하지 못한 경우(600-29), 그룹업무팀은 유의적이지 아니한 부문 중 일부를 추출한 후 추출된 개별 부문의 재무정보에 대하여 다음의 절차 중 하나 이상을 수행하거나 부문감사인에게 이를 수행하도록 요청하여야 한다. ①부문중요성을 사용하여 해당 부문의 재무정보에 대한 감사, ②하나 이상의 거래유형, 계정잔액 또는 공시에 대한 감사, ③특정의 절차, ④부문중요성을 사용하여 해당 부문의 재무정보에 대한 검토이다."}, "t439": {"kw": ["그룹업무팀:그룹재무제표 전체에 대한 중요성과 부문중요성을 결정, 부문 수준에서 결정된 수행중요성의 적합성을 평가", "부문감사인:수행중요성을 결정"], "ans": "중요성의 종류에 따른 그룹업무팀과 부문감사인의 역할은 다음과 같다. 그룹업무팀은 ①그룹재무제표 전체에 대한 중요성과 부문중요성을 결정하고, ②부문 수준에서 결정된 수행중요성의 적합성을 평가한다. 부문감사인은 수행중요성을 결정한다."}, "t440": {"kw": ["부문감사인이 그룹감사와 관련된 윤리적 요구사항을 이해하고 준수할 것인지 여부(특히 독립적인지 여부)", "부문감사인의 전문가적 적격성", "감사인을 적극적으로 감독하는 규제환경하에서 부문감사인이 업무를 수행하는지 여부", "그룹업무팀이 충분하고 적합한 감사증거를 입수하는 데 필요한 만큼 부문감사인들의 업무에 관여할 수 있을 것인지 여부(이해할 사항의 핵심)"], "ans": "부문감사인에 대해 이해할 사항(600-19)은 다음과 같다. ①부문감사인이 그룹감사와 관련된 윤리적 요구사항을 이해하고 있으며 이를 준수할 것인지 여부, 특히 부문감사인이 독립적인지 여부, ②부문감사인의 전문가적 적격성, ③감사인을 적극적으로 감독하는 규제환경하에서 부문감사인이 업무를 수행하는지 여부, ④그룹업무팀이 충분하고 적합한 감사증거를 입수하는 데 필요한 만큼 부문감사인들의 업무에 관여할 수 있을 것인지 여부(이해할 사항의 핵심)이다."}, "t441": {"kw": ["부문감사인이 그룹감사에서 부문감사인의 책임을 완수하는 데 충분할 만큼 그룹감사에 적용되는 감사기준과 기타의 기준에 대하여 지식을 보유하고 있는지 여부", "부문감사인이 해당 부문재무정보에 대한 업무를 수행하는 데 필요한 전문기술(예: 해당 산업에 고유한 지식)을 보유하고 있는지 여부", "부문감사인이 해당 재무보고체계를 이해하고 있는지 여부"], "ans": "부문감사인의 전문가적 적격성에 대한 그룹업무팀의 이해사항에 포함될 수 있는 정보(600-A38)는 다음과 같다. ①부문감사인이 그룹감사에서 부문감사인의 책임을 완수하는 데 충분할 만큼 그룹감사에 적용되는 감사기준과 기타의 기준에 대하여 지식을 보유하고 있는지 여부, ②부문감사인이 해당 부문재무정보에 대한 업무를 수행하는 데 필요한 전문기술(예: 해당 산업에 고유한 지식)을 보유하고 있는지 여부, ③해당되는 경우, 부문감사인이 그룹감사에서 부문감사인의 책임을 완수하는 데 충분할 만큼 해당 재무보고체계를 이해하고 있는지 여부이다."}, "t442": {"kw": ["부문감사인이 그룹업무팀에 협조할 것을 확인해 주도록 하는 요청", "그룹감사와 관련된 윤리적 요구사항, 특히 독립성 요구사항", "부문중요성 및 한도기준(명백하게 사소한 금액)", "식별된 유의적인 중요왜곡표시위험", "그룹경영진이 작성한 특수관계자 목록 및 그룹업무팀이 알고 있는 기타의 특수관계자"], "ans": "부문감사인의 업무수행 전 그룹업무팀이 부문감사인에게 커뮤니케이션할 사항(600-40)은 다음과 같다. ①그룹업무팀이 자신의 업무를 활용할 것을 알고 있는 부문감사인이 그룹업무팀에 협조할 것을 확인해 주도록 하는 요청, ②그룹감사와 관련된 윤리적 요구사항, 특히 독립성 요구사항, ③부문의 재무정보에 대한 감사나 검토를 수행하는 경우 부문중요성 및 한도기준(명백하게 사소한 금액), ④부문감사인의 업무와 관련성이 있는 부정이나 오류로 인한 그룹재무제표의 식별된 유의적인 중요왜곡표시위험, ⑤그룹경영진이 작성한 특수관계자 목록 및 그룹업무팀이 알고 있는 기타의 특수관계자이다."}, "t443": {"kw": ["그룹에 유의적인 부문사업활동에 대하여 부문감사인이나 부문경영진과 토의함", "부정이나 오류로 인한 재무정보의 중요한 왜곡표시에 대한 부문의 취약성에 대하여 부문감사인과 토의함", "식별된 유의적인 중요왜곡표시위험에 대한 부문감사인의 문서화 내용을 검토함"], "ans": "부문감사인의 위험평가절차에 관여절차(600-30)는 다음과 같다. ①그룹에 유의적인 부문사업활동에 대하여 부문감사인이나 부문경영진과 토의한다. ②부정이나 오류로 인한 재무정보의 중요한 왜곡표시에 대한 부문의 취약성에 대하여 부문감사인과 토의한다. ③그룹재무제표의 식별된 유의적인 중요왜곡표시위험에 대한 부문감사인의 문서화 내용을 검토한다."}, "t444": {"kw": ["해당 위험에 대응하여 수행할 추가감사절차의 적합성을 평가하여야 함", "부문감사인에 대한 이해를 바탕으로 추가감사절차에 관여할 필요가 있는지 여부를 결정하여야 함(위험평가절차에는 반드시 관여하나 추가감사절차는 필요성에 따라 관여여부 결정)"], "ans": "부문에서 유의적인 중요왜곡표시위험 식별시 수행절차(600-31)는 다음과 같다. ①해당 위험에 대응하여 수행할 추가감사절차의 적합성을 평가하여야 한다. ②그룹업무팀은 부문감사인에 대한 이해를 바탕으로 하여 추가감사절차에 관여할 필요가 있는지 여부를 결정하여야 한다. 부문감사인의 위험평가절차에는 반드시 관여하여야 하지만, 추가감사절차의 경우에는 그 필요성에 따라 관여여부를 결정한다는 점에서 차이가 있다."}, "t445": {"kw": ["부문감사인이 그룹업무팀의 요구사항을 준수했는지 여부", "부문감사인이 그룹감사와 관련된 윤리적 요구사항(독립성 및 전문가적 적격성 포함)을 준수했는지 여부", "부문감사인의 전반적 발견사항, 결론 또는 의견", "부문재무정보에 대한 미수정왜곡표시의 목록", "부문감사인이 지배구조에게 커뮤니케이션했거나 할 것으로 기대되는 기타 유의적 사항들", "부문수준에서 식별된 유의적인 내부통제 미비점에 대한 설명", "그룹재무제표에 중요한 왜곡표시를 초래할 수 있는 법규위반 사례에 대한 정보", "경영진의 편의가능성을 나타내는 징후", "부문감사인의 보고대상인 부문재무정보의 식별", "그룹감사와 관련성이 있을 수 있거나 부문감사인이 그룹업무팀의 주의를 끌고 싶어하는 기타사항들"], "ans": "부문감사인의 추가감사절차 수행 후 그룹업무팀에 대한 커뮤니케이션 사항(600-41)은 다음과 같다. ①부문감사인이 그룹업무팀의 요구사항을 준수했는지 여부, ②부문감사인이 그룹감사와 관련된 윤리적 요구사항(독립성 및 전문가적 적격성 포함)을 준수했는지 여부, ③부문감사인의 전반적 발견사항, 결론 또는 의견, ④부문재무정보에 대한 미수정왜곡표시의 목록, ⑤부문감사인이 지배구조에게 커뮤니케이션했거나 커뮤니케이션할 것으로 기대되는 기타의 유의적 사항들, ⑥부문수준에서 식별된 유의적인 내부통제 미비점에 대한 설명, ⑦그룹재무제표에 중요한 왜곡표시를 초래할 수 있는 법규위반 사례에 대한 정보, ⑧경영진의 편의가능성을 나타내는 징후, ⑨부문감사인의 보고대상인 부문재무정보의 식별, ⑩그룹감사와 관련성이 있을 수 있거나 부문감사인이 그룹업무팀의 주의를 끌고 싶어하는 기타사항들이다."}, "t446": {"kw": ["평가에서 나타난 유의적 사항을 부문감사인, 부문경영진 또는 그룹경영진 등 적합한 대상과 토의함", "부문감사인의 감사문서 중 기타의 관련 부분을 검토할 필요가 있는지 여부를 결정함"], "ans": "커뮤니케이션의 적합성 평가시 수행절차(600-42)는 다음과 같다. ①이러한 평가에서 나타난 유의적 사항을 부문감사인, 부문경영진 또는 그룹경영진 등 적합한 대상과 토의한다. ②부문감사인의 감사문서 중 기타의 관련 부분을 검토할 필요가 있는지 여부를 결정한다."}, "t447": {"kw": ["어떠한 추가적인 절차가 수행되어야 할지 결정", "이 절차를 부문감사인이 수행할지 그룹업무팀이 수행할지 여부를 결정"], "ans": "부문감사인의 업무가 충분하지 않을 경우 수행절차(600-43)는 다음과 같다. ①어떠한 추가적인 절차가 수행되어야 할지 결정하여야 한다. ②이 절차를 부문감사인이 수행할지 그룹업무팀이 수행할지 여부를 결정하여야 한다. 즉 그룹업무팀은 부문감사인에게 추가적인 절차를 수행하도록 요청하거나, 부문감사인에 의한 추가적인 절차의 수행이 실행가능하지 않은 경우, 그룹업무팀이 부문재무정보에 대하여 직접 그 자신의 절차를 수행하여야 한다."}, "t448": {"kw": ["위험평가절차로서 그룹, 부문 및 그 환경에 대한 이해와 함께 연결절차에 대해서도 이해하여야 함"], "ans": "위험평가절차로서 그룹, 부문 및 그 환경에 대한 이해와 함께 연결절차에 대해서도 이해하여야 한다."}, "t449": {"kw": ["연결절차에 대하여 수행할 업무(실증절차)의 성격, 시기 및 범위가 그룹차원의 통제가 효과적으로 운영되고 있다는 기대에 근거하는 경우", "실증절차만으로는 경영진주장 수준의 충분하고 적합한 감사증거가 제공될 수 없는 경우"], "ans": "그룹차원의 통제테스트를 수행하는 경우(600-32)는 다음과 같다. ①연결절차에 대하여 수행할 업무(실증절차)의 성격, 시기 및 범위가 그룹차원의 통제가 효과적으로 운영되고 있다는 기대에 근거하거나, ②실증절차만으로는 경영진주장 수준의 충분하고 적합한 감사증거가 제공될 수 없는 경우이다."}, "t450": {"kw": ["연결범위의 적절성 검토", "부문의 재무제표일이  있는 부정이나 의심되는 부정"], "ans": "그룹지배기구와 커뮤니케이션할 사항(600-49)은 다음과 같다. ①그룹감사에 대한 제한(예: 그룹업무팀이 정보에 접근하는 데 제약이 가해진 경우), ②부문재무정보에 대하여 수행되는 업무유형의 개요, ③유의적 부문의 재무정보에 대하여 부문감사인이 수행할 업무에 대하여 그룹업무팀이 계획하고 있는 관여의 성격에 대한 개요, ④부문감사인의 업무에 대한 그룹업무팀의 평가가 해당 감사인의 업무품질에 대하여 우려를 발생시키는 사례, ⑤경영진, 부문경영진, 그룹차원의 통제에 유의적인 역할을 수행하는 종업원, 또는 그룹재무제표에 중요한 왜곡표시가 초래되는 부정과 관련된 기타의 사람들이 연루되어 있는 부정이나 의심되는 부정이다."}, "t456": {"kw": ["부문 재무정보에 관하여 파악한 유의적 사항의 분석 및 그 사항이 어떻게 해결되었는지에 대한 분석", "각 부문에 대해 수행된 업무의 유형에 관한 명세", "그룹업무팀과 부문감사인 간의 서면 커뮤니케이션"], "ans": "그룹업무팀이 문서화할 사항은, ①부문 재무정보에 관하여 파악한 유의적 사항의 분석 및 그 사항이 어떻게 해결되었는지에 대한 분석, ②각 부문에 대해 수행된 업무의 유형에 관한 명세, ③그룹업무팀과 부문감사인 간의 서면 커뮤니케이션이다."}};

/* ================= STORAGE ================= */
const KEY='auditMaster.v1';
let mem=null;
const blank=()=>({status:{},myAns:{},editAns:{},editCode:{},custom:[],srs:{},log:{},
  stats:{seen:0,ok:0,no:0,streak:0,best:0,days:{}},
  set:{dark:0,dir:'mix',pool:'all'}});
function load(){
  try{const r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r));}
  catch(e){console.warn('저장소를 쓸 수 없습니다. 이번 세션에만 기록됩니다.');}
  return blank();
}
let S=load();
let saveT=null;
function save(){
  if(saveT)clearTimeout(saveT);
  saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){mem=S;}},220);
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),1500);}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId={}; TOPICS.forEach(t=>byId[t.id]=t);

function hydrateCustom(){
  (S.custom||[]).forEach(t=>{
    if(byId[t.id])return;
    TOPICS.push(t); byId[t.id]=t;
    ANSWERS[t.id]={kw:t.kw||[],ans:t.ans||''};
  });
}
hydrateCustom();
function PARTS(){return [...new Set(TOPICS.map(t=>t.part))];}

const stOf=id=>S.status[id]||'n';
const modelOf=id=>S.editAns[id]!=null?S.editAns[id]:(ANSWERS[id]?ANSWERS[id].ans:'');
/* 앞글자도 직접 고친 버전이 있으면 그것을 우선 사용 */
const codeOf=id=>S.editCode[id]!=null?S.editCode[id]:(byId[id]?byId[id].code:'');
const kwOf=id=>ANSWERS[id]?ANSWERS[id].kw:null;
const hasModel=id=>!!(modelOf(id)&&modelOf(id).trim());
/* 새 주제를 직접 추가 */
function addCustomTopic(t){
  TOPICS.push(t); byId[t.id]=t;

}

const dueList=()=>TOPICS.filter(t=>{const r=S.srs[t.id];return !r||r.due<=Date.now();});
const IV={p:[4,7,14,30],s:[2],w:[1],n:[1]};
function bump(id,st){
  const prev=S.srs[id];
  const box=st==='p'?Math.min(3,(prev&&prev.st==='p'?(prev.box||0)+1:0)):0;
  const iv=(IV[st]||IV.w)[box]||IV[st][0];
  S.srs[id]={due:Date.now()+iv*DAY,box:box,st:st};
}
function setStatus(id,st){
  if(S.status[id]===st){delete S.status[id];delete S.srs[id];}
  else{S.status[id]=st;bump(id,st);}
  save();
}
function markDay(){const d=today();S.stats.days[d]=(S.stats.days[d]||0)+1;}
function counts(list){const c={p:0,s:0,w:0,n:0};(list||TOPICS).forEach(t=>c[stOf(t.id)]++);return c;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function tokens(code){return String(code).split(/\s+/).filter(Boolean);}

/* ================= 답안 채점 ================= */
/* 앞글자 한 글자마다, 그 글자로 시작하는 단어를 답안에 썼는지 확인 */
function syllsOf(code){return [...new Set([...String(code)].filter(c=>/[가-힣]/.test(c)))];}
function firstWord(text,s){
  const m=String(text).match(new RegExp('(?:^|[^가-힣])('+s+'[가-힣]*)'));
  return m?m[1]:null;
}
/* 핵심어 항목에서 대조할 단어 뽑기 ("발생: 설명" → 발생) */
function kwTerms(entry){
  const i=entry.indexOf(':');
  if(i>0&&i<=12){const l=entry.slice(0,i).trim();return {label:entry,words:[l]};}
  return {label:entry,words:(entry.match(/[가-힣]{2,}/g)||[]).slice(0,8)};
}
function kwHit(text,t){
  if(!t.words.length)return false;
  const n=t.words.filter(w=>text.includes(w)).length;
  return n/t.words.length>=0.34;
}
function grade(id,text){
  text=String(text||'');
  const syl=syllsOf(codeOf(id)).map(s=>{
    const w=firstWord(text,s);
    return {s:s,state:w?'hit':(text.includes(s)?'part':'miss'),word:w};
  });
  const list=kwOf(id)||[];
  const kws=list.map(e=>{const k=kwTerms(e);return {label:e,hit:kwHit(text,k),words:k.words};});
  const hit=syl.filter(x=>x.state==='hit').length;
  return {syl:syl,kws:kws,hit:hit,total:syl.length,
    pct:syl.length?Math.round(hit/syl.length*100):0,
    kwHit:kws.filter(k=>k.hit).length,kwTotal:kws.length};
}
/* 맞힌 단어에 형광펜 표시 (각 단어의 첫 등장만) */
function markHits(text,g){
  text=String(text);
  const terms=[];
  g.syl.forEach(x=>{if(x.word)terms.push(x.word);});
  g.kws.forEach(k=>{if(k.hit)k.words.forEach(w=>terms.push(w));});
  /* 긴 단어를 먼저 잡아 겹치는 구간이 중첩되지 않게 한다 */
  const uniq=[...new Set(terms)].filter(Boolean).sort((a,b)=>b.length-a.length);
  const R=[];
  uniq.forEach(w=>{
    const i=text.indexOf(w); if(i<0)return;
    const s=i,e=i+w.length;
    if(R.some(r=>s<r[1]&&e>r[0]))return;
    R.push([s,e]);
  });
  R.sort((a,b)=>a[0]-b[0]);
  let out='',p=0;
  R.forEach(r=>{out+=esc(text.slice(p,r[0]))+'<mark>'+esc(text.slice(r[0],r[1]))+'<\/mark>';p=r[1];});
  return out+esc(text.slice(p));
}
/* 모범답안(원문)에서 핵심어를 뽑아 빈칸으로 가리고, 누르면 보이게 한다 */
function kwWordsOf(id){
  const list=kwOf(id)||[];
  const words=[];
  list.forEach(e=>kwTerms(e).words.forEach(w=>words.push(w)));
  return [...new Set(words)].filter(w=>w&&w.length>=2);
}
function blankHTML(text,words){
  text=String(text);
  const uniq=[...new Set(words)].filter(Boolean).sort((a,b)=>b.length-a.length);
  const R=[];
  uniq.forEach(w=>{
    let from=0;
    for(;;){
      const i=text.indexOf(w,from); if(i<0)break;
      const s=i,e=i+w.length;
      if(!R.some(r=>s<r[1]&&e>r[0]))R.push([s,e]);
      from=i+1;
    }
  });
  R.sort((a,b)=>a[0]-b[0]);
  let out='',p=0;
  R.forEach(r=>{
    out+=esc(text.slice(p,r[0]))+
      `<span class="blank" role="button" tabindex="0" onclick="this.classList.toggle('rev')" onkeydown="if(event.key==='Enter'||event.key===' '){this.classList.toggle('rev');event.preventDefault();}">${esc(text.slice(r[0],r[1]))}</span>`;
    p=r[1];
  });
  return out+esc(text.slice(p));
}
function blankBlock(id){
  const model=modelOf(id);
  if(!model.trim())return `<div class="sec"><h2 class="t">원문 빈칸채우기 · 눌러서 확인</h2>
    <div class="card sm mut">아직 모범답안이 등록되지 않았습니다. 아래 버튼으로 채워 넣으면 여기에서 바로 빈칸 연습을 할 수 있습니다.</div></div>`;
  const words=kwWordsOf(id);
  const body=words.length?blankHTML(model,words):esc(model);
  return `<div class="sec"><h2 class="t">원문 빈칸채우기 · 눌러서 확인</h2>
    <div class="card"><div style="white-space:pre-wrap;font-size:14px;line-height:1.8;word-break:keep-all">${body}</div></div>
    ${words.length?'':'<div class="xs mut" style="margin-top:6px">이 주제는 빈칸으로 뚫을 핵심어 정보가 없어 원문만 표시합니다.</div>'}</div>`;
}
function gradeBlock(id,text){
  if(!String(text).trim())
    return `<div class="sec"><div class="card sm mut">답안을 쓰고 확인하면 앞글자를 몇 개나 살렸는지 채점해 드립니다.</div></div>`;
  const g=grade(id,text);
  return `<div class="sec">
    <h2 class="t">앞글자 채점</h2>
    <div class="card">
      <div class="row">
        <div class="sp"><div class="sm" style="font-weight:700">앞글자 ${g.total}자 중 ${g.hit}자를 살렸습니다</div>
        ${g.kwTotal?`<div class="xs mut" style="margin-top:3px">핵심어 ${g.kwTotal}개 중 ${g.kwHit}개 포함</div>`:''}</div>
        <div class="big" style="color:${g.pct>=80?'var(--ok)':g.pct>=50?'var(--shk)':'var(--bad)'}">${g.pct}%</div>
      </div>
      <div class="meter" style="margin-top:10px"><i class="p" style="width:${g.pct}%"></i></div>
      <div class="syls" style="margin-top:12px">${g.syl.map(x=>`<span class="syl ${x.state}" title="${esc(x.word||'')}">${esc(x.s)}</span>`).join('')}</div>
      <div class="legend">초록 = 그 글자로 시작하는 단어를 썼음 · 노랑 = 글자는 나오지만 첫 글자가 아님 · 회색 = 빠짐</div>
    </div>
  </div>`;
}

/* pool used by 학습/4선지 */
function pool(){
  const p=S.set.pool;
  if(p==='all')return TOPICS.slice();
  if(p==='due')return dueList();
  if(p==='hasAns')return TOPICS.filter(t=>hasModel(t.id));
  return TOPICS.filter(t=>stOf(t.id)===p);
}

function poolBar(){
  const o=[['all','전체'],['due','오늘 복습'],['w','틀림'],['s','헷갈림'],['n','미분류'],['p','완벽'],['hasAns','모범답안 있음']];
  return `<div class="chips" id="poolBar">`+o.map(([v,l])=>{
    const n=v==='all'?TOPICS.length:v==='due'?dueList().length:v==='hasAns'?TOPICS.filter(t=>hasModel(t.id)).length:counts()[v];
    return `<button class="chip" data-p="${v}" aria-pressed="${S.set.pool===v}">${l} ${n}</button>`;
  }).join('')+`</div>`;
}
function bindPool(cb){
  document.querySelectorAll('#poolBar .chip').forEach(b=>b.onclick=()=>{S.set.pool=b.dataset.p;save();cb();});
}

    <div class="row" style="gap:8px;margin-top:8px">

      <button class="btn" style="flex:2" id="sv">저장</button>
    </div>
  </div>`;
  $('#back').onclick=after;
  $('#sv').onclick=()=>{S.editAns[id]=$('#ed').value;save();toast('저장했습니다');after();};
  $('#reset').onclick=()=>{delete S.editAns[id];save();toast('기본값으로 되돌렸습니다');after();};

}

      <datalist id="partList">${partOptions.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>

      <label class="fl">모범답안 (선택, 나중에 채워도 됩니다)</label>

  $('#back').onclick=after;
  $('#nSave').onclick=()=>{

    if(!topic||!code){toast('주제와 앞글자는 꼭 입력해 주세요');return;}
    const id='u'+Date.now();
    addCustomTopic({id,part,ch,sec,topic,code,ans});
    toast('새 주제를 추가했습니다');
    after();

}

/* ---------- QUIZ ---------- */
let q=null,qStreak=0;
/* key가 'code'면 (수정된 앞글자 포함) codeOf, 아니면 topic 값을 반환 */
const valOf=(o,key)=>key==='code'?codeOf(o.id):o.topic;
function newQ(){
  const P=pool().filter(t=>t.code);
  if(P.length<4)return null;
  const t=P[Math.random()*P.length|0];
  const dir=S.set.dir==='mix'?(Math.random()<.5?'t2c':'c2t'):(S.set.dir==='topic2code'?'t2c':'c2t');
  const key=dir==='t2c'?'code':'topic';
  const seen=new Set([valOf(t,key)]);
  const distract=shuffle(TOPICS.filter(x=>x.id!==t.id)).filter(x=>{
    const v=valOf(x,key); if(seen.has(v))return false;seen.add(v);return true;}).slice(0,3);
  return {t,dir,opts:shuffle([t,...distract]),pick:null};
}
function vQuiz(){
  if(!q)q=newQ();
  if(!q){$('#main').innerHTML=poolBar()+`<div class="empty">이 묶음은 문제를 만들기에 주제가 부족합니다.<br>(최소 4개 필요)</div>`;bindPool(()=>{q=newQ();vQuiz();});return;}
  const {t,dir,opts,pick}=q;
  const key=dir==='t2c'?'code':'topic';
  const prompt=dir==='t2c'?t.topic:codeOf(t.id);
  const st=stOf(t.id), done=pick!==null;
  const ok=done&&valOf(pick,key)===valOf(t,key);
  const acc=S.stats.seen?Math.round(S.stats.ok/S.stats.seen*100):0;

  $('#main').innerHTML=poolBar()+`
  <div class="row" style="margin:10px 0 10px">
    <span class="pill">${dir==='t2c'?'주제 → 앞글자':'앞글자 → 주제'}</span>
    <div class="sp"></div>
    <span class="prog">연속 ${qStreak} · 정답률 ${acc}%</span>
  </div>

  <div class="card">
    <div class="xs mut">${dir==='t2c'?'다음 주제의 앞글자는?':'다음 앞글자에 해당하는 주제는?'}</div>
    ${dir==='t2c'
      ? `<div style="font-size:18px;font-weight:700;line-height:1.5;margin-top:7px;word-break:keep-all">${esc(prompt)}</div>
         <div class="xs mut" style="margin-top:7px">${esc(t.ch)}</div>`
      : `<div class="code" style="margin-top:9px">${esc(prompt)}</div><div class="codebar"></div>`}
  </div>

  <div class="sec" id="opts">
    ${opts.map((o,i)=>{
      let r='';
      if(done){ if(valOf(o,key)===valOf(t,key))r='ok'; else if(o===pick)r='no'; else r='dim'; }
      return `<button class="opt" data-i="${i}" ${done?'disabled':''} ${r?`data-r="${r}"`:''}>
        <span class="n">${'ABCD'[i]}</span><span>${esc(valOf(o,key))}</span></button>`;}).join('')}
  </div>

  ${done?`
  <div class="fb ${ok?'ok':'no'}">
    <b>${ok?'정답입니다':'오답입니다'}</b>
    <div class="sm" style="color:var(--ink2);margin-top:7px;word-break:keep-all">
      <div><b>주제</b> · ${esc(t.topic)}</div>
      <div style="margin-top:3px"><b>앞글자</b> · ${esc(codeOf(t.id))}</div>
      <div class="xs mut" style="margin-top:5px">${esc(t.part)} · ${esc(t.ch)}</div>
    </div>
  </div>
  ${hasModel(t.id)?`<div class="sec"><h2 class="t">모범답안</h2><div class="card"><div style="white-space:pre-wrap;font-size:14px;line-height:1.68;word-break:keep-all">${esc(modelOf(t.id))}</div></div></div>`:''}
  <div class="sec">
    <h2 class="t">정답 여부와 상관없이 상태를 남길 수 있습니다</h2>
    <div class="stat">${['p','s','w','n'].map(k=>`<button class="${k}" data-s="${k}" data-on="${st===k?1:0}">${ST[k]}</button>`).join('')}</div>
  </div>
  <div class="sec"><button class="btn full" id="nextQ">다음 문제 →</button></div>
  `:`<div class="sec xs mut" style="text-align:center">답을 고르면 해설이 나오고, <b>다음 문제</b> 버튼을 눌러야 넘어갑니다.</div>`}

  <div class="sec">
    <h2 class="t">출제 방향</h2>
    <div class="chips" id="dirBar">
      ${[['mix','섞어서'],['topic2code','주제 → 앞글자'],['code2topic','앞글자 → 주제']].map(([v,l])=>
        `<button class="chip" data-d="${v}" aria-pressed="${S.set.dir===v}">${l}</button>`).join('')}
    </div>
  </div>`;

  bindPool(()=>{q=newQ();vQuiz();});
  document.querySelectorAll('#dirBar .chip').forEach(b=>b.onclick=()=>{S.set.dir=b.dataset.d;save();q=newQ();vQuiz();});
  if(!done){
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      q.pick=opts[+b.dataset.i];
      const good=valOf(q.pick,key)===valOf(t,key);
      S.stats.seen++; markDay();
      if(good){S.stats.ok++;qStreak++;S.stats.streak=qStreak;S.stats.best=Math.max(S.stats.best,qStreak);
        if(stOf(t.id)==='p')bump(t.id,'p');}   /* 맞힐수록 복습 간격이 늘어남 */
      else{S.stats.no++;qStreak=0;S.stats.streak=0;
        if(!S.status[t.id]||S.status[t.id]==='n'){S.status[t.id]='w';bump(t.id,'w');}}
      S.log[t.id]=S.log[t.id]||{c:0,w:0}; S.log[t.id][good?'c':'w']++;
      save();vQuiz();});
  }else{
    document.querySelectorAll('.stat button').forEach(b=>b.onclick=()=>{setStatus(t.id,b.dataset.s);vQuiz();});
    $('#nextQ').onclick=()=>{q=newQ();vQuiz();window.scrollTo(0,0);};
  }
}

/* ---------- LIST ---------- */
let fPart='',fCh='',fSt='',fQ='';
function vList(){
  const c=counts();
  $('#main').innerHTML=`
  <div class="sec" style="margin-top:12px">
    <input type="search" id="q" placeholder="주제 · 앞글자 · 챕터 검색" value="${esc(fQ)}">
  </div>
  <div class="chips" id="stBar">
    ${[['','전체 '+TOPICS.length],['n','미분류 '+c.n],['w','틀림 '+c.w],['s','헷갈림 '+c.s],['p','완벽 '+c.p]]
      .map(([v,l])=>`<button class="chip" data-s="${v}" aria-pressed="${fSt===v}">${l}</button>`).join('')}
  </div>
  <div class="sec" style="display:grid;gap:7px">
    <select id="pSel"><option value="">전체 PART</option>${PARTS().map(p=>`<option ${fPart===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
    <select id="cSel"><option value="">전체 CHAPTER</option>${CHS(fPart).map(c2=>`<option ${fCh===c2?'selected':''}>${esc(c2)}</option>`).join('')}</select>
  </div>
  <div class="sec"><button class="addbtn" id="addTopic">＋ 새 주제 직접 추가하기</button></div>
  <div class="sec" id="results"></div>`;
  const qi=$('#q');
  let t0=null;
  qi.oninput=()=>{fQ=qi.value;clearTimeout(t0);t0=setTimeout(paintList,140);};
  document.querySelectorAll('#stBar .chip').forEach(b=>b.onclick=()=>{fSt=b.dataset.s;vList();});
  $('#pSel').onchange=e=>{fPart=e.target.value;fCh='';vList();};
  $('#cSel').onchange=e=>{fCh=e.target.value;vList();};
  $('#addTopic').onclick=()=>openAddTopic(vList);
  paintList();
}
/* redraw only the results block so typing stays responsive */
function paintList(){
  const box=$('#results'); if(!box)return;
  let L=TOPICS.filter(t=>(!fPart||t.part===fPart)&&(!fCh||t.ch===fCh)&&(!fSt||stOf(t.id)===fSt));
  if(fQ){const k=fQ.trim();L=L.filter(t=>t.topic.includes(k)||codeOf(t.id).includes(k)||t.ch.includes(k));}
  box.innerHTML=`<div class="xs mut" style="margin-bottom:7px">${L.length}개</div>`+
    (L.length?L.map(t=>{const s=stOf(t.id);
      return `<button class="item" data-id="${t.id}">
        <div class="row" style="align-items:flex-start;gap:9px">
          <span class="dot ${s}"></span>
          <span style="flex:1">
            <span class="tp">${esc(t.topic)}</span>
            <span class="cd" style="display:block">${esc(codeOf(t.id))}</span>
            <span class="mt">${esc(t.ch)}${hasModel(t.id)?' · 모범답안 ✓':''}</span>
          </span>
        </div></button>`;}).join(''):'<div class="empty">해당하는 주제가 없습니다.</div>');
  box.querySelectorAll('.item').forEach(b=>b.onclick=()=>detail(b.dataset.id));
}
function detail(id){
  const t=byId[id],st=stOf(id),kw=kwOf(id),model=modelOf(id),lg=S.log[id];
  $('#main').innerHTML=`
  <div class="sec"><button class="btn g" id="back">← 목록</button></div>
  <div class="card">
    <div class="xs mut">${esc(t.part)} · ${esc(t.ch)}${t.sec?' · '+esc(t.sec):''}</div>
    <div style="font-size:17px;font-weight:700;line-height:1.5;margin-top:6px;word-break:keep-all">${esc(t.topic)}</div>
    <div class="codebar"></div>
    <div class="code" style="margin-top:12px">${esc(codeOf(id))}</div>
  </div>
  ${kw?`<div class="sec"><h2 class="t">앞글자 풀이</h2><div class="card"><ul class="kw">${kw.map(k=>`<li>${esc(k)}</li>`).join('')}</ul></div></div>`:''}
  <div class="sec"><h2 class="t">모범답안</h2>
    <div class="card"><div style="white-space:pre-wrap;font-size:14px;line-height:1.68;word-break:keep-all">${model.trim()?esc(model):'<span class="mut">아직 등록되지 않았습니다.</span>'}</div></div>
    <button class="btn g full" id="ed" style="margin-top:8px">모범답안 · 앞글자 편집</button>
  </div>
  ${S.myAns[id]?`${gradeBlock(id,S.myAns[id])}
    <div class="sec"><h2 class="t">내가 쓴 답안</h2><div class="card"><div style="white-space:pre-wrap;font-size:14px;line-height:1.68">${markHits(S.myAns[id],grade(id,S.myAns[id]))}</div></div></div>`:''}
  <div class="sec"><h2 class="t">상태</h2>
    <div class="stat">${['p','s','w','n'].map(k=>`<button class="${k}" data-s="${k}" data-on="${st===k?1:0}">${ST[k]}</button>`).join('')}</div>
    ${lg?`<div class="xs mut" style="margin-top:8px">퀴즈 기록 · 정답 ${lg.c} / 오답 ${lg.w}</div>`:''}
  </div>`;
  $('#back').onclick=vList;
  $('#ed').onclick=()=>openEdit(id,()=>detail(id));
  document.querySelectorAll('.stat button').forEach(b=>b.onclick=()=>{setStatus(id,b.dataset.s);detail(id);});
}

/* ---------- STATS ---------- */
function vStats(){
  const st=S.stats,acc=st.seen?Math.round(st.ok/st.seen*100):0;
  const weak=TOPICS.filter(t=>S.log[t.id]&&S.log[t.id].w>0)
    .sort((a,b)=>(S.log[b.id].w-S.log[b.id].c)-(S.log[a.id].w-S.log[a.id].c)).slice(0,15);
  const days=Object.keys(st.days).sort().slice(-14);
  const mx=Math.max(1,...days.map(d=>st.days[d]));
  $('#main').innerHTML=`
  <div class="sec" style="margin-top:14px"><div class="grid4">
    <div class="kpi"><b>${st.seen}</b><span>푼 문제</span></div>
    <div class="kpi"><b>${st.ok}</b><span>정답</span></div>
    <div class="kpi"><b>${st.no}</b><span>오답</span></div>
    <div class="kpi"><b>${acc}%</b><span>정답률</span></div>
  </div></div>

  <div class="sec"><h2 class="t">최근 14일 학습량</h2>
    <div class="card"><div style="display:flex;align-items:flex-end;gap:4px;height:80px">
      ${days.length?days.map(d=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%">
        <div style="background:var(--acc);border-radius:3px 3px 0 0;height:${st.days[d]/mx*100}%;min-height:3px" title="${d} · ${st.days[d]}"></div>
      </div>`).join(''):'<div class="mut sm">아직 기록이 없습니다.</div>'}
    </div>${days.length?`<div class="xs mut" style="margin-top:7px">${days[0]} ~ ${days[days.length-1]}</div>`:''}</div>
  </div>

  <div class="sec"><h2 class="t">챕터별 숙련도</h2>
    ${[...new Set(TOPICS.map(t=>t.ch))].map(ch=>{const L=TOPICS.filter(t=>t.ch===ch),cc=counts(L);
      return `<div class="card" style="margin-bottom:7px;padding:10px 12px">
        <div class="row"><div class="sp xs" style="font-weight:600">${esc(ch)}</div><div class="xs mut">${cc.p}/${L.length}</div></div>
        <div class="meter" style="margin-top:6px"><i class="p" style="width:${cc.p/L.length*100}%"></i><i class="s" style="width:${cc.s/L.length*100}%"></i><i class="w" style="width:${cc.w/L.length*100}%"></i></div>
      </div>`;}).join('')}
  </div>

  <div class="sec"><h2 class="t">자주 틀리는 주제</h2>
    ${weak.length?weak.map(t=>`<button class="item" data-id="${t.id}">
      <div class="row" style="align-items:flex-start;gap:9px"><span class="dot ${stOf(t.id)}"></span>
      <span style="flex:1"><span class="tp">${esc(t.topic)}</span>
      <span class="cd" style="display:block">${esc(codeOf(t.id))}</span>
      <span class="mt">정답 ${S.log[t.id].c} · 오답 ${S.log[t.id].w}</span></span></div></button>`).join('')
    :'<div class="empty">아직 오답 기록이 없습니다.</div>'}
  </div>`;
  document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{go('list');detail(b.dataset.id);});
}
