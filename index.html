"}, "t149": {"kw": ["내부감사기능의 적격성 수준", "내부감사기능의 조직 내 위상과 관련 정책 및 절차가 내부감사인의 객관성을 지원하는 정도", "품질관리를 포함하여 내부감사기능이 체계적이고 규율된 접근법을 적용하는지 여부"], "ans": "내부감사기능이 수행한 업무의 활용여부를 결정하기 위하여 평가하여야 하는 3가지 사항은 ①내부감사기능의 적격성 수준, ②내부감사기능의 조직 내 위상과 관련 정책 및 절차가 내부감사인의 객관성을 지원하는 정도, ③품질관리를 포함하여 내부감사기능이 체계적이고 규율된 접근법을 적용하는지 여부이다."}, "t150": {"kw": ["관련 감사절차의 계획·수행 및 입수된 감사증거의 평가에 많은 판단이 수반될수록", "유의적인 것으로 식별된 위험에 대한 특별한 고려와 함께 경영진주장 수준의 평가된 중요왜곡표시위험이 높을수록", "내부감사기능의 적격성 수준이 낮을수록", "내부감사기능의 조직 내 위상과 관련 정책 및 절차가 내부감사인의 객관성을 적절하게 지원하지 못할수록"], "ans": "내부감사기능이 수행한 업무의 활용범위를 줄여야 하는 경우는 ①관련 감사절차의 계획·수행 및 입수된 감사증거의 평가에 많은 판단이 수반될수록, ②유의적인 것으로 식별된 위험에 대한 특별한 고려와 함께 경영진주장 수준의 평가된 중요왜곡표시위험이 높을수록, ③내부감사기능의 적격성 수준이 낮을수록, ④내부감사기능의 조직 내 위상과 관련 정책 및 절차가 내부감사인의 객관성을 적절하게 지원하지 못할수록이다."}, "t151": {"kw": ["업무의 활용계획을 내부감사기능과 토의하여야 함", "내부감사기능이 수행한 업무와 관련된 내부감사기능의 보고서를 열람하여야 함", "다음 사항을 평가하여 활용하기로 계획한 내부감사기능의 업무가 감사목적에 적절한지 결정: 해당 업무가 적절히 계획·수행·감독·검토 및 문서화되었는지, 합리적 결론 도출을 위한 충분하고 적합한 증거가 입수되었는지, 도달된 결론이 해당 상황에서 적합하고 내부감사기능이 작성한 보고서가 수행된 업무 결과와 일관성이 있는지 여부"], "ans": "내부감사기능이 수행한 업무를 활용하기로 계획한 경우 그 사전절차는 ①업무의 활용계획을 내부감사기능과 토의하고, ②내부감사기능이 수행한 업무와 관련된 내부감사기능의 보고서를 열람하며, ③내부감사기능이 수행한 업무에 대하여 다음 사항을 평가하여 활용하기로 계획한 내부감사기능의 업무가 감사목적에 적절한지 결정하는 것이다. 즉 ㉠해당 업무가 적절히 계획·수행·감독·검토 및 문서화되었는지, ㉡합리적 결론 도출을 위한 충분하고 적합한 증거가 입수되었는지, ㉢도달된 결론이 해당 상황에서 적합하고 내부감사기능이 작성한 보고서가 수행된 업무 결과와 일관성이 있는지 여부를 평가한다."}, "t152": {"kw": ["이용자는 사업과 경제활동 및 회계에 대하여 합리적인 지식을 보유하고 있으며 합리적인 주의를 기울여 재무제표에 담긴 정보를 연구하려는 의향을 가지고 있음", "이용자는 재무제표가 중요성 수준에서 작성·표시되고 감사가 이루어지고 있다는 점을 이해하고 있음", "이용자는 추정치의 사용·판단 그리고 미래 사건들에 대한 고려에 기초한 금액 측정에 내재하는 불확실성을 인식하고 있음", "이용자는 재무제표에 담긴 정보에 기초하여 합리적인 경제적 의사결정을 함"], "ans": "감사인의 재무제표 이용자에 대한 가정은 다음과 같다. ①이용자는 사업과 경제활동 및 회계에 대하여 합리적인 지식을 보유하고 있으며 합리적인 주의를 기울여 재무제표에 담긴 정보를 연구하려는 의향을 가지고 있고, ②이용자는 재무제표가 중요성 수준에서 작성·표시되고 감사가 이루어지고 있다는 점을 이해하고 있으며, ③이용자는 추정치의 사용·판단 그리고 미래 사건들에 대한 고려에 기초한 금액 측정에 내재하는 불확실성을 인식하고 있고, ④이용자는 재무제표에 담긴 정보에 기초하여 합리적인 경제적 의사결정을 한다."}, "t153": {"kw": ["감사를 계획하고 수행할 때(수행중요성)", "식별된 왜곡표시가 감사에 미치는 영향을 평가할 때(수행중요성)", "미수정왜곡표시가 있는 경우 재무제표에 미치는 영향을 평가할 때(감사보고서에 표명할 의견을 형성할 때, 중요성)"], "ans": "감사인이 중요성을 고려하는 시기는 모든 시기이다. ①감사를 계획하고 수행할 때(수행중요성), ②식별된 왜곡표시가 감사에 미치는 영향을 평가할 때(수행중요성), ③미수정왜곡표시가 있는 경우 재무제표에 미치는 영향을 평가할 때(즉 감사보고서에 표명할 의견을 형성할 때, 중요성)이다."}, "t154": {"kw": ["위험평가절차의 성격·시기 및 범위의 결정", "중요왜곡표시위험의 식별과 평가", "추가감사절차의 성격·시기 및 범위의 결정"], "ans": "계획수립시(전반감사전략 수립시) 중요성을 설정하는 이유는, 감사계획 수립시 감사인이 중요하다고 고려될 왜곡표시의 크기에 관한 판단을 내리게 되며 이러한 판단이 ①위험평가절차의 성격·시기 및 범위의 결정, ②중요왜곡표시위험의 식별과 평가, ③추가감사절차의 성격·시기 및 범위의 결정에 대한 근거를 제공하기 때문이다."}, "t155": {"kw": ["미수정왜곡표시와 미발견왜곡표시의 합계가 재무제표 전체의 중요성을 초과할 확률을", "적절하게 낮은 수준으로 감소시키기 위해", "감사인이 재무제표 전체의 중요성보다 작게 설정하는 금액"], "ans": "재무제표 전체에 대한 수행중요성이란 미수정왜곡표시와 미발견왜곡표시의 합계가 재무제표 전체의 중요성을 초과할 확률을 적절하게 낮은 수준으로 감소시키기 위해 감사인이 재무제표 전체의 중요성보다 작게 설정하는 금액을 말한다."}, "t156": {"kw": ["특정 거래유형·계정잔액 혹은 공시에 적용되는 중요성수준을 줄여서 표현한 것으로서", "감사대상회사의 특정한 상황(모든 상황×)에서 하나 이상의 특정항목에 대하여", "재무제표 전체에 대한 중요성보다 작은 왜곡표시가 재무제표에 기초한 이용자의 경제적 의사결정에 영향을 줄 것이라고 합리적으로 예상되는 경우 그 특정항목에 대해 설정되는 중요성"], "ans": "특정항목에 대한 중요성이란 특정 거래유형·계정잔액 혹은 공시에 적용되는 중요성수준을 줄여서 표현한 것으로서, 감사대상회사의 특정한 상황(모든 상황이 아님)에서 하나 이상의 특정항목에 대하여 재무제표 전체에 대한 중요성보다 작은 왜곡표시가 재무제표에 기초한 이용자의 경제적 의사결정에 영향을 줄 것이라고 합리적으로 예상되는 경우 그 특정항목에 대해 설정되는 중요성을 말한다."}, "t157": {"kw": ["법규 또는 해당재무보고체계가 어떤 항목의 측정이나 공시에 대한 이용자의 기대에 영향을 미치는지 여부(특수관계자와의 거래, 경영진과 지배기구에 대한 보상)", "기업이 속한 산업에 관련된 주요 공시(제약회사의 연구개발비)", "재무제표에 별도로 공시되는 회사사업의 특정측면에 주의가 집중되는지 여부(신규인수사업)"], "ans": "특정항목의 중요성 설정에 영향을 미치는 요인은 ①법규 또는 해당재무보고체계가 어떤 항목의 측정이나 공시에 대한 이용자의 기대에 영향을 미치는지 여부(예: 특수관계자와의 거래, 경영진과 지배기구에 대한 보상), ②기업이 속한 산업에 관련된 주요 공시(예: 제약회사의 연구개발비), ③재무제표에 별도로 공시되는 회사사업의 특정측면에 주의가 집중되는지 여부(예: 신규인수사업)이다."}, "t158": {"kw": ["왜곡표시가 일정금액에 미달하며", "이 항목이 명백하게 사소할 것이고", "또한 그 합계금액이 재무제표에 중요한 영향을 미치지 않을 것이 명백하다고 예상되어 지정한 일정금액"], "ans": "명백하게 사소한 금액이란 왜곡표시가 일정금액에 미달하며, 이 항목이 명백하게 사소할 것이고 또한 그 합계금액이 재무제표에 중요한 영향을 미치지 않을 것이 명백하다고 예상되어 지정한 일정금액을 말한다."}, "t159": {"kw": ["명백하게 사소한 금액은 중요성의 종류에 해당하지 않으므로 반드시 설정해야 하는 것은 아님", "'중요하지 않다'는 표현과 명백하게 사소한 금액은 다름", "명백하게 사소한 금액은 실증절차 완료 후에 감사인이 작성하는 식별된 왜곡표시집계표에 집계하지 않음", "명백하게 사소한 금액은 식별된 왜곡표시집계표에 포함되지 않으므로 경영진의 미수정왜곡표시에 대한 경영진의 서면진술에도 포함되지 않음"], "ans": "명백하게 사소한 금액과 관련하여 유의할 사항은 다음과 같다. ①명백하게 사소한 금액은 중요성의 종류에 해당하지 않으므로 반드시 설정해야 하는 것은 아니다. ②'중요하지 않다'는 표현과 명백하게 사소한 금액은 다르다. ③명백하게 사소한 금액은 실증절차 완료 후에 감사인이 작성하는 식별된 왜곡표시집계표에 집계하지 않는다. ④명백하게 사소한 금액은 식별된 왜곡표시집계표에 포함되지 않으므로 경영진의 미수정왜곡표시에 대한 경영진의 서면진술에도 포함되지 않는다."}, "t160": {"kw": ["재무제표의 요소(자산·부채·자본·수익·비용)", "특정기업의 재무제표이용자가 중점을 둘 가능성이 높은 항목들이 존재하는지 여부(이익·매출·순자산)", "기업의 성격·기업 수명주기상의 위치 그리고 기업이 속한 산업 및 경제 환경(영리기업은 법인세비용차감전순이익, 비영리기업은 총수익 또는 총비용)", "기업의 소유구조와 자본조달방법", "벤치마크의 상대적 변동성(제약조건)"], "ans": "벤치마크의 식별에 영향을 미치는 요소는 ①재무제표의 요소(자산·부채·자본·수익·비용), ②특정기업의 재무제표이용자가 중점을 둘 가능성이 높은 항목들이 존재하는지 여부(이익·매출 또는 순자산), ③기업의 성격·기업 수명주기상의 위치 그리고 기업이 속한 산업 및 경제 환경(영리기업은 일반적으로 법인세비용차감전순이익, 비영리기업은 총수익 또는 총비용), ④기업의 소유구조와 자본조달방법, ⑤벤치마크의 상대적 변동성(제약조건)이다. 세전이익의 변동이 큰 경우 총매출·총매출이익 등 변동성이 크지 않은 다른 벤치마크로 변경하여야 한다."}, "t161": {"kw": ["수행중요성을 수정하는 것이 필요한지 여부(특정항목에 대한 중요성을 설정하였다면 그 중요성과 수행중요성도 낮추는 것이 필요한지 결정)", "추가감사절차의 성격·시기 및 범위가 여전히 적합한지 여부"], "ans": "실제의 재무결과가 재무제표 전체에 대한 중요성을 결정하기 위하여 처음 사용된 연간 재무결과의 예측치와 상당히 차이가 있을 것 같으면 최초 중요성을 수정한다. 중요성을 낮추기로 결정한 경우 결정사항은 ①수행중요성을 수정하는 것이 필요한지 여부(특정항목에 대한 중요성을 설정하였다면 그 특정항목에 대한 중요성과 수행중요성도 낮추는 것이 필요한지 결정), ②추가감사절차의 성격·시기 및 범위가 여전히 적합한지 여부이다."}, "t162": {"kw": ["업무팀원의 적절한 구성", "적절한 계획수립", "전문가적 의구심의 적용", "수행된 감사업무의 감독과 검토"], "ans": "적발위험을 감소시키는 사항은 ①업무팀원의 적절한 구성, ②적절한 계획수립, ③전문가적 의구심의 적용, ④수행된 감사업무의 감독과 검토이다."}, "t163": {"kw": ["모든 관련통제를 고려하기 전에", "거래유형·계정잔액 혹은 공시에 대한 경영진의 주장이", "개별적으로 또는 다른 왜곡표시와 합칠 때 중요하게 왜곡표시될 가능성"], "ans": "고유위험(IR)이란 모든 관련통제를 고려하기 전에 거래유형·계정잔액 혹은 공시에 대한 경영진의 주장이, 개별적으로 또는 다른 왜곡표시와 합칠 때 중요하게 왜곡표시될 가능성을 말한다."}, "t164": {"kw": ["거래유형·계정잔액 혹은 공시에 대한 경영진의 주장에서 발생할 수 있으며 개별적으로 또는 다른 왜곡표시와 합쳐 중요할 수 있는 왜곡표시가", "기업의 내부통제시스템에 의해 적시에 예방되거나 발견·수정되지 못할 위험", "내부통제시스템의 고유한계로 인하여 통제위험은 감소될 수는 있어도 0이 될 수 없음"], "ans": "통제위험(CR)이란 거래유형·계정잔액 혹은 공시에 대한 경영진의 주장에서 발생할 수 있으며 개별적으로 또는 다른 왜곡표시와 합쳐 중요할 수 있는 왜곡표시가, 기업의 내부통제시스템에 의해 적시에 예방되거나 발견·수정되지 못할 위험을 말한다. 내부통제시스템이 아무리 잘 설계되어 있고 운영되어도 내부통제시스템의 고유한계로 인하여 재무제표의 중요왜곡표시위험을 완전하게 제거할 수는 없으므로 통제위험은 감소될 수는 있어도 0이 될 수 없다."}, "t165": {"kw": ["감사위험을 수용가능한 낮은 수준으로 감소시키기 위해 감사인이 수행하는 절차(실증절차)가", "개별적으로 또는 다른 왜곡표시와 합칠 경우", "중요할 수 있는 왜곡표시를 발견하지 못할 위험"], "ans": "적발위험(DR)이란 감사위험을 수용가능한 낮은 수준으로 감소시키기 위해 감사인이 수행하는 절차(실증절차)가 개별적으로 또는 다른 왜곡표시와 합칠 경우 중요할 수 있는 왜곡표시를 발견하지 못할 위험을 말한다."}, "t166": {"kw": ["감사인의 위험평가에는 판단이 수반되므로 모든 중요왜곡표시위험이 식별되지 않을 수 있음", "경영진의 통제무력화 등 내부통제시스템에 고유한계가 존재함"], "ans": "평가된 중요왜곡표시위험과 관계없이 중요한 거래유형과 계정잔액 및 공시에 대해서 세부테스트를 포함한 실증절차를 설계하고 수행해야 하는 이유는 ①감사인의 위험평가에는 판단이 수반되므로 모든 중요왜곡표시위험이 식별되지 않을 수 있고, ②경영진의 통제무력화 등 내부통제시스템에 고유한계가 존재하기 때문이다."}, "t167": {"kw": ["목표감사위험은 감사인이 사전에 결정하는 위험이므로 상수임", "달성감사위험은 감사증거량이 증가할수록 낮아지므로 달성감사위험과 감사증거량은 역의 관계", "내부통제시스템의 한계로 통제위험이 0이 될 수 없고 감사의 고유한계로 적발위험도 0이 될 수 없어 달성감사위험은 0이 될 수 없음"], "ans": "감사위험과 감사증거량의 관계는 다음과 같다. 목표감사위험은 감사인이 사전에 결정하는 위험이므로 상수이며, 달성감사위험은 감사증거량이 증가할수록 낮아지기 때문에 달성감사위험과 감사증거량은 역의 관계에 있다. 또한 내부통제시스템의 한계로 인하여 통제위험이 0이 될 수 없고 감사의 고유한계로 인하여 적발위험도 0이 될 수 없기 때문에 달성감사위험은 0이 될 수 없다."}, "t168": {"kw": ["부정과 오류로 인한 재무제표 수준과 경영진주장 수준에서의 중요왜곡표시위험의 식별과 평가", "감사기준서 330(평가된 위험에 대한 감사인의 대응)에 따른 추가감사절차의 설계에 대한 적합한 근거를 제공하는 감사증거를 입수하기 위함"], "ans": "감사인이 위험평가절차를 설계하고 수행하는 목적은 다음에 대한 적합한 근거를 제공하는 감사증거를 입수하기 위함이다. ①부정과 오류로 인한 재무제표 수준과 경영진주장 수준에서의 중요왜곡표시위험의 식별과 평가, ②감사기준서 330(평가된 위험에 대한 감사인의 대응)에 따른 추가감사절차의 설계이다."}, "t169": {"kw": ["업무수행이사 등 경험이 많은 업무팀원들이 기업에 대한 지식에 기초하여 가지고 있는 통찰을 서로 공유하는 기회를 제공함", "업무팀원들이 사업위험에 대한 정보, 고유위험요소가 왜곡표시가능성에 어떻게 영향을 주는지, 재무제표의 어느 부분이 부정과 오류에 의한 왜곡표시위험에 어떻게 취약한지에 대하여 정보를 교환할 수 있게 함", "업무팀원들이 자신에게 배정된 특정 분야의 중요한 왜곡표시 가능성을 더 잘 이해하게 하고, 감사절차의 다른 측면에 어떻게 영향을 미칠 수 있는지 이해하게 함", "업무팀원들이 감사의 전 과정에 걸쳐 입수하는 새로운 정보를 공유하고 커뮤니케이션할 수 있는 기초를 제공함"], "ans": "위험평가절차 수행시 업무팀 토의의 효익은 다음과 같다. ①업무수행이사 등 경험이 많은 업무팀원들이 기업에 대한 지식에 기초하여 가지고 있는 통찰을 서로 공유하는 기회를 제공하고, ②업무팀원들이 기업에 영향을 미치는 사업위험에 대한 정보, 고유위험요소가 거래유형·계정잔액 및 공시의 왜곡표시가능성에 어떻게 영향을 주는지, 재무제표의 어느 부분이 부정과 오류에 의한 왜곡표시위험에 어떻게 취약한지에 대하여 정보를 교환할 수 있게 하며, ③업무팀원들이 자신에게 배정된 특정 분야의 중요한 왜곡표시 가능성을 더 잘 이해하게 하고 업무팀원들이 수행하는 감사절차의 결과가 추가감사절차의 성격·시기 및 범위의 결정 등 감사절차의 다른 측면에 어떻게 영향을 미칠 수 있는지 이해하게 하고, ④업무팀원들이 중요왜곡표시위험의 평가 또는 이러한 위험에 대처하기 위해 수행되는 감사절차에 영향을 미칠 수 있는 새로운 정보를 감사의 전 과정에 걸쳐 입수하는 경우 이를 공유하고 커뮤니케이션할 수 있는 기초를 제공한다."}, "t170": {"kw": ["해당 재무보고체계의 적용", "기업의 재무제표가 중요하게 왜곡표시될 가능성"], "ans": "위험평가절차 수행시 업무수행이사와 주요 업무팀원이 토의하여야 할 사항은 ①해당 재무보고체계의 적용과 ②기업의 재무제표가 중요하게 왜곡표시될 가능성이다."}, "t171": {"kw": ["질문: 경영진, 내부감사기능 담당자를 포함한 기업 내부의 기타 적절한 관련자에 대한 질문", "분석적절차(위험평가절차로서의 분석적절차)", "관찰", "검사"], "ans": "위험평가절차 수행시 포함되어야 하는 감사증거 입수방법(감사기술)은 ①질문(경영진, 기능이 존재한다면 내부감사기능 내의 담당자를 포함한 기업 내부의 기타 적절한 관련자에 대한 질문), ②분석적절차(위험평가절차로서의 분석적절차), ③관찰과 검사이다."}, "t172": {"kw": ["[기업과 기업환경] 조직구조·소유 및 지배구조·기업의 사업모델", "내·외부적으로 기업의 재무성과를 평가하는데 사용되는 측정", "산업적 요인·규제적 요인 및 기타 외부적 요인", "[재무보고체계] 해당 재무보고체계와 기업의 회계정책 및 변경 시 그 이유", "[고유위험요소 영향 정도] 고유위험요소가 경영진주장의 왜곡표시 가능성에 어떻게 영향을 미치는지 및 그 정도"], "ans": "위험평가절차의 수행을 통하여 기업과 기업환경 및 해당 재무보고체계와 관련하여 이해할 사항은 다음과 같다. 첫째, 기업과 기업환경의 측면으로 ①기업의 조직구조·소유 및 지배구조 그리고 기업의 사업모델, ②내·외부적으로 기업의 재무성과를 평가하는데 사용되는 측정, ③산업적 요인·규제적 요인 및 기타 외부적 요인을 이해한다. 둘째, 해당 재무보고체계와 기업의 회계정책 및 변경 시 그 이유를 이해한다. 셋째, 앞의 이해를 기초로 하였을 때 해당 재무보고체계에 따른 재무제표의 작성에 있어 고유위험요소가 경영진주장의 왜곡표시 가능성에 어떻게 영향을 미치는지 및 영향을 미치는 정도를 이해한다."}, "t173": {"kw": ["위험이 재무제표에 전반적인 영향을 주는지 결정함", "감사기준서 330(평가된 위험에 대한 감사인의 대응)에 따른 전반적인 대응을 요구하는지 결정함"], "ans": "감사인이 재무제표 수준에서 중요왜곡표시위험을 식별하는 이유는 ①위험이 재무제표에 전반적인 영향을 주는지 결정하고, ②감사기준서 330(평가된 위험에 대한 감사인의 대응)에 따른 전반적인 대응을 요구하는지 결정하기 위함이다."}, "t174": {"kw": ["재무제표 수준의 위험이 경영진주장 수준의 위험 평가에 영향을 주는지 결정함", "재무제표에 미치는 전반적인 영향의 성격과 규모를 평가함"], "ans": "재무제표 수준에서 식별된 중요왜곡표시위험을 평가할 때(또는 평가한 후) 수행절차는 ①재무제표 수준의 위험이 경영진주장 수준의 위험 평가에 영향을 주는지 결정하고, ②재무제표에 미치는 전반적인 영향의 성격과 규모를 평가하는 것이다."}, "t175": {"kw": ["기업의 정보시스템에 대한 감사인의 이해 범위를 위한 근거를 제공함", "이러한 이해는 나아가 감사인이 중요왜곡표시위험을 식별하고 평가하는데 도움을 줌"], "ans": "관련경영진주장과 유의적인 거래유형·계정잔액 및 공시를 결정하는 이유는 ①기업의 정보시스템에 대한 감사인의 이해 범위를 위한 근거를 제공하고, ②이러한 이해가 나아가 감사인이 중요왜곡표시위험을 식별하고 평가하는데 도움을 주기 때문이다."}, "t176": {"kw": ["고유위험요소가 관련경영진주장의 왜곡표시가능성에 영향을 미치는 방법과 그 정도", "재무제표 수준의 중요왜곡표시위험이 경영진주장 수준의 중요왜곡표시위험의 고유위험 평가에 영향을 미치는 방법과 그 정도"], "ans": "고유위험 평가시 왜곡표시의 발생가능성과 규모를 평가할 때 고려할 사항은 ①고유위험요소가 관련경영진주장의 왜곡표시가능성에 영향을 미치는 방법과 그 정도, ②재무제표 수준의 중요왜곡표시위험이 경영진주장 수준의 중요왜곡표시위험의 고유위험 평가에 영향을 미치는 방법과 그 정도이다."}, "t177": {"kw": ["통제를 고려하기 전에 부정 또는 오류로 인하여", "거래유형·계정잔액 또는 공시에 대한 경영진주장이 왜곡표시될 가능성에 영향을 미치는", "사건이나 상황의 특성으로서 질적이거나 양적일 수 있음"], "ans": "고유위험요소란 통제를 고려하기 전에 부정 또는 오류로 인하여 거래유형·계정잔액 또는 공시에 대한 경영진주장이 왜곡표시될 가능성에 영향을 미치는 사건이나 상황의 특성을 말하며, 그러한 요소는 질적이거나 양적일 수 있다."}, "t178": {"kw": ["주관성", "변화", "복잡성", "불확실성", "경영진 편의나 기타 부정위험요소로 인한 왜곡표시 가능성"], "ans": "고유위험요소 5가지는 ①주관성(회계추정치에 대한 광범위한 가능한 측정 요건 등), ②변화(새로운 회계 의견서의 적용 등), ③복잡성(복잡한 절차를 수반하는 회계측정 등), ④불확실성(회계추정치와 관련 공시를 포함한 유의적인 측정 불확실성이 있는 사건이나 거래 등), ⑤경영진 편의나 기타 부정위험요소로 인한 왜곡표시 가능성(경영진과 종업원이 부정 재무보고에 개입할 기회·특수관계자와의 유의적인 거래 등)이다."}, "t179": {"kw": ["고유위험요소가 왜곡표시의 발생가능성과 왜곡표시가 발생했을 때 그 규모의 결합에 영향을 미치는 정도로 인하여 고유위험의 평가가 고유위험의 범위의 상단에 가까운 것으로 식별된 중요왜곡표시위험", "타 감사기준서의 요구사항에 따라 유의적 위험으로 다루는 위험"], "ans": "유의적 위험이란 ①고유위험요소가 왜곡표시의 발생가능성과 왜곡표시가 발생했을 때 그 규모의 결합에 영향을 미치는 정도로 인하여, 고유위험의 평가가 고유위험의 범위의 상단에 가까운 것으로 식별된 중요왜곡표시위험, 또는 ②타 감사기준서의 요구사항에 따라 유의적 위험으로 다루는 위험을 말한다. 예를 들어 감사기준서 240에서는 부정으로 인한 중요왜곡표시위험을 유의적 위험으로 취급하도록 하고, 감사기준서 550에서는 정상적인 사업과정을 벗어난 유의적인 특수관계자 거래를 유의적 위험으로 취급하도록 하고 있다."}, "t180": {"kw": ["복잡성이 높은 거래", "비경상적이거나 비반복적인 거래", "경영진의 유의적인 판단이나 추정이 개입되는 사항", "변화(사업환경·회계기준 등)로 인한 위험"], "ans": "유의적 위험으로 결정될 수 있는 중요왜곡표시위험이 발생할 수 있는 상황은 ①복잡성이 높은 거래, ②정상적인 사업과정을 벗어난 비경상적이거나 비반복적인 거래, ③측정의 불확실성이 큰 회계추정치 등 경영진의 유의적인 판단이나 추정이 개입되는 사항, ④사업환경이나 회계기준의 변화로 인한 위험 등이다."}, "t181": {"kw": ["업무팀원 간의 토의내용 및 도달된 유의적 결정사항", "감사인의 이해의 주요 요소, 감사인이 이해를 얻은 정보의 원천, 그리고 수행한 위험평가절차", "식별된 통제의 설계에 대한 평가와 그러한 통제가 실행되었는지에 여부에 대한 결정", "식별되고 평가된 재무제표 수준과 경영진주장 수준의 중요왜곡표시위험"], "ans": "위험평가절차와 관련하여 문서화할 사항은 ①업무팀원 간의 토의내용 및 도달된 유의적 결정사항, ②감사인의 이해의 주요 요소·감사인이 이해를 얻은 정보의 원천 그리고 수행한 위험평가절차, ③식별된 통제의 설계에 대한 평가와 그러한 통제가 실행되었는지 여부에 대한 결정, ④식별되고 평가된 재무제표 수준과 경영진주장 수준의 중요왜곡표시위험이다."}, "t182": {"kw": ["보다 경험이 풍부하거나 특수한 기술을 보유한 인력을 배정하거나 전문가를 활용함", "전반감사전략이나 계획된 감사절차의 변경(수행중요성 결정·통제테스트 감사증거의 전반성·실증절차의 성격·시기 및 범위에 대한 변경 포함)", "수행될 추가감사절차를 선택할 때 예측이 불가능한 요소를 추가로 반영함", "업무팀이 전문가적 의구심을 유지할 필요성을 강조함", "업무팀원들에 대한 지시와 감독과 수행한 업무에 대한 검토의 성격·범위 및 시기를 변경함"], "ans": "재무제표 수준의 중요왜곡표시위험에 대한 대응절차는 ①보다 경험이 풍부하거나 특수한 기술을 보유한 인력을 배정하거나 전문가를 활용하고, ②전반감사전략이나 계획된 감사절차(감사계획)의 변경(수행중요성의 결정·통제테스트 감사증거의 전반성·실증절차의 성격·시기 및 범위에 대한 변경 포함), ③수행될 추가감사절차를 선택할 때 예측이 불가능한 요소를 추가로 반영하며, ④업무팀이 전문가적 의구심을 유지할 필요성을 강조하고, ⑤업무팀원들에 대한 지시와 감독과 수행한 업무에 대한 검토의 성격·범위 및 시기를 변경하는 것이다."}, "t183": {"kw": ["실증절차를 통제(성격)보다 확대된 감사증거를 입수함(범위)", "기중보다 보고기간말에 더 많은 감사절차를 수행함(시기)", "감사범위에 포함되는 사업장의 수를 확대함(범위)"], "ans": "통제환경이 효과적이지 않은 경우(통제위험이 높은 경우) 재무제표 수준의 대응은 ①실증절차를 통제보다 확대된 감사증거를 입수하고(성격), ②기중보다 보고기간말에 더 많은 감사절차를 수행하며(시기), ③감사범위에 포함되는 사업장의 수를 확대하는 것(범위)이다. 반면 통제환경이 효과적인 경우(통제위험이 낮은 경우)에는 기업의 내부통제와 기업 내부에서 생성된 감사증거를 보다 신뢰할 수 있으므로 일부 실증절차를 당기중에 수행할 수 있다."}, "t184": {"kw": ["보다 신뢰할 수 있거나 관련성이 있는 감사증거를 입수함", "추가적인 확인적 정보를 입수하기 위하여 변경함(문서에 대한 조사에 추가하여 계약 상대방에게 계약조건의 완전성에 대하여 확인)"], "ans": "경영진주장 수준에서 중요왜곡표시위험이 높은 경우 추가감사절차의 성격 측면의 대응은 ①보다 신뢰할 수 있거나 관련성이 있는 감사증거를 입수하고, ②추가적인 확인적 정보를 입수하기 위하여 변경하는 것이다(문서에 대한 조사에 추가하여 계약 상대방에게 계약조건의 완전성에 대하여 확인). 수익과 관련된 경영진주장에서 완전성 주장에 대한 대응은 통제테스트, 발생사실 주장에 대한 대응은 실증절차가 상대적으로 효과적이다."}, "t185": {"kw": ["보고기간말 또는 보고기간말에 근접한 때에 실증절차를 수행함", "불시에 또는 예측불가능한 시기에 감사절차를 수행함"], "ans": "경영진주장 수준에서 중요왜곡표시위험이 높은 경우 추가감사절차의 시기 측면의 대응은 ①보고기간말 또는 보고기간말에 근접한 때에 실증절차를 수행하고, ②불시에 또는 예측불가능한 시기에 감사절차를 수행하는 것이다."}, "t186": {"kw": ["표본규모를 확대함", "보다 세부적인 수준에서 분석적절차를 수행함"], "ans": "경영진주장 수준에서 중요왜곡표시위험이 높은 경우 추가감사절차의 범위 측면의 대응은 ①표본규모를 확대하고, ②보다 세부적인 수준에서 분석적절차를 수행하는 것이다. 컴퓨터를 이용한 감사기법의 적용은 전자형태의 거래파일과 계정파일에 대한 보다 광범위한 테스트를 가능하게 한다."}, "t187": {"kw": ["감사인이 중요한 감사분야(중요왜곡표시위험)에 적합한 주의를 기울임", "감사인이 잠재적 문제(중요왜곡표시위험)를 적시(즉시×)에 식별하고 해결함", "감사인이 감사업무를 적절히 조직화하고 관리함으로써 효율적이고 효과적인 감사의 수행이 가능함", "예상되는 위험에 대응하기 위해 적합한 수준의 역량과 적격성을 갖춘 업무팀원을 선정하고 적절하게 업무를 배정하는 것에 도움을 줌"], "ans": "계획수립의 효익은 ①감사인이 중요한 감사분야(중요왜곡표시위험)에 적합한 주의를 기울이고, ②감사인이 잠재적 문제(중요왜곡표시위험)를 적시(즉시가 아님)에 식별하고 해결하며, ③감사인이 감사업무를 적절히 조직화하고 관리함으로써 효율적이고 효과적인 감사의 수행이 가능하고, ④예상되는 위험에 대응하기 위해 적합한 수준의 역량과 적격성을 갖춘 업무팀원을 선정하고 적절하게 업무를 배정하는 것에 도움을 주는 것이다."}, "t188": {"kw": ["이들의 경험과 식견을 이용할 수 있음", "이에 따라 계획수립의 효과성과 효율성이 높아짐"], "ans": "감사계획의 수립시 업무수행이사와 주요업무팀원들이 참여할 경우의 효익은 ①이들의 경험과 식견을 이용할 수 있고, ②이에 따라 계획수립의 효과성과 효율성이 높아진다는 것이다."}, "t189": {"kw": ["계획수립은 전기감사의 종료직후부터 시작하여 당기감사가 끝날 때까지 진행되는 연속적이고 반복적인 과정임", "감사인은 감사의 진행 중 필요에 따라 전반감사전략과 감사계획을 갱신하고 변경해야 함"], "ans": "계획수립의 시기와 관련한 유의사항은 ①계획수립은 감사에 있어서 따로 분리된 단계가 아니라 전기감사의 종료직후부터 시작하여 당기감사가 끝날 때까지 진행되는 연속적이고 반복적인 과정이며, ②감사인은 감사의 진행 중 필요에 따라 전반감사전략과 감사계획을 갱신하고 변경해야 한다는 것이다."}, "t190": {"kw": ["중요성의 결정", "위험평가절차로서 적용될 분석적절차", "기타 위험평가절차의 수행(질문·관찰·검사 등)", "기업에 적용되는 법규 및 기업이 그러한 법규를 어떻게 준수하는지에 대한 개괄적인 이해", "전문가의 참여"], "ans": "중요왜곡표시위험을 식별하고 평가하기 전에 계획수립이 완료되어야 하는 사항은 ①중요성의 결정, ②위험평가절차로서 적용될 분석적절차, ③기타 위험평가절차의 수행(질문·관찰·검사 등), ④기업에 적용되는 법규 및 기업이 그러한 법규를 어떻게 준수하는지에 대한 개괄적인 이해, ⑤전문가의 참여이다."}, "t191": {"kw": ["감사범위를 정의하게 될 해당 감사업무의 특성을 식별함", "감사일정을 계획하기 위하여 해당업무의 보고목적을 확인하며 요구되는 커뮤니케이션의 성격을 확인함", "감사인의 전문가적 판단에 따라 업무팀의 업무방향을 설정하는 데 유의적이라고 판단되는 요소들을 고려함", "감사업무의 예비적 활동의 결과를 고려함", "해당감사를 수행하는 데 필요한 자원의 성격·시기 및 범위를 확인함"], "ans": "전반감사전략을 수립하는 경우 수행해야 할 절차는 ①감사범위를 정의하게 될 해당 감사업무의 특성을 식별하고(포함될 사업부문의 수·소재지 등 예상되는 감사범위·재무보고체계·사용되는 보고통화 등 고려), ②감사일정을 계획하기 위하여 해당업무의 보고목적을 확인하며 요구되는 커뮤니케이션의 성격을 확인하고(중간보고 또는 최종단계의 보고와 같은 기업의 보고일정·발행될 보고서의 예상형태와 시기 등 고려), ③감사인의 전문가적 판단에 따라 업무팀의 업무방향을 설정하는 데 유의적이라고 판단되는 요소들을 고려하며(중요성의 결정·중요왜곡표시위험이 보다 크게 존재할 수 있는 분야의 예비적 식별 등), ④감사업무의 예비적 활동의 결과를 고려하고, ⑤해당감사를 수행하는 데 필요한 자원의 성격·시기 및 범위를 확인하는 것이다(업무팀의 구성·업무팀원에 대한 감사업무의 배정·업무예산의 수립 등)."}, "t192": {"kw": ["특정감사분야에 배치할 자원(성격)", "자원의 배치시기(시기)", "특정감사분야에 할당할 자원의 양(범위)", "자원을 관리·지휘 및 감독하는 방법"], "ans": "위험평가절차가 완료된 후의 전반감사전략의 수립과정이 도움을 주는 결정사항은 ①특정감사분야에 배치할 자원(성격), ②자원의 배치시기(시기), ③특정감사분야에 할당할 자원의 양(범위), ④자원을 관리·지휘 및 감독하는 방법이다."}, "t193": {"kw": ["위험평가절차의 성격·시기 및 범위에 대한 계획", "경영진주장 수준에서의 추가감사절차의 성격·시기 및 범위에 대한 계획", "해당 감사를 감사기준에 따라 수행하기 위해 요구되는 기타의 감사절차에 대한 계획"], "ans": "세부감사계획에 포함되어야 하는 사항은 ①위험평가절차의 성격·시기 및 범위에 대한 계획, ②경영진주장 수준에서의 추가감사절차의 성격·시기 및 범위에 대한 계획, ③해당 감사를 감사기준에 따라 수행하기 위해 요구되는 기타의 감사절차에 대한 계획이다."}, "t194": {"kw": ["최초 선임시 경영진과 논의되었던 쟁점들(회계기준 또는 감사기준의 적용 등), 이러한 쟁점에 대한 지배기구와의 커뮤니케이션 및 해당 사항이 전반감사전략과 감사계획에 미치는 영향", "기초잔액에 관한 충분하고 적합한 감사증거를 입수하기 위해 필요한 감사절차", "법규에서 금지되지 않는 한 전임감사인의 감사조서 검토 등 전임감사인과 협의할 사항", "초도감사에 대하여 해당 회계법인의 품질관리시스템이 요구하는 절차(초도감사업무를 품질관리검토대상에 포함)"], "ans": "초도감사시 전반감사전략과 세부감사계획을 수립할 때 고려할 사항은 ①최초 선임시 경영진과 논의되었던 쟁점들(회계기준 또는 감사기준의 적용 등), 이러한 쟁점에 대한 지배기구와의 커뮤니케이션 및 해당 사항이 전반감사전략과 감사계획에 미치는 영향, ②기초잔액에 관한 충분하고 적합한 감사증거를 입수하기 위해 필요한 감사절차, ③법규에서 금지되지 않는 한 전임감사인의 감사조서 검토 등 전임감사인과 협의할 사항, ④초도감사에 대하여 해당 회계법인의 품질관리시스템이 요구하는 절차(초도감사업무를 품질관리검토대상에 포함)이다."}, "t195": {"kw": ["기업의 전략방향을 감독할 책임과 기업의 수탁책임을 감시할 의무가 있는 사람이나 조직", "일반적으로 이사회가 지배기구가 되며 감사위원회는 지배기구 내의 하위그룹에 해당", "지배기구는 경영진을 감독하고 감시해야 하므로 경영진과 독립적이어야 함"], "ans": "지배기구란 기업의 전략방향을 감독할 책임과 기업의 수탁책임을 감시할 의무가 있는 사람이나 조직을 말한다. 일반적으로 이사회가 지배기구가 되며 감사위원회는 지배기구 내의 하위그룹에 해당한다. 지배기구는 경영진을 감독하고 감시해야 하므로 경영진과 독립적이어야 한다."}, "t196": {"kw": ["재무제표감사와 관련된 감사인의 책임", "감사시기와 범위에 대한 계획(개요)", "감사에서 유의적 발견사항", "감사인의 독립성(상장기업)", "지배기구와 반드시 서면으로 커뮤니케이션해야 하는 사항"], "ans": "지배기구와 커뮤니케이션할 사항은 ①재무제표감사와 관련된 감사인의 책임, ②감사시기와 범위에 대한 계획(개요), ③감사에서 유의적 발견사항, ④감사인의 독립성(상장기업의 경우)이다."}, "t197": {"kw": ["부정이나 오류로 인한 유의적인 중요왜곡표시위험에 대처하기 위해 감사인이 계획하는 방법", "중요왜곡표시위험이 높게 평가된 분야에 대처하기 위해 감사인이 계획하는 방법", "감사와 관련 있는 내부통제에 대한 감사인의 접근방식", "감사상 중요성 개념의 적용 등"], "ans": "감사시기와 범위에 대한 계획(개요)의 커뮤니케이션에는 다음 사항들이 포함될 수 있다(필수 아님). ①부정이나 오류로 인한 유의적인 중요왜곡표시위험에 대처하기 위해 감사인이 계획하는 방법, ②중요왜곡표시위험이 높게 평가된 분야에 대처하기 위해 감사인이 계획하는 방법, ③감사와 관련 있는 내부통제에 대한 감사인의 접근방식, ④감사상 중요성 개념의 적용 등이다. 다만 감사절차의 성격이나 시기에 대하여 상세하게 커뮤니케이션하는 것은 감사절차를 지나치게 예측가능하게 함으로써 그러한 절차의 효과성을 감소시킬 수 있으므로 주의해야 한다."}, "t198": {"kw": ["회계정책과 회계추정 및 재무제표 공시 등 해당 기업 회계실무의 유의적 질적 측면에 대한 감사인의 견해", "감사 중 직면한 유의적 어려움이 있다면 그 내용", "경영진과 논의하였거나 서신을 교환하였던 유의적인 사항 및 감사인이 요청하고 있는 서면진술", "감사보고서의 형태와 내용에 영향을 미치는 상황", "감사 중 발생한 기타 유의적 사항으로서 재무보고절차의 감시와 관련성이 있는 사항"], "ans": "감사에서 유의적 발견사항의 커뮤니케이션 사항은 ①회계정책과 회계추정 및 재무제표 공시 등 해당 기업 회계실무의 유의적 질적 측면에 대한 감사인의 견해, ②감사 중 직면한 유의적 어려움이 있다면 그 내용, ③지배기구의 모든 구성원이 그 기업의 경영에 참여하고 있지 않는 한 감사 중 발생하여 경영진과 논의하였거나 서신을 교환하였던 유의적인 사항(내부통제의 유의적 미비점 포함) 및 감사인이 요청하고 있는 서면진술, ④감사보고서의 형태와 내용에 영향을 미치는 상황, ⑤감사 중 발생한 기타 유의적 사항으로서 감사인의 전문가적 판단에 비추어 볼 때 재무보고절차의 감시와 관련성이 있는 사항이다."}, "t199": {"kw": ["상장기업(비상장법인 아님)의 감사인이 커뮤니케이션", "업무팀·회계법인의 타 구성원·회계법인은 독립성에 대한 관련 윤리적 요구사항들을 준수하고 있다고 진술함", "감사인의 전문가적 판단에 따라 회계법인·네트워크 회계법인 그리고 기업 사이에 독립성 문제와 관련된다고 합리적으로 판단되는 모든 관계와 기타사항들", "식별된 독립성 훼손위협을 제거하거나 수용가능한 수준으로 감소시키기 위해 적용한 관련 제도적 안전장치"], "ans": "감사인의 독립성에 관한 커뮤니케이션은 상장기업(비상장법인이 아님)의 감사인이 다음 사항을 지배기구와 커뮤니케이션해야 한다. ①업무팀·회계법인의 타 구성원·회계법인은 독립성에 대한 관련 윤리적 요구사항들을 준수하고 있다고 진술하고, ②감사인의 전문가적 판단에 따라 회계법인·네트워크 회계법인 그리고 기업 사이에 독립성 문제와 관련된다고 합리적으로 판단되는 모든 관계와 기타사항들, ③식별된 독립성 훼손위협을 제거하거나 수용가능한 수준으로 감소시키기 위해 적용한 관련 제도적 안전장치를 커뮤니케이션한다."}, "t200": {"kw": ["감사대상회사가 주권상장법인일 경우 감사인의 독립성", "내부통제의 유의적 미비점"], "ans": "지배기구와 반드시 서면으로 커뮤니케이션하여야 하는 사항은 ①감사대상회사가 주권상장법인일 경우 감사인의 독립성과 ②내부통제의 유의적 미비점이다."}, "t201": {"kw": ["감사범위와 시기의 계획: 종종 감사업무 초반에 이루어짐(초도감사는 감사업무 조건 합의과정의 일부로 이루어질 수도 있음)", "감사에서 발견된 사항: 최종 토의의 일부로서 이루어질 수도 있음", "유의적 어려움: 실행가능한 한 가급적 조기에 커뮤니케이션", "감사인의 독립성: 독립성에 대한 위협 및 관련 안전장치에 대한 유의적 판단이 수행될 때(비감사서비스 제공 업무 수임시 혹은 최종 토의시)마다 실시"], "ans": "지배기구와의 커뮤니케이션에 대한 적절한 시기의 예는 다음과 같다. ①감사범위와 시기의 계획에 대한 커뮤니케이션은 종종 감사업무 초반에 이루어지며, 초도감사의 경우에는 감사업무 조건에 대한 합의과정의 일부로서 이루어질 수도 있다. ②기업 회계실무의 질적측면에 대한 감사인의 견해를 포함하여 감사에서 발견된 사항에 대한 커뮤니케이션은 최종 토의의 일부로서 이루어질 수도 있다. ③감사 중 감사인이 유의적 어려움에 직면한 상황에서는 실행가능한 한 가급적 조기에 커뮤니케이션하는 것이 적합하다. ④감사인의 독립성에 관한 커뮤니케이션은 독립성에 대한 위협 및 관련 안전장치에 대한 유의적 판단이 수행될 때(비감사서비스를 제공하는 업무를 수임할 때 혹은 최종 토의시)마다 실시하는 것이 적합하다."}, "t202": {"kw": ["감사인이 지배기구로부터 감사와 관련된 정보를 입수함", "지배기구가 재무보고절차를 감시하는 책임을 완수함으로써 재무제표의 중요왜곡표시위험을 감소시킴", "감사인과 지배기구가 감사에 관련된 사항을 이해하고 건설적인 업무관계를 수립함"], "ans": "감사인과 지배기구간의 효과적인 커뮤니케이션이 주는 효익은 ①감사인이 지배기구로부터 감사와 관련된 정보를 입수하고, ②지배기구가 재무보고절차를 감시하는 책임을 완수함으로써 재무제표의 중요왜곡표시위험을 감소시키며, ③감사인과 지배기구가 감사에 관련된 사항을 이해하고 건설적인 업무관계를 수립하는 것이다."}, "t203": {"kw": ["감사위원회의 위원장 및 관련되는 경우 하고, 만약 그렇다면 기업의 위험평가절차가 해당 중요왜곡표시위험을 식별하지 못한 이유에 대하여 이해함", "기업의 위험평가절차와 관련하여 평가할 사항에 대한 감사인의 평가에 대한 시사점을 고려함"], "ans": "경영진이 식별하지 못한 중요왜곡표시위험을 감사인이 식별한 경우 수행절차는 ①해당 위험이 기업의 위험평가절차에서 식별될 것으로 기대하였던 종류의 위험인지 결정하고 만약 그렇다면 기업의 위험평가절차가 해당 중요왜곡표시위험을 식별하지 못한 이유에 대하여 이해하고, ②기업의 위험평가절차와 관련하여 평가할 사항에 대한 감사인의 평가에 대한 시사점을 고려하는 것이다."}, "t210": {"kw": ["은행계정조정이 적시에 작성되고 있는지 여부에 대한 경영진의 검토", "영업사원의 판매계약조건에 관한 정책의 준수 여부에 대한 내부감사인의 평가", "기업의 윤리정책이나 기업실무정책의 준수 여부에 대한 법률부서의 감시"], "ans": "내부통제시스템에 대한 기업의 모니터링 절차의 예는 ①은행계정조정이 적시에 작성되고 있는지 여부에 대한 경영진의 검토, ②영업사원의 판매계약조건에 관한 정책의 준수 여부에 대한 내부감사인의 평가, ③기업의 윤리정책이나 기업실무정책의 준수 여부에 대한 법률부서의 감시이다."}, "t211": {"kw": ["통제의 효과성 모니터링과 식별된 통제 미비점에 대한 식별과 개선을 위한 상시적인 평가 및 별도의 평가", "내부감사기능이 있는 경우 기업의 내부감사 기능(그 성격·책임 및 활동 포함)", "내부통제시스템을 모니터링하는 기업의 절차에서 사용되는 정보의 원천과 경영진이 해당 정보를 목적상 충분히 신뢰성이 있는 정보라고 생각하는 근거"], "ans": "내부통제시스템에 대한 기업의 모니터링 절차와 관련하여 이해할 사항은 ①통제의 효과성 모니터링과 식별된 통제 미비점에 대한 식별과 개선을 위한 상시적인 평가 및 별도의 평가와 내부감사기능이 있는 경우 기업의 내부감사 기능(그 성격·책임 및 활동 포함)을 다루는 기업의 절차의 측면들, ②내부통제시스템을 모니터링하는 기업의 절차에서 사용되는 정보의 원천과 경영진이 해당 정보를 목적상 충분히 신뢰성이 있는 정보라고 생각하는 근거이다."}, "t212": {"kw": ["기업의 성격과 복잡성을 고려하였을 때", "기업의 (내부통제시스템에 대한) 모니터링 절차가 기업의 상황에 적합한지 여부"], "ans": "내부통제시스템에 대한 기업의 모니터링 절차와 관련하여 평가할 사항은, 기업의 성격과 복잡성을 고려하였을 때 기업의 모니터링 절차가 기업의 상황에 적합한지 여부이다."}, "t213": {"kw": ["유의적인 거래유형·계정잔액 및 공시에 대한 기업의 정보처리활동을 이해함", "기업이 재무제표 작성과 관련 보고 책임을 뒷받침하는 유의적 사항들을 정보시스템과 내부통제시스템의 기타 구성요소에서 커뮤니케이션을 하는 방법을 이해함(기업 내 사람들 간의 커뮤니케이션, 경영진과 지배기구 간의 커뮤니케이션, 규제당국과 같은 외부 제삼자와의 커뮤니케이션)"], "ans": "정보시스템 및 커뮤니케이션과 관련하여 이해할 사항은 ①유의적인 거래유형·계정잔액 및 공시에 대한 기업의 정보처리활동을 이해하고, ②기업이 재무제표 작성과 관련 보고 책임을 뒷받침하는 유의적 사항들을 정보시스템과 내부통제시스템의 기타 구성요소에서 커뮤니케이션을 하는 방법을 이해하는 것이다. 여기에는 ㉠재무보고 역할과 책임이 커뮤니케이션되는 방법을 포함한 기업 내 사람들 간의 커뮤니케이션, ㉡경영진과 지배기구 간의 커뮤니케이션, ㉢규제당국과 같은 외부 제삼자와의 커뮤니케이션이 포함된다."}, "t214": {"kw": ["기업의 정보시스템 및 커뮤니케이션이", "해당 재무보고체계에 따른 기업의 재무제표 작성을 적절하게 뒷받침하는지 여부"], "ans": "정보시스템 및 커뮤니케이션과 관련하여 평가할 사항은, 기업의 정보시스템 및 커뮤니케이션이 해당 재무보고체계에 따른 기업의 재무제표 작성을 적절하게 뒷받침하는지 여부이다."}, "t215": {"kw": ["[식별] 유의적 위험으로 결정된 위험에 대처하는 통제, 비반복적이고 일상적이지 않은 거래나 조정에 사용되는 비표준적인 분개에 대한 통제, 감사인이 실증테스트의 성격·시기 및 범위를 결정하는 데 있어 운영효과성을 테스트하기로 계획한 통제, 기타 통제, IT 응용프로그램과 IT 환경의 기타 측면, IT 사용으로 인한 관련 위험과 그에 대처하는 정보기술 일반통제", "[평가·결정] 통제가 경영진주장 수준의 중요왜곡표시위험에 대처하기에 효과적으로 설계되었는지 또는 다른 통제의 운영을 지원하기에 효과적으로 설계되었는지 평가, 기업의 인원에 대한 질문에 추가된 절차를 수행함으로써 기업의 통제가 실행되었는지 여부를 결정"], "ans": "통제활동 구성요소를 이해하기 위하여 식별해야 할 통제는 ①유의적 위험으로 결정된 위험에 대처하는 통제, ②비반복적이고 일상적이지 않은 거래나 조정에 사용되는 비표준적인 분개에 대한 통제, ③감사인이 실증테스트의 성격·시기 및 범위를 결정하는 데 있어 운영효과성을 테스트하기로 계획한 통제, ④감사인이 문단 13의 목적을 충족하게 하는 데 적절하다고 판단한 기타 통제이며, 이를 바탕으로 IT 응용프로그램과 IT 환경의 기타 측면, IT 사용으로 인한 관련 위험과 그에 대처하는 정보기술 일반통제를 식별한다. 평가 및 결정할 사항은 ①통제가 경영진주장 수준의 중요왜곡표시위험에 대처하기에 효과적으로 설계되었는지 또는 다른 통제의 운영을 지원하기에 효과적으로 설계되었는지 여부를 평가하고, ②기업의 인원에 대한 질문에 추가된 절차를 수행함으로써 기업의 통제가 실행되었는지 여부를 결정하는 것이다."}, "t216": {"kw": ["권한부여와 승인", "업무분장", "물리적 또는 논리적 통제", "대사", "검증"], "ans": "통제활동 구성요소의 통제의 형태는 ①권한부여와 승인(거래가 유효하다는 것을 확인), ②업무분장(거래의 승인·기록·자산보관 책임을 서로 다른 사람에게 부여), ③물리적 또는 논리적 통제(승인되지 않은 접근·취득·사용 또는 처분으로부터 자산의 안전을 다루는 통제), ④대사(두 개 이상의 데이터 요소를 비교하여 차이가 식별되면 일치시키는 조치), ⑤검증(두 개 이상의 항목을 서로 비교하거나 한 항목을 정책과 비교)이다."}, "t217": {"kw": ["[부정] 경영진의 통제 무력화로 통제를 회피, 둘 이상의 사람이 공모로 통제를 회피", "[오류] 의사결정에서 인간의 판단이 잘못될 수 있음, 인간의 실수로 인해 기업의 내부통제시스템의 붕괴가 발생"], "ans": "내부통제시스템의 고유한계를 일으키는 원인은 다음과 같다. 부정으로 인한 것으로 ①경영진의 통제 무력화로 통제를 회피할 수 있고, ②둘 이상의 사람이 공모로 통제를 회피할 수 있다. 오류로 인한 것으로 ①의사결정에서 인간의 판단이 잘못될 수 있고, ②인간의 실수로 인해 기업의 내부통제시스템의 붕괴가 발생할 수 있다."}, "t218": {"kw": ["통제환경(Control environment)", "기업의 위험평가절차(Risk assessment)", "정보시스템과 커뮤니케이션(Information & communication)", "모니터링 절차(Monitoring)", "통제활동(control activities/Existing control)"], "ans": "내부통제시스템의 5가지 구성요소는 ①통제환경, ②기업의 위험평가절차, ③내부통제시스템에 대한 기업의 모니터링 절차, ④정보시스템과 커뮤니케이션, ⑤통제활동이다. 이 중 ①~③에 대한 감사인의 이해는 재무제표 수준의 중요왜곡표시위험의 식별과 평가에 좀 더 영향을 주고, ④~⑤에 대한 감사인의 이해는 경영진주장 수준의 중요왜곡표시위험의 식별과 평가에 좀 더 영향을 준다."}, "t219": {"kw": ["감사인이 경영진주장 수준의 중요왜곡표시위험을 평가할 때 통제가 효과적으로 운영되고 있다는 기대를 한 경우로서, 실증절차의 성격·시기 및 범위를 결정할 때 통제의 운영효과성을 테스트에 의존하려고 하는 경우(선택, 감사의 효율성)", "실증절차만으로는 경영진주장 수준의 충분하고 적합한 감사증거를 제공할 수 없는 경우(필수, 감사의 효과성)"], "ans": "통제테스트를 수행하는 상황은 ①감사인이 경영진주장 수준의 중요왜곡표시위험을 평가할 때 통제가 효과적으로 운영되고 있다는 기대를 한 경우로서 감사인이 실증절차의 성격·시기 및 범위를 결정할 때 통제의 운영효과성을 테스트에 의존하려고 하는 경우(선택, 감사의 효율성 측면), ②실증절차만으로는 경영진주장 수준의 충분하고 적합한 감사증거를 제공할 수 없는 경우(필수, 감사의 효과성 측면)이다."}, "t220": {"kw": ["질문", "관찰", "검사", "재수행"], "ans": "통제테스트에 사용되는 감사증거 입수방법은 ①질문, ②관찰, ③검사, ④재수행이다. 이 4가지 중 증거력은 재수행이 가장 높고 질문이 가장 낮다."}, "t221": {"kw": ["통제의 운영효과성에 대한 감사증거를 입수하기 위하여 감사대상 기간 중 관련 시기에 해당 통제가 적용된 방법·통제 적용의 수행자 또는 수단·통제의 일관된 적용이 포함된 질문과 더불어 기타의 감사절차(관찰·검사·재수행)를 수행함", "이미 대응되지 않는 한 테스트할 통제가 다른 통제(간접통제)에 의존하고 있는지 여부를 결정하고, 그렇다면 그러한 간접통제가 효과적으로 운영되고 있음을 뒷받침하는 감사증거를 입수할 필요가 있는지 여부를 결정함"], "ans": "통제테스트의 구체적인 수행절차는 다음과 같다. ①통제의 운영효과성에 대한 감사증거를 입수하기 위하여 ㉠감사대상 기간 중 관련 시기에 해당 통제가 적용된 방법(무슨 방법), ㉡통제 적용의 수행자(누가) 또는 수단, ㉢통제의 일관된 적용이 포함된 질문과 더불어 기타의 감사절차(관찰·검사·재수행)를 수행하고, ②이미 대응되지 않는 한 테스트할 통제가 다른 통제(간접통제)에 의존하고 있는지 여부를 결정하며, 만약 그렇다면 그러한 간접통제가 효과적으로 운영되고 있음을 뒷받침하는 감사증거를 입수할 필요가 있는지 여부를 결정한다."}, "t222": {"kw": ["동일한 유형의 감사절차가 이용되므로", "통제의 설계에 대한 평가 및 통제의 실행여부에 대한 결정과 동시에", "통제의 운영효과성을 테스트하는 것이 효율적이라고 결정할 수 있음"], "ans": "내부통제시스템의 이해와 통제테스트의 동시 수행에 대하여, 동일한 유형의 감사절차가 이용되므로 통제의 설계에 대한 평가 및 통제의 실행여부에 대한 결정과 동시에 통제의 운영효과성을 테스트하는 것이 효율적이라고 결정할 수 있다."}, "t223": {"kw": ["중간기간 이후 해당 통제에 유의적 변화가 있었는지에 대하여 감사증거를 입수함", "잔여기간에 대하여 입수할 추가적인 감사증거를 결정함"], "ans": "중간기간에 통제테스트를 수행한 경우 잔여기간에 대해 수행할 절차는 ①중간기간 이후 해당 통제에 유의적 변화가 있었는지에 대하여 감사증거를 입수하고, ②잔여기간에 대하여 입수할 추가적인 감사증거를 결정하는 것이다."}, "t224": {"kw": ["통제환경", "잔여기간의 정도", "중간기간에 테스트하였던 특정 통제 및 정보시스템·절차·담당자의 변경 등 테스트 이후 특정 통제의 유의적 변경", "경영진주장 수준의 평가된 중요왜곡표시위험의 유의성", "감사인이 후속실증절차를 감소시키기 위해 통제에 의존하려는 정도", "통제의 운영효과성에 대한 감사증거의 입수 정도"], "ans": "잔여기간의 통제에 대해 어떤 추가적인 감사증거를 입수할지 결정할 때 고려사항은 ①통제환경, ②잔여기간의 정도, ③중간기간에 테스트하였던 특정 통제 및 정보시스템·절차·담당자의 변경 등 테스트 이후 특정 통제의 유의적 변경, ④경영진주장 수준의 평가된 중요왜곡표시위험의 유의성, ⑤감사인이 후속실증절차를 감소시키기 위해 통제에 의존하려는 정도, ⑥통제의 운영효과성에 대한 감사증거의 입수 정도이다."}, "t225": {"kw": ["통제환경·기업의 통제 모니터링 그리고 기업의 위험평가 절차 등 내부통제의 다른 요소들의 효과성", "정보기술 일반통제(응용통제 아님)의 효과성", "중요왜곡표시위험과 통제에 대한 의존 정도", "통제가 수작업에 의하고 있는지 또는 자동화되어 있는지 여부 등 통제의 특성에서 발생되는 위험", "통제의 적용과 관련하여 이전의 감사에서 발견된 이탈의 성격과 범위 그리고 통제의 적용에 유의적인 영향을 미치는 담당자의 변화가 있었는지 등 통제와 통제를 적용할 때의 효과성", "특정 통제의 변화가 결여되어 주변 상황이 변화하면 위험이 초래될 가능성이 있는지 여부"], "ans": "이전의 통제테스트 감사증거를 활용하는 것이 적절한지 여부를 결정할 때 고려하여야 하는 사항은 ①통제환경·기업의 통제 모니터링 그리고 기업의 위험평가 절차 등 내부통제의 다른 요소들의 효과성, ②정보기술 일반통제(응용통제가 아님)의 효과성, ③중요왜곡표시위험과 통제에 대한 의존 정도, ④통제가 수작업에 의하고 있는지 또는 자동화되어 있는지 여부 등 통제의 특성에서 발생되는 위험, ⑤통제의 적용과 관련하여 이전의 감사에서 발견된 이탈의 성격과 범위 그리고 통제의 적용에 유의적인 영향을 미치는 담당자의 변화가 있었는지 등 통제와 통제를 적용할 때의 효과성, ⑥특정 통제의 변화가 결여되어 주변 상황이 변화하면 위험이 초래될 가능성이 있는지 여부이다."}, "t226": {"kw": ["통제환경 등 내부통제의 다른 요소들의 효과성", "정보기술 일반통제의 효과성", "중요왜곡표시위험과 통제에 대한 의존 정도", "통제가 수작업인지 자동화인지 등 통제의 특성에서 발생되는 위험", "이전 감사에서 발견된 이탈의 성격과 범위 및 담당자 변화 등 통제 적용시의 효과성", "특정 통제의 변화가 결여되어 주변 상황 변화시 위험 초래 가능성 여부"], "ans": "통제테스트를 재수행하지 않아도 될 경과기간을 결정할 때 고려하여야 하는 사항은 ①통제환경·기업의 통제 모니터링·기업의 위험평가 절차 등 내부통제의 다른 요소들의 효과성, ②정보기술 일반통제의 효과성, ③중요왜곡표시위험과 통제에 대한 의존 정도, ④통제가 수작업에 의하고 있는지 자동화되어 있는지 여부 등 통제의 특성에서 발생되는 위험, ⑤통제의 적용과 관련하여 이전 감사에서 발견된 이탈의 성격과 범위 및 담당자의 변화가 있었는지 등 통제를 적용할 때의 효과성, ⑥특정 통제의 변화가 결여되어 주변 상황이 변화하면 위험이 초래될 가능성이 있는지 여부이다."}, "t227": {"kw": ["질문", "관찰", "검사(재수행 제외)"], "ans": "통제에 유의적인 변화의 발생여부와 이전의 통제테스트 감사증거가 계속적으로 관련성이 있는지를 확인하기 위하여 수행하는 감사기술은 ①질문, ②관찰, ③검사이며 재수행은 제외된다."}, "t228": {"kw": ["매 3회의 감사에 최소한 한번은 통제에 대한 테스트를 수행하여야 함(2회의 감사기간동안 생략 가능)", "매 보고기간의 감사마다 일부 통제에 대한 테스트는 반드시 수행하여야 함(전체를 생략하는 것은 불가)"], "ans": "통제에 유의적인 변화가 없는 경우 통제테스트를 수행하여야 하는 기간은 ①매 3회의 감사에 최소한 한번은 통제에 대한 테스트를 수행하여야 하며(2회의 감사기간동안 생략 가능), ②매 보고기간의 감사마다 일부 통제에 대한 테스트는 반드시 수행하여야 한다(전체를 생략하는 것은 불가)."}, "t229": {"kw": ["통제테스트를 수행한 결과가 해당 통제에 의존하는 것에 대한 적절한 근거를 제공하는지 여부(실증절차의 축소에 대한 근거 제공 여부)", "통제에 대한 추가적인 테스트가 필요한지 여부", "중요한 왜곡표시에 대한 위험에 대처하기 위하여 실증절차를 적용할 필요가 있는지 여부"], "ans": "통제의 이탈을 발견한 경우 구체적인 질문 후 결정해야 할 사항은 ①통제테스트를 수행한 결과가 해당 통제에 의존하는 것에 대한 적절한 근거를 제공하는지 여부(실증절차의 축소에 대한 근거 제공 여부), ②통제에 대한 추가적인 테스트가 필요한지 여부, ③중요한 왜곡표시에 대한 위험에 대처하기 위하여 실증절차를 적용할 필요가 있는지 여부이다."}, "t230": {"kw": ["미비점들에 대한 내역과 그러한 미비점들의 잠재적인 영향에 대한 설명", "지배기구와 경영진이 커뮤니케이션의 관점을 이해할 수 있도록 하는 충분한 정보(감사의 목적은 감사인이 재무제표에 대한 의견을 표명하는 것임, 감사는 내부통제의 효과성에 대한 의견표명이 목적이 아닌 해당 상황에 적합한 감사절차를 설계하기 위하여 재무제표 작성과 관련된 내부통제에 대한 고려를 포함하고 있음, 보고할 사항은 감사인이 지배기구에 보고할 만큼 충분히 중요하다고 결정한 미비점들인 유의적 미비점들로 제한됨)"], "ans": "내부통제의 유의적 미비점에 대한 서면커뮤니케이션에 포함되어야 하는 사항은 ①미비점들에 대한 내역과 그러한 미비점들의 잠재적인 영향에 대한 설명, ②지배기구와 경영진이 커뮤니케이션의 관점을 이해할 수 있도록 하는 충분한 정보이다. 특히 감사인은 ㉠감사의 목적은 감사인이 재무제표에 대한 의견을 표명하는 것이며, ㉡감사는 내부통제의 효과성에 대한 의견표명이 목적이 아닌 해당 상황에 적합한 감사절차를 설계하기 위하여 재무제표 작성과 관련된 내부통제에 대한 고려를 포함하고 있고, ㉢보고할 사항은 감사인이 감사 중에 식별한 미비점들로서 감사인이 지배기구에 보고할 만큼 충분히 중요하다고 결정한 미비점들(유의적 미비점들)로 제한됨을 설명하여야 한다."}, "t231": {"kw": ["이전의 커뮤니케이션의 진술 내용을 반복하더라도 당기에 다시 커뮤니케이션하여야 함", "경영진(적절한 경우 지배기구 포함)에게 해당 유의적 미비점이 시정되지 않은 이유에 대하여 질문할 수 있음", "합당한 설명 없이 시정조치를 취하지 않고 있는 것은 그 자체로서 유의적 미비점을 나타낼 수 있음"], "ans": "전기 이전에 커뮤니케이션한 유의적 미비점들이 시정되고 있지 않은 경우, ①이전의 커뮤니케이션의 진술 내용을 반복하더라도 당기에 다시 커뮤니케이션하여야 하고, ②경영진(적절한 경우 지배기구 포함)에게 해당 유의적 미비점이 시정되지 않은 이유에 대하여 질문할 수 있으며, ③합당한 설명 없이 시정조치를 취하지 않고 있는 것은 그 자체로서 유의적 미비점을 나타낼 수 있다."}, "t232": {"kw": ["어떠한 통제가 재무제표의 왜곡표시를 적시에 예방 또는 발견 및 수정할 수 없게 설계·실행 또는 운영되는 경우", "재무제표의 왜곡표시를 적시에 예방 또는 발견 및 수정하기 위해 필요한 통제가 누락된 경우"], "ans": "내부통제의 미비점이란 ①어떠한 통제가 재무제표의 왜곡표시를 적시에 예방 또는 발견 및 수정할 수 없게 설계·실행 또는 운영되는 경우, 또는 ②재무제표의 왜곡표시를 적시에 예방 또는 발견 및 수정하기 위해 필요한 통제가 누락된 경우를 말한다."}, "t233": {"kw": ["감사인의 전문가적 판단에 따라", "지배기구가 주의를 기울일 만큼 충분히 중요하다고 판단되는", "내부통제의 미비점 또는 미비점들의 결합"], "ans": "내부통제의 유의적 미비점이란 감사인의 전문가적 판단에 따라 지배기구가 주의를 기울일 만큼 충분히 중요하다고 판단되는 내부통제의 미비점 또는 미비점들의 결합을 말한다."}, "t234": {"kw": ["영업부서: 주문 접수시 보유수량 확인 후 판매지시서 작성·전달", "신용조사부서: 신규고객 신용평가 후 승인된 판매지시서 작성(영업부서와 구분)", "창고부서: 승인된 판매지시서에 따라 출고·재고수불부 기록", "선적부서: 재고자산과 판매지시서 일치 확인 후 선적서류 작성", "회계부서: 회계처리 및 대손승인은 독립부서, 정기적 채권조회로 래핑 적발", "대금청구부서: 관련서류 일치 확인 후 세금계산서 작성", "자금부서: 자동이체시스템·재정보증·직무순환·은행계정조정"], "ans": "매출과 대금회수거래와 관련한 주요 통제는 부서별로 다음과 같다. ①영업부서는 주문을 받으면 보유수량을 확인하여 판매지시서를 작성·전달하고, ②신용조사부서는 신규고객의 신용평가 후 승인된 판매지시서를 작성·전달하며(회수보다 매출실적에 관심이 많은 영업부서와 구분되는 것이 중요), ③창고부서는 승인된 판매지시서에 따라 출고하고 재고수불부에 기록하며, ④선적부서는 재고자산과 승인된 판매지시서의 일치를 확인한 후 선적서류를 작성하고, ⑤회계부서는 회계처리를 하되 대손 등은 법무부서 등 독립적 부서가 승인하고 정기적 채권조회로 래핑을 적발하며, ⑥대금청구부서는 관련서류 일치 확인 후 세금계산서를 작성하고, ⑦자금부서는 자동이체시스템·재정보증제도·직무순환제도·은행계정조정으로 자금을 관리한다."}, "t235": {"kw": ["구매요청부서: 부서장 승인을 얻은 구매요청서 작성", "구매부서: 가격·품질 기준으로 공급자 선정·구매주문서 발송(직무순환)", "검수부서: 물품 검수 후 검수보고서 작성", "창고부서: 검수 완료 물품 입고·재고수불부 기록", "회계부서: 회계처리(기록기능, 매입대금 지급 불가)", "지급결의부서: 관련서류 비교·검증 후 지급결의서 작성", "자금부서: 이중지급 방지·물리적 보안·보관업무 분리"], "ans": "매입과 대금지급거래와 관련한 주요 통제는 부서별로 다음과 같다. ①구매요청부서는 부서장의 승인을 얻은 구매요청서를 작성하고, ②구매부서는 가격과 품질에서 가장 좋은 조건의 공급자를 선정하여 구매주문서를 발송하며(직무순환제도 실시), ③검수부서는 물품을 검수하고 구매주문서와 인수증의 일치를 확인한 후 검수보고서를 작성하고, ④창고부서는 검수 완료 물품을 입고하고 재고수불부에 기록하며, ⑤회계부서는 회계처리를 하되 기록기능을 수행하므로 매입대금을 지급해서는 안 되고, ⑥지급결의부서는 관련서류를 비교·검증하고 승인된 지급결의서를 작성하며, ⑦자금부서는 이중지급을 방지하고 인감도장·어음·수표를 물리적 보안장치에 보관하며 관련 업무를 분리한다."}, "t236": {"kw": ["대손 등에 대해서는 법무부서 등 독립적인 부서가 대손승인(업무분장), 회계부서는 대손처리 기록만 수행", "매출채권잔액에 대해 정기적으로 거래처에 조회서를 발송하여 장부금액과 일치하는지 비교·검증하는 절차를 마련(래핑 적발)"], "ans": "매출과 대금회수거래에서 회계부서의 통제는 다음과 같다. ①관련서류에 근거하여 매출거래에 대한 회계처리를 하되, 자금부서는 보관기능이므로 회계부서가 자금을 수령하면 업무분장의 미비점에 해당하는 것에 유의해야 한다. ②대손 등에 대해서는 법무부서 등 독립적인 부서가 대손승인을 하고 회계부서는 대손처리에 대한 기록만 수행한다. ③매출채권잔액에 대해서는 정기적으로 거래처에 조회서를 발송하여 그 회신금액이 회사의 장부금액과 일치하는지 비교·검증하는 절차를 마련하여, 래핑(매출대금의 회수과정에서 시차를 이용하여 대금을 유용하는 부정행위)과 같은 매출채권의 횡령을 적발할 수 있도록 해야 한다."}, "t237": {"kw": ["관련부서로부터 수령한 구매주문서·승인된 판매지시서·선적서류·인수증이 서로 일치하는지 확인", "사전에 승인된 판매가격에 근거하여 세금계산서를 작성하여 고객에게 전달하고 관련부서에도 즉시 전달"], "ans": "매출과 대금회수거래에서 대금청구부서의 통제는, 관련부서로부터 수령한 구매주문서·승인된 판매지시서·선적서류·인수증이 서로 일치하는지 확인한 후 사전에 승인된 판매가격에 근거하여 세금계산서를 작성하여 고객에게 전달하고 관련부서에도 즉시 전달하는 것이다."}, "t238": {"kw": ["대금의 회수는 래핑 등의 부정을 예방하기 위해 가능한 한 자동이체시스템을 이용하고, 영업부서 직원이 직접 회수한 경우에는 반드시 동 일자에 입금하도록 함", "현금이나 예금은 부정 발생가능성이 크므로 보관업무를 담당하는 자에 대해 재정보증제도와 직무순환제도를 실시", "회사의 통장거래내역과 관련 장부가 일치하는지 확인하기 위하여 담당자 외의 제3자가 정기적으로 은행계정조정표를 작성"], "ans": "매출과 대금회수거래에서 자금부서의 통제는 다음과 같다. ①대금의 회수는 래핑 등의 부정을 예방하기 위해 가능한 한 자동이체시스템을 이용해야 하며, 영업부서의 직원이 고객으로부터 매출채권을 직접 회수한 경우에는 반드시 동 일자에 입금하도록 해야 한다. ②현금이나 예금은 부정이 발생할 가능성이 큰 자산이므로 현금이나 예금의 입·출금 관리업무 등 보관업무를 담당하는 자에 대해서는 재정보증제도와 직무순환제도를 실시해야 한다. ③회사의 통장거래내역과 관련 장부가 일치하는지 확인하기 위하여 담당자 외의 제3자가 정기적으로 은행계정조정표를 작성하여 회사자금의 유용여부를 확인할 필요가 있다."}, "t239": {"kw": ["공급자로부터 수령한 물품을 검수하고 구매주문서와 인수증이 일치하는지 확인한 후 검수보고서를 작성하여 관련부서에 즉시 전달", "검수부서가 구매주문서상의 수량과 실제 수량을 비교하여 보지 않고 그 수량이 일치한다고 검수보고서에 기재할 가능성이 있는 경우 구매주문서의 수량을 공란으로 할 수도 있으나, 공란형태로 구매주문서를 전달하는 것은 일반적인 절차라고 할 수는 없음"], "ans": "매입과 대금지급거래에서 검수부서의 통제는 다음과 같다. ①공급자로부터 수령한 물품을 검수하고 구매주문서와 인수증이 일치하는지 확인한 후 검수보고서를 작성하여 관련부서에 즉시 전달한다. ②검수부서가 구매주문서상의 수량과 실제 수량을 비교하여 보지 않고 그 수량이 일치한다고 검수보고서에 기재할 가능성이 있는 경우 구매주문서의 수량을 공란으로 하는 경우에 보다 효과적일 수 있으나, 공란형태로 구매주문서를 전달하는 것은 일반적인 절차라고 할 수는 없다."}, "t240": {"kw": ["구매요청서·구매주문서·검수보고서·인수증·공급자로부터 수령한 세금계산서 등을 비교·검증하고 승인된 지급결의서를 작성하여 자금부서에 즉시 전달", "지급결의서는 그 지급을 발생시킨 부서가 되는데, 원재료 등의 구매는 일반적으로 구매부서에서 수행하므로 구매부서가 지급결의부서가 되고, 급여 등의 경우 인사부서가 지급결의부서가 됨"], "ans": "매입과 대금지급거래에서 지급결의부서의 통제는 다음과 같다. ①구매요청서·구매주문서·검수보고서·인수증·공급자로부터 수령한 세금계산서 등을 비교·검증하고 승인된 지급결의서를 작성하여 자금부서에 즉시 전달한다. ②지급결의서는 그 지급을 발생시킨 부서가 되는데, 원재료 등의 구매는 일반적으로 구매부서에서 수행하므로 구매부서가 지급결의부서가 되고, 급여 등의 경우 인사부서가 지급결의부서가 된다."}, "t241": {"kw": ["매입대금을 결제하기 위하여 수표 또는 어음을 발행하고 이중지급을 방지하기 위하여 지급이 완료된 관련문서에 대해서는 지급필 도장을 찍어 별도로 보관", "인감도장과 어음·수표 미사용용지 및 받을어음 실물은 물리적 보안장치가 잘 되어 있는 곳에 보관하며 승인된 자만이 접근", "인감도장의 관리·어음·수표의 미사용용지의 관리 및 회계기록 등에 대한 업무는 반드시 분리"], "ans": "매입과 대금지급거래에서 자금부서의 통제는 다음과 같다. ①매입대금을 결제하기 위하여 수표 또는 어음을 발행하고 이중지급을 방지하기 위하여 지급이 완료된 관련문서에 대해서는 지급필 도장을 찍어 별도로 보관한다. ②인감도장과 어음·수표 미사용용지 및 받을어음 실물은 물리적 보안장치가 잘 되어 있는 곳에 보관해야 하며 승인된 자만이 접근한다. ③인감도장의 관리·어음·수표의 미사용용지의 관리 및 회계기록 등에 대한 업무는 반드시 분리되어야 한다."}, "t242": {"kw": ["사전에 정의된 사업규칙을 일관되게 적용하고 대량의 거래나 데이터를 처리하는 복잡한 계산을 수행함", "정보의 적시성·이용가능성·정확성을 강화함", "정보의 추가적인 분석을 도움", "기업의 활동과 기업의 정책 및 절차의 수행에 대한 모니터링 능력을 강화함", "통제가 우회될 위험을 감소시켜 줌", "IT 응용프로그램·데이터베이스·운영시스템에 대한 보안통제를 실행함으로써 효과적인 업무분장을 달성하는 능력을 강화함"], "ans": "IT가 내부통제시스템에 미치는 유용성은 ①사전에 정의된 사업규칙을 일관되게 적용하고 대량의 거래나 데이터를 처리하는 복잡한 계산을 수행하고, ②정보의 적시성·이용가능성·정확성을 강화하며, ③정보의 추가적인 분석을 돕고, ④기업의 활동과 기업의 정책 및 절차의 수행에 대한 모니터링 능력을 강화하며, ⑤통제가 우회될 위험을 감소시켜 주고, ⑥IT 응용프로그램·데이터베이스·운영시스템에 대한 보안통제를 실행함으로써 효과적인 업무분장을 달성하는 능력을 강화하는 것이다."}, "t243": {"kw": ["정보기술 직원이 할당된 업무를 수행하는 데 필요한 권한을 넘어 접근 권한을 얻어 업무분장이 무너짐", "승인되지 않거나 존재하지 않는 거래의 기록 또는 부정확한 거래의 기록을 포함하여 데이터가 파괴됨", "마스터파일 내 데이터의 승인받지 않은 변경", "데이터가 잠재적 손실 또는 필요한 데이터 접근 불능", "IT 응용프로그램 또는 IT 환경의 기타 측면에 대한 승인되지 않은 변경", "IT 응용프로그램 또는 IT 환경의 기타 측면에 대하여 필요한 변경의 실패", "부적절한 수동 개입"], "ans": "정보기술의 사용으로 인한 위험은 ①정보기술 직원이 할당된 업무를 수행하는 데 필요한 권한을 넘어 접근 권한을 얻어 업무분장이 무너지고, ②승인되지 않거나 존재하지 않는 거래의 기록 또는 부정확한 거래의 기록을 포함하여 데이터가 파괴되거나 데이터가 부적절하게 변경될 수 있는 데이터에 대한 승인되지 않은 액세스, ③마스터파일 내 데이터의 승인받지 않은 변경, ④데이터가 잠재적 손실 또는 필요한 데이터 접근 불능, ⑤IT 응용프로그램 또는 IT 환경의 기타 측면에 대한 승인되지 않은 변경, ⑥IT 응용프로그램 또는 IT 환경의 기타 측면에 대하여 필요한 변경의 실패, ⑦부적절한 수동 개입이다."}, "t244": {"kw": ["[IT부서(전산부서)] 프로그래밍(프로그래머, 프로그램 개발), 컴퓨터 운용(오퍼레이터·네트워크 관리자·시스템 분석가, 네트워크 관리·시스템 분석), 자료보관(DB관리자, DB의 유지와 접근관리)", "[이용자부서] 전산부서 외, 자료입력 및 출력"], "ans": "정보기술 일반통제와 관련된 업무분장은 다음과 같다. IT부서(전산부서)는 ①프로그래밍(해당자는 프로그래머, 기능은 프로그램 개발), ②컴퓨터 운용(해당자는 오퍼레이터·네트워크 관리자·시스템 분석가, 기능은 프로그램 작동·네트워크 관리·시스템 분석), ③자료보관(해당자는 DB관리자, 기능은 DB의 유지와 접근관리)으로 분장된다. 이용자부서는 전산부서 외의 인원으로서 자료입력 및 출력을 담당한다."}, "t245": {"kw": ["데이터베이스에 저장된 데이터의", "정확성과 일관성을 보장하는", "규칙이나 제약 조건"], "ans": "무결성이란 데이터베이스에 저장된 데이터의 정확성과 일관성을 보장하는 규칙이나 제약 조건을 말한다. 즉 정보의 완전성·정확성 및 유효성을 의미한다."}, "t246": {"kw": ["도메인 무결성: 열(Column) 값의 기본 값 또는 가능한 값들의 범위를 지정", "개체 무결성: 기본 키 열에 중복된 값이 존재해서는 안 되며 널(Null) 값을 가질 수 없음", "참조 무결성: 관련된 테이블의 행 간의 관계를 유효하게 하는 규칙으로, 참조되는 테이블 행은 이를 참조하는 참조키가 존재하는 한 삭제될 수 없음"], "ans": "무결성의 종류는 ①도메인 무결성(열 값의 기본 값 또는 가능한 값들의 범위를 지정할 수 있으며 데이터 형식을 통해 값들의 유형을 제한), ②개체 무결성(기본 키 열에 중복된 값이 존재해서는 안 되며, 기본 키를 구성하는 어떤 열도 널(Null) 값을 가질 수 없음), ③참조 무결성(관련된 테이블의 행 간의 관계를 유효하게 하는 규칙으로, 참조되는 테이블 행은 이를 참조하는 참조키가 존재하는 한 삭제될 수 없음)이다."}, "t247": {"kw": ["데이터베이스에서 감사인이 직접 데이터를 추출함", "회사가 적정하게 추출하는지를 입회하여 확인한 후 확인서를 담당자로부터 수령함"], "ans": "전표 데이터가 누락되지 않도록 조작된 전표 데이터가 추출될 위험을 감소시키기 위해 감사인은 다음 중 하나 이상의 감사절차를 수행한다. ①데이터베이스에서 감사인이 직접 데이터를 추출하거나, ②회사가 적정하게 추출하는지를 입회하여 확인한 후 확인서를 담당자로부터 수령한다."}, "t248": {"kw": ["고객에게 채권조회서 발송", "기말 매출채권 대사", "대손충당금의 적정성 평가"], "ans": "매출채권의 과대표시위험(또는 대손충당금 과소표시위험)이 높은 항목에 대해 고려할 수 있는 추가감사절차는 ①고객에게 채권조회서 발송, ②기말 매출채권 대사, ③대손충당금의 적정성 평가이다. 이 중 ①과 ②의 절차는 매출채권의 실재성을 확인하기 위한 절차이고, ③의 절차는 매출채권의 평가를 확인하기 위한 절차이다."}, "t249": {"kw": ["서비스조직이 제공하는 서비스의 성격과 그러한 서비스가 이용자기업에 미치는 유의성(이용자기업의 내부통제에 대한 영향 포함)", "서비스조직이 처리한 거래 또는 해당 조직에 의해 영향을 받는 계정이나 재무보고절차의 성격과 중요성", "서비스조직이 수행하는 활동과 이용자기업이 수행하는 활동의 상호작용 정도", "서비스조직이 수행하는 활동에 대한 관련 계약조건 등 이용자기업과 서비스조직간 관계의 성격"], "ans": "서비스조직의 서비스 및 통제와 관련하여 이해할 사항은 ①서비스조직이 제공하는 서비스의 성격과 그러한 서비스가 이용자기업에 미치는 유의성(이용자기업의 내부통제에 대한 영향 포함), ②서비스조직이 처리한 거래 또는 해당 조직에 의해 영향을 받는 계정이나 재무보고절차의 성격과 중요성, ③서비스조직이 수행하는 활동과 이용자기업이 수행하는 활동의 상호작용 정도, ④서비스조직이 수행하는 활동에 대한 관련 계약조건 등 이용자기업과 서비스조직간 관계의 성격이다."}, "t250": {"kw": ["입수가능한 경우 유형 1 또는 유형 2 보고서를 입수함", "특정 정보를 얻기 위하여 이용자기업을 통하여 서비스조직과 접촉함(전화 등)", "서비스조직을 방문하여 서비스조직의 관련 통제에 대하여 필요한 정보를 제공할 절차를 수행함", "타감사인이 수행한 업무를 활용하여 서비스조직의 통제에 대하여 필요한 정보를 제공할 절차를 수행함"], "ans": "이용자기업을 통해 서비스조직의 서비스 및 통제를 충분히 이해하지 못한 경우 추가수행절차는 ①입수가능한 경우 유형 1 또는 유형 2 보고서를 입수하고, ②특정 정보를 얻기 위하여 이용자기업을 통하여 서비스조직과 접촉하며(전화 등), ③서비스조직을 방문하여 서비스조직의 관련 통제에 대하여 필요한 정보를 제공할 절차를 수행하고, ④타감사인이 수행한 업무를 활용하여 서비스조직의 통제에 대하여 필요한 정보를 제공할 절차를 수행하는 것이다."}, "t251": {"kw": ["서비스조직의 통제에 대한 기술과 설계가 이용자기업 감사인의 감사목적에 적합한 일자 또는 적합한 기간에 대한 것인지 여부를 평가함", "서비스조직의 통제 이해를 위해 해당 보고서가 제공하는 증거의 충분성과 적합성을 평가함", "서비스조직에 의해 식별된 보충적인 이용자기업 통제가 이용자기업과 관련성이 있는지 여부를 결정하고, 관련성이 있다면 이용자기업이 그러한 통제를 설계하였고 실행(운영 아님)하였는지 여부를 이해함"], "ans": "제공되는 서비스를 이해하기 위해 유형 1·2 보고서를 이용할 경우 추가절차는 ①서비스조직의 통제에 대한 기술과 설계가 이용자기업 감사인의 감사목적에 적합한 일자 또는 적합한 기간에 대한 것인지 여부를 평가하고, ②서비스조직의 통제 이해를 위해 해당 보고서가 제공하는 증거의 충분성과 적합성을 평가하며, ③서비스조직에 의해 식별된 보충적인 이용자기업 통제가 이용자기업과 관련성이 있는지 여부를 결정하고 관련성이 있다면 이용자기업이 그러한 통제를 설계하였고 실행하였는지 여부를 이해하는 것이다."}, "t252": {"kw": ["서비스감사인의 전문가적 적격성 및 서비스조직으로부터의 독립성", "발행된 유형 1 또는 유형 2 보고서에 적용된 기준의 적절성"], "ans": "유형 1·2 보고서가 제공하는 증거의 충분성과 적합성 결정시 만족하여야 할 사항은 ①서비스감사인의 전문가적 적격성 및 서비스조직으로부터의 독립성과 ②발행된 유형 1 또는 유형 2 보고서에 적용된 기준의 적절성이다."}, "t253": {"kw": ["입수가능한 경우 유형 2의 보고서(유형 1 보고서 아님)를 입수함", "서비스조직의 통제에 대해 적합한 통제테스트를 수행함(직접 수행)", "서비스조직의 통제에 대하여 통제테스트를 수행한 타감사인의 업무를 활용함"], "ans": "서비스조직의 통제에 대한 통제테스트 수행방법은 ①입수가능한 경우 유형 2의 보고서(유형 1 보고서가 아님)를 입수하고, ②서비스조직의 통제에 대해 적합한 통제테스트를 직접 수행하며, ③서비스조직의 통제에 대하여 통제테스트를 수행한 타감사인의 업무를 활용하는 것이다."}, "t254": {"kw": ["서비스조직 통제에 대한 기술·설계 및 운영효과성이 이용자기업 감사인의 감사목적에 적합한 일자 또는 적합한 기간에 대한 것인지 여부를 평가함", "통제테스트의 대상기간 및 그러한 통제테스트를 수행한 후 경과된 시간의 적절성을 평가함", "서비스감사인의 감사보고서에 기술된 해당 감사인의 통제테스트와 그 결과가 이용자기업 재무제표의 경영진주장과 관련이 있으며 이용자기업 감사인의 위험평가에 도움이 되도록 충분하고 적합한 감사증거를 제공하는지 여부를 평가함", "서비스조직에 의해 식별된 보충적인 이용자기업 통제가 이용자기업과 관련성이 있는지 여부를 결정하고, 관련성이 있다면 이용자기업이 그러한 통제를 설계하였고 실행하였는지 여부를 이해하고 통제의 운영효과성을 테스트함"], "ans": "통제테스트로서 유형 2 보고서를 이용할 경우 추가절차는 ①서비스조직 통제에 대한 기술·설계 및 운영효과성이 이용자기업 감사인의 감사목적에 적합한 일자 또는 적합한 기간에 대한 것인지 여부를 평가하고, ②통제테스트의 대상기간 및 그러한 통제테스트를 수행한 후 경과된 시간의 적절성을 평가하며, ③서비스감사인의 감사보고서에 기술된 해당 감사인의 통제테스트와 그 결과가 이용자기업 재무제표의 경영진주장과 관련이 있으며 이용자기업 감사인의 위험평가에 도움이 되도록 충분하고 적합한 감사증거를 제공하는지 여부를 평가하고, ④서비스조직에 의해 식별된 보충적인 이용자기업 통제가 이용자기업과 관련성이 있는지 여부를 결정하고 관련성이 있다면 이용자기업이 그러한 통제를 설계하였고 실행하였는지 여부를 이해하고 통제의 운영효과성을 테스트하는 것이다."}, "t255": {"kw": ["서비스감사인의 전문가적 적격성 및 서비스조직으로부터의 독립성", "발행된 유형 2 보고서에 적용된 기준의 적절성"], "ans": "유형 2 보고서가 제공하는 증거의 충분성과 적합성 결정시 만족하여야 할 사항은 ①서비스감사인의 전문가적 적격성 및 서비스조직으로부터의 독립성과 ②발행된 유형 2 보고서에 적용된 기준의 적절성이다."}, "t256": {"kw": ["재무제표가 그 기초가 되는 회계기록과 일치하는지를 확인하거나 차이를 조정함", "재무제표를 작성하는 과정에서 행한 중요한 분개 및 기타 수정사항에 대하여 조사함"], "ans": "재무제표의 결산절차에 대한 실증절차를 수행할 때 포함되어야 하는 절차는 ①재무제표가 그 기초가 되는 회계기록과 일치하는지를 확인하거나 차이를 조정하고, ②재무제표를 작성하는 과정에서 행한 중요한 분개 및 기타 수정사항에 대하여 조사하는 것이다."}, "t257": {"kw": ["감사인은 경영진주장 수준의 평가된 중요왜곡표시위험이 유의적이라고 결정하면 해당 위험에 구체적으로 대응하는 실증절차를 수행하여야 함", "유의적 위험에 대응하는 접근방법이 실증절차만으로 구성되어 있는 경우에는 반드시 세부테스트를 포함하여야 함"], "ans": "유의적 위험에 대응하기 위한 실증절차는 다음과 같다. ①감사인은 경영진주장 수준의 평가된 중요왜곡표시위험이 유의적이라고 결정하면 해당 위험에 구체적으로 대응하는 실증절차를 수행하여야 한다. ②유의적 위험에 대응하는 접근방법이 실증절차만으로 구성되어 있는 경우에는 반드시 세부테스트를 포함하여야 한다(실증적인 분석적절차가 아님)."}, "t258": {"kw": ["감사인의 위험평가에는 판단이 수반되므로 모든 중요왜곡표시위험이 식별되지 않을 수 있음", "경영진의 통제무력화 등 내부통제시스템에 고유한계가 존재함"], "ans": "평가된 중요왜곡표시위험과 관계없이 중요한 거래유형과 계정잔액 및 공시에 대해서 실증절차를 설계하고 수행해야 하는 이유는 ①감사인의 위험평가에는 판단이 수반되므로 모든 중요왜곡표시위험이 식별되지 않을 수 있고, ②경영진의 통제무력화 등 내부통제시스템에 고유한계가 존재하기 때문이다."}, "t259": {"kw": ["총괄표의 작성(기초금액은 전기말 금액과 대조검사(대사)하고 당기말금액은 총계정원장과 비교하며 합계가 맞는지 검증)", "실증적인 분석적절차의 수행", "세부테스트의 수행(계정잔액에 대한 세부테스트, 거래유형에 대한 세부테스트)"], "ans": "실증절차의 수행순서는 ①총괄표의 작성(기초금액은 전기말 금액과 대조검사하고 당기말금액은 총계정원장과 비교하며 동시에 합계가 맞는지 검증), ②실증적인 분석적절차의 수행, ③세부테스트의 수행(계정잔액에 대한 세부테스트와 거래유형에 대한 세부테스트)이다."}, "t260": {"kw": ["통제환경 및 기타의 관련통제(통제가 효과적인 경우)", "평가된 중요왜곡표시위험(위험이 낮다고 평가된 경우)", "거래유형과 계정잔액의 성격 및 관련경영진주장", "감사인이 수행할 절차에 필요한 정보가 이후 시점에 입수될 수 있는지 여부 등"], "ans": "중간기간에 실증절차를 수행하기 위하여 고려하여야 하는 사항은 ①통제환경 및 기타의 관련통제(통제가 효과적인 경우), ②평가된 중요왜곡표시위험(위험이 낮다고 평가된 경우), ③거래유형과 계정잔액의 성격 및 관련경영진주장, ④감사인이 수행할 절차에 필요한 정보가 이후 시점에 입수될 수 있는지 여부 등이다."}, "t261": {"kw": ["잔여기간에 대한 통제테스트와 실증절차를 수행함", "만약 감사인이 충분하다고 결정한 경우에는 후속적인 실증절차만을 수행함"], "ans": "중간기간에 실증절차를 수행한 경우 잔여기간에 대한 추가감사절차는 ①잔여기간에 대한 통제테스트와 실증절차를 수행하고, ②만약 감사인이 충분하다고 결정한 경우에는 후속적인 실증절차만을 수행하는 것이다."}, "t262": {"kw": ["비경상적으로 보이는 금액을 식별함", "해당 금액에 대하여 조사함", "잔여기간에 대한 테스트를 위해 실증적인 분석적절차 또는 세부테스트를 수행함"], "ans": "중간기간에 실증절차를 수행한 후 보고기간말 잔액에 관한 정보와 중간기간의 잔액에 관한 정보를 비교조정하는 것이 효과적이라고 결정하는 이유는 ①비경상적으로 보이는 금액을 식별하고, ②해당 금액에 대하여 조사하며, ③잔여기간에 대한 테스트를 위해 실증적인 분석적절차 또는 세부테스트를 수행하기 위함이다."}, "t263": {"kw": ["당기재무제표에 중요하게 영향을 미치는 왜곡표시가 기초잔액에 포함되었는지 여부", "기초잔액에 반영된 적합한 회계정책이 당기재무제표에 일관되게 적용되었는지 여부(회계정책이 변경되었다면 해당재무보고체계에 따라 적절하게 처리되고 적절하게 표시 및 공시되었는지 여부)"], "ans": "초도감사시 기초잔액에 대한 2가지 감사목적은 ①당기재무제표에 중요하게 영향을 미치는 왜곡표시가 기초잔액에 포함되었는지 여부, ②기초잔액에 반영된 적합한 회계정책이 당기재무제표에 일관되게 적용되었는지 여부(만약 회계정책이 변경되었다면 해당재무보고체계에 따라 적절하게 처리되고 적절하게 표시 및 공시되었는지 여부)이다."}, "t264": {"kw": ["전기의 마감잔액이 정확하게 당기로 이월되었는지 또는 적절히 재작성되었는지 여부를 결정함", "기초잔액에 적합한 회계정책이 반영되어 있는지, 회계변경은 적절히 처리되었는지 여부를 결정함", "전기재무제표가 감사를 받은 경우 전임감사인의 감사조서를 검토, 당기에 수행된 감사절차가 기초잔액과 관련된 증거를 제공하는지 여부 평가, 기초잔액에 관한 증거를 입수하기 위한 특정 감사절차 수행"], "ans": "기초잔액에 왜곡표시의 포함여부를 확인하는 감사절차는 다음과 같다. ①전기의 마감잔액이 정확하게 당기로 이월되었는지 또는 적절히 재작성되었는지 여부를 결정하고, ②기초잔액에 적합한 회계정책이 반영되어 있는지 및 회계변경은 적절히 처리되었는지 여부를 결정하며, ③다음 중 하나 이상을 수행한다. 즉 ㉠전기재무제표가 감사를 받은 경우 기초잔액에 관한 증거를 입수하기 위해 전임감사인의 감사조서를 검토하고, ㉡당기에 수행된 감사절차가 기초잔액과 관련된 증거를 제공하는지 여부를 평가하며, ㉢기초잔액에 관한 증거를 입수하기 위하여 특정의 감사절차를 수행한다."}, "t265": {"kw": ["당기재고자산의 실사에 입회하고 그 결과를 기초재고수량으로 조정함(수량 관련)", "기초재고자산 항목의 평가에 대한 감사절차를 수행함(단가 관련)", "매출총이익과 기간귀속에 대하여 감사절차를 수행함"], "ans": "기초잔액과 관련된 유동항목 중 재고자산에 대한 감사절차는 ①당기재고자산의 실사에 입회하고 그 결과를 기초재고수량으로 조정하고(수량 관련), ②기초재고자산 항목의 평가에 대한 감사절차를 수행하며(단가 관련), ③매출총이익과 기간귀속에 대하여 감사절차를 수행하는 것이다."}, "t266": {"kw": ["기초잔액의 근거가 되는 회계기록과 기타의 정보를 조사함", "제3자에 대한 조회를 실시함(장기부채·투자자산)"], "ans": "기초잔액과 관련된 비유동항목에 대한 감사절차는 ①기초잔액의 근거가 되는 회계기록과 기타의 정보를 조사하고, ②제3자에 대한 조회를 실시하는 것이다(장기부채·투자자산 등)."}, "t267": {"kw": ["적합한 수준의 경영진과 지배기구와 적시에 커뮤니케이션하고 이러한 왜곡표시를 수정할 것을 요청함", "기초잔액에 중요한 왜곡표시가 존재한다는 사실을 전임감사인에게 알리도록 요청하여야 함(비밀유지의무를 준수하기 위해 직접 알리지 않음)"], "ans": "타감사인이 전기재무제표를 감사한 경우로서 당기의 기초잔액에 중요한 왜곡표시를 식별한 경우 수행절차는 ①적합한 수준의 경영진과 지배기구와 적시에 커뮤니케이션하고 이러한 왜곡표시를 수정할 것을 요청하고, ②기초잔액에 중요한 왜곡표시가 존재한다는 사실을 전임감사인에게 알리도록 요청하는 것이다(비밀유지의무를 준수하기 위해 감사인이 전임감사인에게 직접 알리지 않음)."}, "t268": {"kw": ["초도감사에서 기초잔액에 대하여 충분하고 적합한 감사증거를 입수할 수 없어서 재무성과와 현금흐름은 한정의견이나 의견거절, 그리고 재무상태는 적정의견을 표명하는 경우", "동일한 감사보고서 내에서 하나의 재무보고체계(예: 한국채택국제회계기준)에 따라 작성된 재무제표에 대하여 적정의견을 표명하고, 동일 재무제표에 대하여 다른 재무보고체계(예: 일반기업회계기준)에 따라서는 부적정의견을 표명하는 경우"], "ans": "예외적으로 의견의 분리가 허용되는 경우는 ①초도감사에서 기초잔액에 대하여 충분하고 적합한 감사증거를 입수할 수 없어서 재무성과와 현금흐름은 한정의견이나 의견거절, 그리고 재무상태는 적정의견을 표명하는 경우, ②동일한 감사보고서 내에서 하나의 재무보고체계(예: 한국채택국제회계기준)에 따라 작성된 재무제표에 대하여 적정의견을 표명하고 동일 재무제표에 대하여 다른 재무보고체계(예: 일반기업회계기준)에 따라서는 부적정의견을 표명하는 경우이다."}, "t269": {"kw": ["기초금액은 전기말 금액과 대조검사(대사)함", "당기말금액은 총계정원장과 비교함", "동시에 합계가 맞는지 검증함"], "ans": "총괄표의 작성은 기초금액을 전기말 금액과 대조검사(대사)하고, 당기말금액을 총계정원장과 비교하며(재무제표의 결산절차에 대한 실증절차), 동시에 합계가 맞는지도 검증하는 것이다."}, "t270": {"kw": ["현금및현금성자산이 감사대상회사의 업종을 고려해 볼 때 자산에서 차지하는 비중이 지나치게 높은 경우", "금리가 높은 단기차입금이 많은 회사가 현금시재액 및 수익률이 굉장히 낮은 현금성자산을 지나치게 많이 보유하고 있는 경우", "기중에 비해서 기말에 현금잔액이 지나치게 증가하는 경우"], "ans": "현금및현금성자산에 부정위험의 징후가 존재하는 상황은 ①현금및현금성자산이 감사대상회사의 업종을 고려해 볼 때 자산에서 차지하는 비중이 지나치게 높은 경우, ②금리가 높은 단기차입금이 많은 회사가 현금시재액 및 수익률이 굉장히 낮은 현금성자산을 지나치게 많이 보유하고 있는 경우, ③기중에 비해서 기말에 현금잔액이 지나치게 증가하는 경우이다."}, "t271": {"kw": ["보유사유 및 보유규모의 타당성을 검토", "재무제표일 후 계속 보유여부를 확인해야 하고 재무제표일 후 인출된 경우에는 그 사용내역을 추가로 확인", "예금의 경우 금융기관 담당자에게 시재액에 대해 유선조회를 하거나 통장실물을 확인"], "ans": "보고기간말 부적합하게 대규모의 현금및현금성자산을 보유하고 있는 경우 감사절차는 ①보유사유 및 보유규모의 타당성을 검토하고, ②재무제표일 후 계속 보유여부를 확인해야 하며 재무제표일 후 인출된 경우에는 그 사용내역을 추가로 확인하고, ③예금의 경우 금융기관 담당자에게 시재액에 대해 유선조회를 하거나 통장실물을 확인하는 것이다."}, "t272": {"kw": ["기초금액은 전기말 금액과 대사함", "당기말금액은 총계정원장과 비교함", "합계가 맞는지 검증함"], "ans": "매출채권과 매출에 대한 총괄표의 작성은 기초금액을 전기말 금액과 대사하고, 당기말금액을 총계정원장과 비교하며, 동시에 합계가 맞는지 검증하는 것이다."}, "t273": {"kw": ["경영진에게 질문하고 경영진의 답변과 관련성이 있는 적합한 감사증거를 입수함(전문가적 의구심 중 감사증거에 대해서 비판적인 평가를 하는 태도)", "그러한 상황에 필요한 기타의 감사절차를 수행함"], "ans": "매출채권회전율이 크게 감소한 경우 등 분석적절차의 수행결과 유의적인 차이가 발견된 경우 추가적인 수행절차는 ①경영진에게 질문하고 경영진의 답변과 관련성이 있는 적합한 감사증거를 입수하고(전문가적 의구심 중 감사증거에 대해서 비판적인 평가를 하는 태도), ②그러한 상황에 필요한 기타의 감사절차를 수행하는 것이다. 특별한 변화가 없는 상황에서 매출채권회전율이 크게 감소한 경우 매출과 매출채권의 과대계상가능성이나 대손충당금의 과소계상가능성이 존재한다."}, "t274": {"kw": ["발생사실: 기록된 거래와 사건은 발생되었고 기업에 귀속됨", "완전성: 기록되어야 하는 모든 거래와 사건이 기록되었으며 관련 공시가 모두 포함됨", "기간귀속: 거래와 사건은 해당 보고기간에 기록됨", "분류: 거래와 사건은 적절한 계정으로 기록됨", "정확성: 기록된 거래와 사건에 관련된 금액 및 기타 데이터가 적합하게 기록되고 관련 공시가 적합하게 측정·기술됨", "표시: 거래와 사건은 적합하게 합해지거나 세분화되고 명확하게 기술되며 관련 공시가 재무보고체계 측면에서 관련성 있고 이해가능함"], "ans": "매출거래에 대해 확인하여야 할 경영진주장은 ①발생사실(기록된 거래와 사건은 발생되었고 기업에 귀속됨), ②완전성(기록되어야 하는 모든 거래와 사건이 기록되었으며 재무제표에 포함되어야 하는 모든 관련 공시가 포함됨), ③기간귀속(거래와 사건은 해당 보고기간에 기록됨), ④분류(거래와 사건은 적절한 계정으로 기록됨), ⑤정확성(기록된 거래와 사건에 관련된 금액 및 기타 데이터는 적합하게 기록되었고 관련 공시는 적합하게 측정되고 기술됨), ⑥표시(거래와 사건은 적합하게 합해지거나 세분화되고 명확하게 기술되었으며 관련 공시는 해당 재무보고체계의 요구사항 측면에서 관련성이 있으며 이해가능함)이다."}, "t275": {"kw": ["재고자산과 관련된 중요왜곡표시위험", "재고자산과 관련된 내부통제의 성격", "재고자산 실사의 시기", "재고자산의 실사를 위해 적절한 절차가 수립되고 적절한 지시가 전달될 것으로 예상되는지 여부", "기업이 계속기록법을 유지하는지 여부", "적절한 입회장소를 결정시 보관장소", "감사인측 전문가의 도움이 필요한지 여부"], "ans": "재고자산 실사입회 계획시 고려사항은 ①재고자산과 관련된 중요왜곡표시위험, ②재고자산과 관련된 내부통제의 성격, ③재고자산 실사의 시기, ④재고자산의 실사를 위해 적절한 절차가 수립되고 적절한 지시가 전달될 것으로 예상되는지 여부, ⑤기업이 계속기록법을 유지하는지 여부, ⑥적절한 입회장소를 결정시 보관장소, ⑦감사인측 전문가의 도움이 필요한지 여부이다."}, "t276": {"kw": ["재고자산 실사의 결과를 기록하고 통제하기 위한 경영진의 지시와 절차의 평가", "경영진이 수행하는 실사절차에 대해 관찰(협의의 실사입회)", "재고자산에 대해 조사", "테스트 실사의 수행(실사입회의 증거력 보완)"], "ans": "재고자산 실사입회할 때 수행하여야 하는 4가지 절차는 ①재고자산 실사의 결과를 기록하고 통제하기 위한 경영진의 지시와 절차의 평가, ②경영진이 수행하는 실사절차에 대해 관찰(협의의 실사입회), ③재고자산에 대해 조사, ④테스트 실사의 수행(실사입회의 증거력 보완)이다."}, "t277": {"kw": ["적합한 통제의 적용(사용한 재고실사표의 회수·미사용된 재고실사표의 처리·수량파악 및 검증의 절차 등)", "재공품의 완성도·회전율이 낮거나 진부화 또는 손상된 항목(평가손실 관련) 및 제3자가 소유한 재고자산에 대한 정확한 식별", "실제수량을 추정하기 위해 사용된 절차(야적된 석탄의 수량을 추정시 사용된 계측절차)", "재고자산의 보관장소간 이동과 실사기준일 전후의 재고자산 입·출고에 대한 통제절차"], "ans": "실사의 통제와 관련된 경영진의 지시와 절차에 포함되어야 할 사항은 ①적합한 통제의 적용(사용한 재고실사표의 회수·미사용된 재고실사표의 처리·수량파악 및 검증의 절차 등), ②재공품의 완성도·회전율이 낮거나 진부화 또는 손상된 항목(평가손실 관련) 및 제3자가 소유한 재고자산에 대한 정확한 식별, ③실제수량을 추정하기 위해 사용된 절차(야적된 석탄의 수량을 추정시 사용된 계측절차), ④재고자산의 보관장소간 이동과 실사기준일 전후의 재고자산 입·출고에 대한 통제절차이다."}, "t278": {"kw": ["실사기록의 정확성에 대한 감사증거를 입수하기 위하여 실사기록에서 선정된 항목을 실제의 재고로 추적함", "실사기록의 완전성에 대한 감사증거를 입수하기 위하여 실제의 재고에서 선정된 항목을 경영진의 실사기록으로 추적함"], "ans": "구체적인 테스트 실사절차는 ①실사기록의 정확성에 대한 감사증거를 입수하기 위하여 실사기록에서 선정된 항목을 실제의 재고로 추적하거나, ②실사기록의 완전성에 대한 감사증거를 입수하기 위하여 실제의 재고에서 선정된 항목을 경영진의 실사기록으로 추적하는 것이다."}, "t279": {"kw": ["재고자산의 최종 기록이 재고자산 실사의 결과를 정확하게 반영하고 있는지 여부를 결정하기 위해(수행목적)", "재고자산의 최종 기록에 대한 감사절차를 수행함(실사기록사본과 재고자산 최종 기록 대사)"], "ans": "재고자산 실사입회 후에 추가적으로 수행하여야 하는 절차는 ①재고자산의 최종 기록이 재고자산 실사의 결과를 정확하게 반영하고 있는지 여부를 결정하기 위해(수행목적), ②재고자산의 최종 기록에 대한 감사절차를 수행하는 것이다(실사기록사본과 재고자산 최종 기록 대사). 이 목적을 위해 감사인은 실사입회를 할 때 ㉠감사인이 테스트 실사의 결과를 기록하고, ㉡경영진의 완료된 실사기록 사본을 입수한다."}, "t280": {"kw": ["실사일과 재무제표일 사이의 재고자산 변동이 적절하게 기록되었는지 여부에 대한 감사증거를 얻기 위한 감사절차를 수행하여야 함(실사일과 재무제표일 사이의 기간동안 재고의 입고와 출고가 적절한지 확인하기 위한 문서검사 등)"], "ans": "실사(기준)일과 재무제표일이 다른 경우 추가감사절차는, 실사일과 재무제표일 사이의 재고자산 변동이 적절하게 기록되었는지 여부에 대한 감사증거를 얻기 위한 감사절차(실사일과 재무제표일 사이의 기간동안 재고의 입고와 출고가 적절한지 확인하기 위한 문서검사 등)를 수행하는 것이다."}, "t281": {"kw": ["실사 중 입수된 정보와 계속기록법에 의한 재고기록간의 유의적 차이에 대한 이유", "계속기록법에 의한 재고기록이 바르게 조정되는지 여부", "기업의 계속기록법에 의한 재고기록의 신뢰성"], "ans": "재고자산의 실사일과 최종 재고자산 기록일 사이의 금액변동이 적절히 기록되었는지 여부에 대한 감사증거를 얻기 위해 감사절차를 설계할 때 관련 고려사항은 ①실사 중 입수된 정보와 계속기록법에 의한 재고기록간의 유의적 차이에 대한 이유, ②계속기록법에 의한 재고기록이 바르게 조정되는지 여부, ③기업의 계속기록법에 의한 재고기록의 신뢰성이다."}, "t282": {"kw": ["기업을 위하여 보유하는 재고자산의 수량과 상태에 대하여 해당 제3자의 조회를 요청함(타처보관재고자산조회서)", "해당 상황에 적합한 검사 또는 기타의 감사절차를 수행함"], "ans": "제3자가 회사의 재고를 보관하고 있는 경우 다음 중 하나 이상의 절차를 수행하여야 한다. ①기업을 위하여 보유하는 재고자산의 수량과 상태에 대하여 해당 제3자의 조회를 요청하거나(타처보관재고자산조회서), ②해당 상황에 적합한 검사 또는 기타의 감사절차를 수행한다."}, "t283": {"kw": ["실행가능한 경우 제3자가 수행하는 재고자산 실사에 직접 입회하거나 타감사인이 입회하도록 조치함", "재고자산이 바르게 실사되고 적절하게 보호되는지 확인하기 위해 제3자의 내부통제가 적절한지에 대한 타감사인의 감사보고서 또는 서비스조직 감사인의 감사보고서(유형 2 보고서)를 입수함", "창고보관증과 같이 제3자가 보관하는 재고자산에 관한 문서를 조사함", "재고자산이 담보로 제공되어 있다면 해당 당사자(채권자 등)의 조회를 요청함"], "ans": "제3자의 성실성과 객관성이 의심되는 경우 제3자에 대한 조회에 대신하여 또는 이에 추가하여 다음의 기타 감사절차를 수행한다. ①실행가능한 경우 제3자가 수행하는 재고자산 실사에 직접 입회하거나 타감사인이 입회하도록 조치하고, ②재고자산이 바르게 실사되고 적절하게 보호되는지 확인하기 위해 제3자의 내부통제가 적절한지에 대한 타감사인의 감사보고서 또는 서비스조직 감사인의 감사보고서(유형 2 보고서)를 입수하며, ③창고보관증과 같이 제3자가 보관하는 재고자산에 관한 문서를 조사하고, ④재고자산이 담보로 제공되어 있다면 해당 당사자(채권자 등)의 조회를 요청한다."}, "t284": {"kw": ["기초금액은 전기말 금액과 대사함", "당기말금액은 총계정원장과 비교함", "합계가 맞는지 검증함"], "ans": "매입채무와 차입금에 대한 총괄표의 작성은 기초금액을 전기말 금액과 대사하고, 당기말금액을 총계정원장과 비교하며, 동시에 합계가 맞는지 검증하는 것이다."}, "t285": {"kw": ["잔액이 없거나 거의 없더라도 당기중 중요한 거래처를 중심으로 채권채무조회서를 발송함(기본절차)", "재무제표일 이후 현금지급내역을 조사함", "상품수령증(또는 검수보고서)과 같은 기타기록에 대해 조사함(전진법에 의한 문서검사)", "제3자로부터의 서신(은행·중개업자)을 조사함"], "ans": "매입채무에 대한 세부테스트는 ①잔액이 없거나 거의 없더라도 당기중 중요한 거래처를 중심으로 채권채무조회서를 발송하고(기본절차), ②재무제표일 이후 현금지급내역을 조사하며, ③상품수령증(또는 검수보고서)과 같은 기타기록에 대해 조사하고(전진법에 의한 문서검사), ④제3자로부터의 서신(은행·중개업자)을 조사하는 것이다. ②③④는 매입채무와 관련된 외부조회절차의 대체적 절차 또는 추가감사절차에 해당한다."}, "t286": {"kw": ["제3자에게 직접 조회함(계약당사자)", "문서의 진실성을 평가하기 위해 전문가를 이용함(문서감별사)"], "ans": "회계기록·문서가 진실하지 않다고 믿는 경우 감사인은 ①제3자에게 직접 조회하고(계약당사자), ②문서의 진실성을 평가하기 위해 전문가를 이용하는(문서감별사) 추가조사절차를 수행하여야 한다."}, "t287": {"kw": ["은폐하기 위해", "위조", "거래의 기록에 대한 계획적인 누락", "감사인에 대한 의도적인 거짓 진술", "정교하고 면밀하게 설계된 수단들이 이용되기 때문"], "ans": "부정적발의 고유한계가 오류발견의 고유한계보다 큰 이유는, 부정의 경우 그 사실을 은폐하기 위해 ①위조, ②거래의 기록에 대한 계획적인 누락 또는 ③감사인에 대한 의도적인 거짓 진술 등 정교하고 면밀하게 설계된 수단들이 이용되기 때문이다."}, "t288": {"kw": ["경영진은 회계기록을 직·간접적으로 조작하고", "허위의 재무정보를 제공하거나", "다른 종업원에 의해 유사한 부정이 예방되도록 설계된", "통제를 무력화할 수 있는 위치에 있는 경우가 빈번하기 때문"], "ans": "경영진에 의한 부정적발의 고유한계가 종업원의 경우보다 큰 이유는, 경영진은 회계기록을 직·간접적으로 조작하고 허위의 재무정보를 제공하거나 다른 종업원에 의해 유사한 부정이 예방되도록 설계된 통제를 무력화할 수 있는 위치에 있는 경우가 빈번하기 때문이다."}, "t289": {"kw": ["[부정한 재무보고] 회계기록이나 근거문서를 조작·위조·변조 또는 수정함, 사건·거래 또는 기타 유의적인 정보를 재무제표에 허위로 기재하거나 의도적으로 누락함, 회계원칙을 의도적으로 잘못 적용함", "[자산의 횡령] 입금의 횡령, 물리적 자산 또는 지적 자산의 절도, 기업자산을 개인용도로 이용, 수취하지 아니한 재화나 용역을 위하여 지급하게 함"], "ans": "부정한 재무보고의 예시는 ①회계기록이나 근거문서를 조작·위조·변조 또는 수정함, ②사건·거래 또는 기타 유의적인 정보를 재무제표에 허위로 기재하거나 의도적으로 누락함, ③금액·분류·표시방법 또는 공시에 대한 회계원칙을 의도적으로 잘못 적용함이다. 자산의 횡령의 예시는 ①입금의 횡령, ②물리적 자산 또는 지적 자산의 절도, ③기업자산을 개인용도로 이용, ④수취하지 아니한 재화나 용역을 위하여 지급하게 함이다."}, "t290": {"kw": ["동기·압력", "기회", "합리화(태도)"], "ans": "부정의 3가지 구성요소는 ①동기·압력, ②기회, ③합리화(태도)이다. 동기·압력은 부정을 저지를 압력이 존재하는 경우이고, 기회는 개인이 내부통제를 무력화할 수 있다고 믿을 때이며, 합리화는 부정직한 행위를 정당화하는 태도이다."}, "t291": {"kw": ["경영진이 기업 내·외부로부터 예정된 이익목표나 재무적 성과의 달성압력을 받고 있을 때(특히 목표달성 아님)", "세금을 최소화시키기 위하여 이익을 중요하게 감소", "은행 차입을 위하여 이익을 과장하려는 동기"], "ans": "부정한 재무보고의 동기·압력의 예시는 ①경영진이 기업 내·외부로부터 예정된 이익목표나 재무적 성과의 달성압력을 받고 있을 때(특히 목표달성이 아님), ②세금을 최소화시키기 위하여 이익을 중요하게 감소시키려는 경우, ③은행 차입을 위하여 이익을 과장하려는 동기가 있는 경우이다."}, "t292": {"kw": ["재무제표가 어떻게 그리고 어느 부분에서 부정으로 인하여 중요하게 왜곡표시되기 쉬운지에 대하여 업무팀원 중 경험이 많은 사람들의 통찰을 공유할 기회를 제공함", "감사인이 그러한 위험성에 대한 적합한 대응을 고려할 수 있게 하고 업무팀원 중 누구에게 어떤 감사절차를 맡길 것인지 결정할 수 있게 해줌", "감사인이 감사절차의 수행 결과를 업무팀원과 어떻게 공유할지 및 감사인이 주목하게 된 부정혐의를 어떻게 다루어야 할지 결정할 수 있게 함"], "ans": "부정에 대한 토의의 효과는 ①재무제표가 어떻게 그리고 어느 부분에서 부정으로 인하여 중요하게 왜곡표시되기 쉬운지에 대하여 업무팀원 중 경험이 많은 사람들의 통찰을 공유할 기회를 제공하고, ②감사인이 그러한 위험성에 대한 적합한 대응을 고려할 수 있게 하고 업무팀원 중 누구에게 어떤 감사절차를 맡길 것인지 결정할 수 있게 해주며, ③감사인이 감사절차의 수행 결과를 업무팀원과 어떻게 공유할지 및 감사인이 주목하게 된 부정혐의를 어떻게 다루어야 할지 결정할 수 있게 하는 것이다."}, "t293": {"kw": ["재무제표가 부정으로 인하여 중요하게 왜곡표시 될 위험에 대한 경영진의 평가", "경영진이 기업의 부정위험을 식별하고 대응하는 절차", "해당 사항이 있는 경우 기업의 부정위험을 식별하고 대응하는 절차에 관하여 경영진이 지배기구에게 행한 커뮤니케이션", "해당 사항이 있는 경우 기업의 영업실무와 윤리적 행동에 대한 경영진의 견해에 관하여 경영진이 종업원에게 행한 커뮤니케이션"], "ans": "부정과 관련하여 경영진에게 질문할 일반사항은 ①재무제표가 부정으로 인하여 중요하게 왜곡표시 될 위험에 대한 경영진의 평가, ②경영진이 기업의 부정위험을 식별하고 대응하는 절차, ③해당 사항이 있는 경우 기업의 부정위험을 식별하고 대응하는 절차에 관하여 경영진이 지배기구에게 행한 커뮤니케이션, ④해당 사항이 있는 경우 기업의 영업실무와 윤리적 행동에 대한 경영진의 견해에 관하여 경영진이 종업원에게 행한 커뮤니케이션이다."}, "t294": {"kw": ["실제로 발생하였거나 의심되는 부정 또는 혐의 중인 부정을 알고 있는지 여부"], "ans": "부정과 관련하여 경영진과 내부 관련자에게 질문할 구체적인 사항은, 실제로 발생하였거나 의심되는 부정 또는 혐의 중인 부정을 알고 있는지 여부이다."}, "t295": {"kw": ["실제로 발생하였거나 의심되는 부정 또는 혐의중인 부정을 지배기구가 알고 있는지 여부를 결정", "경영진에 대한 질문의 답변내용을 확인"], "ans": "부정과 관련하여 지배기구에게 질문해야 하는 이유는 ①실제로 발생하였거나 의심되는 부정 또는 혐의중인 부정을 지배기구가 알고 있는지 여부를 결정하고, ②경영진에 대한 질문의 답변내용을 확인하기 위함이다."}, "t296": {"kw": ["실제로 발생하였거나 의심되는 부정 또는 혐의중인 부정을 내부감사부서가 알고 있는지 여부를 결정", "부정위험에 관한 이들의 견해를 파악"], "ans": "부정과 관련하여 내부감사기능에게 질문해야 하는 이유는 ①실제로 발생하였거나 의심되는 부정 또는 혐의중인 부정을 내부감사부서가 알고 있는지 여부를 결정하고, ②부정위험에 관한 이들의 견해를 파악하기 위함이다."}, "t297": {"kw": ["유의적 업무수행 책임을 부여할 개별 구성원의 지식·기술 및 능력과 해당 감사업무에 있어서 부정으로 인한 중요왜곡표시위험에 대한 감사인의 평가결과를 고려하여 업무를 배정하고 감독함", "감사절차의 성격·시기 및 범위를 선택할 때 예측불가능성 요소를 포함시킴", "특히 주관적인 측정과 복잡한 거래와 관련된 경우 회계정책의 선택과 적용이 경영진의 이익조정 노력에 따른 부정한 재무보고의 징후인지 여부를 평가함"], "ans": "부정위험에 대한 재무제표 수준의 전반적인 대응절차는 ①유의적 업무수행 책임을 부여할 개별 구성원의 지식·기술 및 능력과 해당 감사업무에 있어서 부정으로 인한 중요왜곡표시위험에 대한 감사인의 평가결과를 고려하여 업무를 배정하고 감독하고, ②감사절차의 성격·시기 및 범위를 선택할 때 예측불가능성 요소를 포함시키며, ③특히 주관적인 측정과 복잡한 거래와 관련된 경우 회계정책의 선택과 적용이 경영진의 이익조정 노력에 따른 부정한 재무보고의 징후인지 여부를 평가하는 것이다."}, "t298": {"kw": ["보다 신뢰할 수 있거나 관련성이 있는 감사증거를 입수함", "추가적인 확인적 정보를 입수하기 위하여 변경함"], "ans": "부정으로 인한 중요왜곡표시위험이 높은 경우 경영진주장 수준의 대응절차 중 성격 측면은 ①보다 신뢰할 수 있거나 관련성이 있는 감사증거를 입수하고, ②추가적인 확인적 정보를 입수하기 위하여 변경하는 것이다. 특정 자산의 관찰이나 실물검사가 더욱 중요할 수 있고, 컴퓨터를 이용한 감사기법을 이용할 수 있다."}, "t299": {"kw": ["[상황] 경영진이 이익기대치를 달성하기 위한 압력을 받고 있음을 식별한 경우로서 수익인식을 금지하는 조건이 포함된 판매약정을 체결하거나(반품조건부 판매) 목적물의 인도 전에 송장을 발행함으로써(선세금계산서) 경영진이 매출을 과대계상하고 있는 관련 위험이 있는 경우", "현재 잔액에 대한 조회뿐만 아니라 일자·반품권한·인도조건 등 판매약정의 세부내역을 조회", "기업의 비재무 인원에게 판매약정이나 인도조건의 변경여부에 대하여 질문"], "ans": "부정으로 인한 중요왜곡표시위험이 높은 경우 확인적 정보를 입수하기 위한 설계절차는 다음과 같다. 경영진이 이익기대치를 달성하기 위한 압력을 받고 있음을 식별한 경우로서 수익인식을 금지하는 조건이 포함된 판매약정을 체결하거나(반품조건부 판매) 목적물의 인도 전에 송장을 발행함으로써(선세금계산서) 경영진이 매출을 과대계상하고 있는 관련 위험이 있는 경우 외부조회를 보충한다. ①현재 잔액에 대한 조회뿐만 아니라 일자·반품권한·인도조건 등 판매약정의 세부내역을 조회하고, ②기업의 비재무 인원에게 판매약정이나 인도조건의 변경여부에 대하여 질문한다."}, "t300": {"kw": ["보고기간말 또는 보고기간말에 근접한 때에 실증절차를 수행", "불시에 또는 예측불가능한 시기에 감사절차를 수행"], "ans": "부정으로 인한 중요왜곡표시위험이 높은 경우 경영진주장 수준의 대응절차 중 시기 측면은 ①보고기간말 또는 보고기간말에 근접한 때에 실증절차를 수행하고, ②불시에 또는 예측불가능한 시기에 감사절차를 수행하는 것이다."}, "t301": {"kw": ["표본규모를 확대", "보다 세부적인 수준에서 분석적절차를 수행"], "ans": "부정으로 인한 중요왜곡표시위험이 높은 경우 경영진주장 수준의 대응절차 중 범위 측면은 ①표본규모를 확대하고, ②보다 세부적인 수준에서 분석적절차를 수행하는 것이다."}, "t302": {"kw": ["총계정원장에 기록된 분개와 재무제표의 작성시 이루어진 조정사항의 적절성을 테스트함", "회계추정치에 편의가 있는지 검토하고, 편의가 있다면 이를 유발하는 환경이 부정으로 인한 중요왜곡표시위험을 나타내는 것인지 여부를 평가함", "기업의 정상적인 사업과정을 벗어나는 거래 또는 비경상적으로 보이는 유의적 거래의 사업상 합리성을 평가함"], "ans": "경영진의 통제무력화 위험에 대한 대응은 그 위험이 모든 기업에 존재하고 유의적 위험이므로 평가결과에 관계없이 다음을 수행한다. ①총계정원장에 기록된 분개와 재무제표의 작성시 이루어진 조정사항의 적절성을 테스트하고, ②회계추정치에 편의가 있는지 검토하고 편의가 있다면 이를 유발하는 환경이 부정으로 인한 중요왜곡표시위험을 나타내는 것인지 여부를 평가하며, ③기업의 정상적인 사업과정을 벗어나는 거래 또는 비경상적으로 보이는 유의적 거래의 사업상 합리성을 평가한다."}, "t303": {"kw": ["[분개 테스트] 분개·기타조정사항 처리와 관련하여 부적합하거나 비경상적인 행위에 대해 재무보고절차에 관여하는 사람들에게 질문, 보고기간말에 이루어진 분개 및 기타조정사항을 추출, 보고기간 전체를 통하여 이루어진 분개 및 기타조정사항을 테스트할 필요가 있는지 고려", "[회계추정치 편의 검토] 경영진의 판단과 결정이 부정으로 인한 중요왜곡표시위험을 의미할 수 있는 편의가능성을 나타내는지 여부를 평가, 전기재무제표에 반영된 유의적 회계추정치에 관련된 경영진의 판단과 가정들을 소급해서 재검토", "[정상 사업과정 벗어난 거래] 비경상적 거래가 부정한 재무보고나 자산횡령을 은폐하기 위해 체결되었는지 여부를 평가"], "ans": "경영진의 통제무력화 위험에 대한 대응절차는 다음과 같다. ①총계정원장에 기록된 분개와 재무제표 작성시 이루어진 조정사항의 적절성을 테스트하기 위하여 분개·기타조정사항 처리와 관련하여 부적합하거나 비경상적인 행위에 대해 재무보고절차에 관여하는 사람들에게 질문하고, 보고기간말에 이루어진 분개 및 기타조정사항을 추출하며, 보고기간 전체를 통하여 이루어진 분개 및 기타조정사항을 테스트할 필요가 있는지 고려한다. ②회계추정치에 편의가 있는지 검토할 때 경영진이 재무제표에 반영된 제반 회계추정을 할 때 행한 판단과 결정이 부정으로 인한 중요왜곡표시위험을 의미할 수 있는 편의가능성을 나타내는지 여부를 평가하고, 전기재무제표에 반영된 유의적 회계추정치에 관련된 경영진의 판단과 가정들을 소급해서 재검토한다. ③기업의 정상적인 사업과정을 벗어나는 거래가 부정한 재무보고나 자산의 횡령을 은폐하기 위하여 체결되었음을 나타내는 것인지 여부를 평가한다."}, "t304": {"kw": ["부정으로 인한 중요왜곡표시위험의 평가 및 그러한 평가에 대응하였던 감사절차(추가감사절차)의 성격·시기 및 범위에 미치는 영향을
